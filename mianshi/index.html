<style>

      --sep:rgba(84,84,88,.5); --sep2:rgba(84,84,88,.65); --tint:#0a84ff; --tint-soft:#0a2647;
      --red:#ff453a; --green:#30d158; --orange:#ff9f0a; --gray:#98989d; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
      --red-soft:#3a1715; --green-soft:#10301a; --orange-soft:#3a2a0c;
      --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--text);background:var(--bg);padding:22px 16px 60px;min-height:100vh;font-size:15px;line-height:1.45}
  .wrap{max-width:1040px;margin:0 auto}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .nav{display:flex;gap:6px;background:var(--fill);padding:3px;border-radius:11px}
  .nav button{border:none;background:transparent;border-radius:8px;padding:7px 15px;font-size:14px;font-weight:500;color:var(--text);transition:.18s}

  .countdown{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .countdown .big{font-size:clamp(40px,8vw,60px);font-weight:700;letter-spacing:-.03em;line-height:.95;color:var(--tint);font-variant-numeric:tabular-nums}
  .countdown .big small{font-size:15px;font-weight:500;color:var(--text2);margin-left:7px}
  .countdown .meta{flex:1;min-width:200px}
  .countdown .meta .lab{font-size:13px;color:var(--text2)}
  .countdown .meta .ttl{font-size:18px;font-weight:600;margin:1px 0 9px}
  .pbar{height:8px;border-radius:5px;background:var(--fill2);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--tint);border-radius:5px}
  .countdown .meta .pn{font-size:12px;color:var(--text2);margin-top:5px}

  .cal{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
  .calleft{display:flex;flex-direction:column;gap:16px;min-width:0}
  @media(max-width:780px){.cal{grid-template-columns:1fr}}
  .panel{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
  .seclab{font-size:12px;font-weight:600;color:var(--text2);margin:16px 0 7px}
  .seclab:first-child{margin-top:0}

  .gi{display:flex;align-items:center;gap:11px;padding:11px 13px;border-top:1px solid var(--sep);cursor:pointer}
  .gi:first-child{border-top:none}

  .mbar{height:5px;border-radius:3px;background:var(--fill2);overflow:hidden;margin-top:7px;max-width:200px}

  .mod-h{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}

  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}

  textarea.ans{font-size:17px;line-height:1.8;min-height:220px}

  .testbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}

  .score{font-size:clamp(46px,10vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .score.g{color:var(--green)} .score.o{color:var(--orange)} .score.r{color:var(--red)}
  .tk.ok{color:var(--text)}
  .tk.miss{color:var(--red);background:var(--red-soft);border-radius:3px;cursor:pointer;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:4px}
  .tk.ovr{color:var(--orange);background:var(--orange-soft);border-radius:3px;cursor:pointer}
  ins.ex{text-decoration:line-through;color:var(--gray);font-size:.82em;margin:0 1px;background:var(--fill);border-radius:3px;padding:0 2px}
  .pu{color:var(--text3)}
  .legend{font-size:12px;color:var(--text2);line-height:1.8}
  .legend span{margin-right:10px}
  .yours{white-space:pre-wrap;font-size:14px;line-height:1.8;color:var(--text2);background:var(--fill);border-radius:9px;padding:10px 12px}
  details summary{cursor:pointer;font-size:13px;color:var(--tint);font-weight:600;margin:6px 0}
  .ctx{font-size:14px;color:var(--text2);background:var(--fill);border-radius:9px;padding:8px 11px;margin-bottom:10px;line-height:1.7}

  .rowlog{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--sep);cursor:pointer;font-size:14px}
  .rowlog:first-child{border-top:none}
  .rowlog .tm{font-size:12px;color:var(--text2);width:42px;flex:none;font-variant-numeric:tabular-nums}

  /* ===== PWA / iOS 适配 ===== */
  html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
  @supports(top:env(safe-area-inset-top)){
    body{padding:calc(22px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    .scrim{padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
    #toast{bottom:calc(28px + env(safe-area-inset-bottom))}
  }
  @media(max-width:560px){
    input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{font-size:16px}

</style>
<div class="wrap">
  <header class="top">
    <div class="brand">面试背诵</div>
    <nav class="nav" id="nav">
      <button data-t="today">今天</button><button data-t="lib">内容库</button><button data-t="log">记录</button><button data-t="set">设置</button>
    </nav>
  </header>

</div>

<script>
"use strict";
/* ===== 0. 常量 & 状态 =====
   数据只存本 App 自己的键（IndexedDB ms-db / localStorage ms-*），和 Study Hub 互不读写。
   云同步只写 study-data 仓库里的 mianshi/data.json 一个文件；Study Hub 只删它自己清单里的文件，碰不到这里。 */
const APP_VER="v2 · 2026-10-30";
const LS_KEY="ms-db";
const COLORS=["#007aff","#34c759","#ff9500","#ff3b30","#af52de","#5ac8fa","#ff2d55","#a2845e"];
const DEF_SET={examDate:"",pass:90,good:95,intervals:[1,2,4,7,15,30],numStrict:true,upd:0};
let db=null;
const VIEW={tab:"today"};
let S=null; /* 正在背 / 默写的会话 */

/* ===== 1. 工具 ===== */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return (n<10?"0":"")+n; }
function dkey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return dkey(new Date()); }
function addDays(k,n){ const a=k.split("-").map(Number); return dkey(new Date(a[0],a[1]-1,a[2]+n,12)); }
function dayDiff(a,b){ const p=a.split("-").map(Number), q=b.split("-").map(Number); return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/86400000); }
function md(k){ if(!k) return ""; const a=k.split("-"); return (+a[1])+"-"+(+a[2]); }
function hm(ts){ const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtDur(s){ s=Math.round(s||0); return Math.floor(s/60)+":"+pad(s%60); }
function hasLS(){ try{ localStorage.setItem("ms-t","1"); localStorage.removeItem("ms-t"); return true; }catch(e){ return false; } }
let toastT=null;
function toast(t,ms){ const el=$("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),ms||2400); }
function scCls(s){ return s>=db.settings.good?"g":s>=db.settings.pass?"o":"r"; }
function hashStr(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16); }
function openModal(html){ $("modal").innerHTML=html; $("scrim").classList.add("on"); }
function closeModal(){ $("scrim").classList.remove("on"); $("modal").innerHTML=""; }
$("scrim").addEventListener("click",e=>{ if(e.target===$("scrim")) closeModal(); });

/* ===== 2. 存储（IndexedDB 为主，localStorage 兜底镜像） ===== */
function blankDb(){ return {v:1,savedAt:"",settings:Object.assign({},DEF_SET),topics:[],items:[],logs:[]}; }
function normalizeDb(d){
  if(!d||typeof d!=="object") d=blankDb();
  d.v=1; d.settings=Object.assign({},DEF_SET,d.settings||{});
  if(!Array.isArray(d.settings.intervals)||!d.settings.intervals.length) d.settings.intervals=DEF_SET.intervals.slice();
  ["topics","items","logs"].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  return d;
}
function idbOpen(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("ms-db",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function idbGet(k){ try{ const d=await idbOpen(); return await new Promise(res=>{ const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); }catch(e){ return undefined; } }
async function idbPut(k,v){ try{ const d=await idbOpen(); await new Promise(res=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=res; }); return true; }catch(e){ return false; } }
async function loadDb(){
  let a=null,b=null;
  const s=await idbGet("db"); if(typeof s==="string"){ try{ a=JSON.parse(s); }catch(e){} }
  if(hasLS()){ try{ const t=localStorage.getItem(LS_KEY); if(t) b=JSON.parse(t); }catch(e){} }
  /* 两处都有就合并（按条目取新），不会因为一处写失败丢东西 */
  db=normalizeDb(a&&b?mergeDb(a,b):(a||b));
}
let persistT=null;
function persist(){ const s=JSON.stringify(db); idbPut("db",s); if(hasLS()){ try{ localStorage.setItem(LS_KEY,s); }catch(e){} } }
function save(){ db.savedAt=new Date().toISOString(); IDX=null; persist(); syncSoon(); }
function touch(o){ o.upd=Date.now(); return o; }

/* ===== 2.5 合并 + 云同步（GitHub Contents API，单文件 mianshi/data.json） =====
   合并规则：话题、内容、记录都按 id 合并，同一条取 upd 新的；删除是打 del 标记（墓碑），不会被旧设备“复活”。
   复习进度不单独存，每次从记录重算，所以两台设备各背各的，合起来进度也对。 */
function pickNewer(x,y){ if(!x) return y; if(!y) return x; const a=x.upd||0,b=y.upd||0; if(a!==b) return a>b?x:y; return JSON.stringify(x)>=JSON.stringify(y)?x:y; }
function mergeArr(a,b){ const m=new Map(); (a||[]).forEach(o=>{ if(o&&o.id) m.set(o.id,o); }); (b||[]).forEach(o=>{ if(o&&o.id) m.set(o.id,pickNewer(m.get(o.id),o)); }); return Array.from(m.values()).sort((p,q)=>p.id<q.id?-1:p.id>q.id?1:0); }
function mergeDb(a,b){ a=a||{}; b=b||{};
  return { v:1, savedAt:(a.savedAt||"")>(b.savedAt||"")?a.savedAt:(b.savedAt||a.savedAt||""),
    settings:Object.assign({},DEF_SET,pickNewer(a.settings,b.settings)||{}),
    topics:mergeArr(a.topics,b.topics), items:mergeArr(a.items,b.items), logs:mergeArr(a.logs,b.logs) }; }
function fp(d){ const m=mergeDb(d,{}); delete m.savedAt; return hashStr(JSON.stringify(m)); }

const SY_DEFAULT_REPO="scarlett-dou/study-data";   /* 和 Study Hub 同一个私有仓库；写在这里不等于能访问（还要令牌） */
const SY={token:"",repo:"",branch:"main",path:"mianshi/data.json",sha:"",busy:false,pending:false,timer:null,status:"",last:0,fail:0,retryT:null};
function syLoad(){ if(!hasLS()) return; try{
  SY.token=localStorage.getItem("ms-token")||""; SY.repo=localStorage.getItem("ms-repo")||""; SY.sha=localStorage.getItem("ms-sha")||"";
  /* 同一个网站下 Study Hub 已经填过令牌，就直接沿用（令牌只授权 study-data 仓库，本 App 也只写那里） */
  if(!SY.token&&localStorage.getItem("cs-token")){ SY.token=localStorage.getItem("cs-token"); SY.repo=localStorage.getItem("cs-repo")||SY_DEFAULT_REPO; sySave(); SY.adopted=true; }
}catch(e){} }
function sySave(){ if(!hasLS()) return; try{ localStorage.setItem("ms-token",SY.token); localStorage.setItem("ms-repo",SY.repo); SY.sha?localStorage.setItem("ms-sha",SY.sha):localStorage.removeItem("ms-sha"); }catch(e){} }
function syOn(){ return !!(SY.token&&SY.repo); }
function sySet(t){ SY.status=t; renderFoot(); const el=$("syStatus"); if(el) el.textContent=syOn()?"已连接："+SY.repo+" · "+t:t; }
function b64enc(str){ const b=new TextEncoder().encode(str); let s="",CH=0x8000; for(let i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null,b.subarray(i,i+CH)); return btoa(s); }
function b64dec(b64){ const bin=atob((b64||"").replace(/\s/g,"")); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder().decode(b); }
async function syReq(method,body,accept){
  const url="https://api.github.com/repos/"+SY.repo+"/contents/"+SY.path.split("/").map(encodeURIComponent).join("/")+(method==="GET"?("?ref="+SY.branch+"&t="+Date.now()):"");
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),20000);
  try{ return await fetch(url,{method,cache:"no-store",signal:ac.signal,headers:{"Authorization":"Bearer "+SY.token,"Accept":accept||"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined}); }
  finally{ clearTimeout(t); }
}
async function syGet(){ /* → {data,sha} / {missing:true}；出错抛异常 */
  const r=await syReq("GET");
  if(r.status===404) return {missing:true};
  if(r.status===401||r.status===403) throw new Error("令牌无效或无权限");
  if(!r.ok) throw new Error("读取失败 "+r.status);
  const m=await r.json(); let text;
  if(m.content&&m.content.length) text=b64dec(m.content);
  else { const r2=await syReq("GET",null,"application/vnd.github.raw"); if(!r2.ok) throw new Error("读取失败 "+r2.status); text=await r2.text(); }
  return {data:JSON.parse(text),sha:m.sha};
}
function syncSoon(ms){ if(!syOn()) return; clearTimeout(SY.timer); SY.timer=setTimeout(syncNow,ms==null?6000:ms); }
async function syncNow(){
  if(!syOn()) return;
  if(SY.busy){ SY.pending=true; return; }
  SY.busy=true; clearTimeout(SY.retryT); sySet("同步中…");
  try{
    for(let round=0;round<4;round++){
      const g=await syGet();
      const remote=g.missing?null:normalizeDb(g.data);
      const merged=normalizeDb(remote?mergeDb(db,remote):mergeDb(db,{}));
      if(fp(merged)!==fp(db)){ db=merged; IDX=null; persist(); if(!["test","drill"].includes(VIEW.tab)) render(); }
      if(remote&&fp(merged)===fp(remote)){ SY.sha=g.sha; break; }   /* 云端已经和本机一样 */
      const body={message:"mianshi sync "+new Date().toISOString(),content:b64enc(JSON.stringify(merged)),branch:SY.branch};
      if(!g.missing) body.sha=g.sha;
      const r=await syReq("PUT",body);
      if(r.status===409||r.status===422) continue;   /* 别处刚推过：重新读、重新合，不盲目覆盖 */
      if(r.status===401||r.status===403) throw new Error("令牌无效或无权限");
      if(!r.ok) throw new Error("上传失败 "+r.status);
      try{ const j=await r.json(); SY.sha=j.content.sha; }catch(e){}
      break;
    }
    sySave(); SY.last=Date.now(); SY.fail=0; sySet("已同步 "+hm(SY.last));
  }catch(e){
    SY.fail++; const wait=Math.min(300000,15000*Math.pow(2,SY.fail-1));
    sySet("云端未同步（"+(e&&e.name==="AbortError"?"超时":(e&&e.message||"网络错误"))+"），"+Math.round(wait/1000)+" 秒后重试");
    SY.retryT=setTimeout(syncNow,wait);
  }finally{
    SY.busy=false;
    if(SY.pending){ SY.pending=false; syncSoon(1500); }
  }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") syncSoon(300); else if(syOn()) syncNow(); });

/* ===== 3. 逐字比对内核 =====
   ·标点、空格不计；全角半角统一；阿拉伯数字和中文数字算同一个（7年＝七年，110亩＝一百一十亩）。
   ·按「最长公共子序列」对齐原文和她写的：原文里没对上的＝漏/错（红），多写的＝多（灰色删除线）。
   ·数字是关键信息，权重 3；多写的字扣 0.5（同一处写错字只算一次错，不重复扣）。
   ·语音识别把人名听错了可以点红字「算对」（改判），分数当场重算。 */
const CN_D={"零":0,"〇":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
const CN_U={"十":10,"百":100,"千":1000};
const CN_ALL="零〇一二三四五六七八九十百千万亿";
function cnToNum(s){
  if(!/[零〇一二三四五六七八九]/.test(s)&&s[0]!=="十") return null;
  if(!/[十百千]/.test(s)) return s.split("").map(c=>CN_D[c]).join("");
  let sec=0,num=0;
  for(const c of s){
    if(c in CN_D) num=CN_D[c];
    else if(c in CN_U){ sec+=(num||1)*CN_U[c]; num=0; }
  }
  return String(sec+num);
}
const WORD=/[\p{L}\p{N}]/u;
function tokenize(s){
  const out=[]; let i=0; const n=s.length;
  while(i<n){
    let c=s[i]; const cc=c.charCodeAt(0);
    if(cc>=0xFF10&&cc<=0xFF19) c=String.fromCharCode(cc-0xFEE0);
    if(/[0-9]/.test(c)){ let j=i, t="";
      while(j<n){ let d=s[j]; const k=d.charCodeAt(0); if(k>=0xFF10&&k<=0xFF19) d=String.fromCharCode(k-0xFEE0);
        if(/[0-9]/.test(d)){ t+=d; j++; } else if((d==="."||d===","||d==="．"||d==="，")&&j+1<n&&/[0-9０-９]/.test(s[j+1])&&t){ if(d==="."||d==="．") t+="."; j++; } else break; }
      t=t.replace(/^0+(?=\d)/,""); out.push({t,a:i,b:j,num:true}); i=j; continue; }
    if(CN_ALL.includes(c)){ let j=i; while(j<n&&CN_ALL.includes(s[j])&&s[j]!=="万"&&s[j]!=="亿") j++;
      /* 万、亿 永远单独算一个字：「七百六十万」＝760＋万，和原文「760万」对得上 */
      if(j===i){ out.push({t:c,a:i,b:i+1,num:false}); i++; continue; }
      const run=s.slice(i,j), v=cnToNum(run);
      if(v!==null){ out.push({t:v,a:i,b:j,num:true}); i=j; continue; }
      for(let k=i;k<j;k++) out.push({t:s[k],a:k,b:k+1,num:false}); i=j; continue; }
    if(WORD.test(c)){ out.push({t:c.toLowerCase(),a:i,b:i+1,num:false}); }
    i++;
  }
  return out;
}
/* 原文分句：。！？；和换行处断开，每句单独打分，保证每一句都过关 */
function splitSegs(text){
  const segs=[]; let st=0;
  for(let i=0;i<text.length;i++){ if(/[。！？；!?;\n]/.test(text[i])){ let j=i+1; while(j<text.length&&/[”’」』）)\s]/.test(text[j])&&text[j]!=="\n") j++; segs.push([st,j]); st=j; i=j-1; } }
  if(st<text.length) segs.push([st,text.length]);
  return segs.map(([a,b])=>({a,b,text:text.slice(a,b).trim()})).filter(x=>tokenize(x.text).length>0);
}
function align(A,B){
  const n=A.length,m=B.length,W=m+1;
  const L=new Uint16Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i*W+j]=A[i].t===B[j].t?L[(i+1)*W+j+1]+1:Math.max(L[(i+1)*W+j],L[i*W+j+1]);
  const am=new Int32Array(n).fill(-1), ins=[]; for(let g=0;g<=n;g++) ins.push([]);
  let i=0,j=0;
  while(i<n&&j<m){
    if(A[i].t===B[j].t&&L[i*W+j]===L[(i+1)*W+j+1]+1){ am[i]=j; i++; j++; }
    else if(L[(i+1)*W+j]>=L[i*W+j+1]) i++;
    else { ins[i].push(j); j++; }
  }
  while(j<m){ ins[n].push(j); j++; }
  return {am,ins};
}
/* 对一段原文 token 区间 [lo,hi) 打分；多写的字归到它前面那个原文字所在的句子 */
function scoreRange(A,al,ov,lo,hi,isFirst){
  let tot=0,got=0,pen=0;
  for(let i=lo;i<hi;i++){ const w=A[i].num?3:1; tot+=w; if(al.am[i]>=0||ov.has(i)) got+=w; }
  const gaps=[]; for(let g=lo+1;g<=hi;g++) gaps.push(g); if(isFirst) gaps.unshift(0);
  gaps.forEach(g=>{ const k=al.ins[g].length; if(!k) return; let d=0,p=g-1; while(p>=0&&al.am[p]<0&&!ov.has(p)){ d++; p--; } pen+=Math.max(0,k-d)*0.5; });
  if(!tot) return 100;
  return Math.max(0,Math.min(100,Math.floor(100*(got-pen)/tot+1e-9)));
}
/* 批改：原文 + 她写的 + 改判集合 → 总分、每句分、对齐结果 */
function grade(text,input,ovArr){
  const A=tokenize(text), B=tokenize(input||""), al=align(A,B), ov=new Set(ovArr||[]);
  const segs=splitSegs(text).map(s=>{ let lo=A.findIndex(t=>t.a>=s.a); if(lo<0) lo=A.length; let hi=lo; while(hi<A.length&&A[hi].a<s.b) hi++; return Object.assign({lo,hi},s); }).filter(s=>s.hi>s.lo);
  const miss=[]; for(let i=0;i<A.length;i++) if(al.am[i]<0&&!ov.has(i)) miss.push(i);
  /* 数字是事实，错一个这句就不算过（设置里可关）：分数压到合格线以下 */
  const strict=typeof db!=="undefined"&&db&&db.settings&&db.settings.numStrict!==false, cap=strict?db.settings.pass-1:100;
  const numBad=(lo,hi)=>miss.some(i=>i>=lo&&i<hi&&A[i].num);
  const segScores=segs.map((s,k)=>{ const v=scoreRange(A,al,ov,s.lo,s.hi,k===0); return numBad(s.lo,s.hi)?Math.min(v,cap):v; });
  let score=scoreRange(A,al,ov,0,A.length,true); if(numBad(0,A.length)) score=Math.min(score,cap);
  return {A,B,al,ov,segs,segScores,score,missN:miss.length,numMiss:miss.filter(i=>A[i].num).length};
}
function diffHtml(text,input,g,seg){
  const {A,B,al,ov}=g; let out="", pos=seg.a;
  const exHtml=gap=>{ const js=al.ins[gap]; if(!js||!js.length) return ""; return '<ins class="ex">'+esc(js.map(j=>input.slice(B[j].a,B[j].b)).join(""))+"</ins>"; };
  if(seg.lo===0) out+=exHtml(0);
  for(let i=seg.lo;i<seg.hi;i++){
    if(i>seg.lo) out+=exHtml(i);
    if(A[i].a>pos) out+='<span class="pu">'+esc(text.slice(pos,A[i].a))+"</span>";
    const cls=al.am[i]>=0?"ok":ov.has(i)?"ovr":"miss";
    out+='<span class="tk '+cls+'"'+(cls==="ok"?"":' data-i="'+i+'"')+">"+esc(text.slice(A[i].a,A[i].b))+"</span>";
    pos=A[i].b;
  }
  out+=exHtml(seg.hi);
  if(seg.b>pos) out+='<span class="pu">'+esc(text.slice(pos,seg.b))+"</span>";
  return out;
}

/* ===== 4. 复习内核（进度从记录重算） =====
   ·新内容：当天先看、再默写，全文默写过合格线（默认 90）才算「学会」，第二天开始复习。
   ·复习间隔 1→2→4→7→15→30 天：当天第一次全文默写 ≥优秀线（95）进下一档；在合格线和优秀线之间原档再来一次；没过合格线退回 1 天，
     并且当天进「重练」——先只练错句（每句都要过合格线），再全文默写一遍过了才算完。
   ·看过原文再写的、首字提示写的、单句练习，都不算复习成绩（不改进度），只有不看原文的全文默写算。
   ·提前（没到期）默写：没过就退回 1 天，过了不改进度。
   ·设了面试日期：复习日不会排到面试前一天之后，保证面试前每条都再过一遍。 */
let IDX=null;
function index(){
  if(IDX) return IDX;
  const by=new Map(); db.logs.forEach(l=>{ if(l.del) return; if(!by.has(l.itemId)) by.set(l.itemId,[]); by.get(l.itemId).push(l); });
  by.forEach(a=>a.sort((x,y)=>x.ts-y.ts));
  const st=new Map(); db.items.forEach(it=>{ if(!it.del) st.set(it.id,replay(it,by.get(it.id)||[])); });
  IDX={by,st}; return IDX;
}
function replay(it,logs){
  const P=db.settings.pass, G=db.settings.good, INT=db.settings.intervals, ex=db.settings.examDate, td=today();
  let introduced=false,introDay=null,k=0,due=null,last=null,lastFull=null,mastered=false;
  const days=new Map(); logs.forEach(l=>{ if(l.kind!=="full") return; if(!days.has(l.day)) days.set(l.day,[]); days.get(l.day).push(l); });
  const cap=(d,nd)=>{ if(ex&&d<addDays(ex,-1)&&nd>addDays(ex,-1)) return addDays(ex,-1); return nd; };
  Array.from(days.keys()).sort().forEach(d=>{
    const arr=days.get(d), first=arr[0].score, anyPass=arr.some(l=>l.score>=P);
    lastFull=arr[arr.length-1];
    if(!introduced){ if(anyPass){ introduced=true; introDay=d; k=0; due=cap(d,addDays(d,INT[0])); } return; }
    if(d<due){ if(first<P){ k=0; due=addDays(d,INT[0]); mastered=false; } return; }
    if(first>=G) k=Math.min(k+1,INT.length-1); else if(first<P) k=0;
    mastered=first>=G&&k===INT.length-1;
    due=cap(d,addDays(d,INT[k]));
  });
  const tl=logs.filter(l=>l.kind==="full"&&l.day===td);
  const todayFirst=tl.length?tl[0].score:null, todayPass=tl.some(l=>l.score>=P);
  const anyToday=logs.some(l=>l.day===td);
  /* 薄弱句：最近一次全文默写里没过合格线的句子（原文改过就不算） */
  let weak=[]; if(lastFull&&lastFull.th===hashStr(it.text)) weak=(lastFull.segs||[]).map((s,i)=>s<P?i:-1).filter(i=>i>=0);
  last=lastFull?lastFull.score:null;
  return {introduced,introDay,k,due,last,lastFull,mastered,todayFirst,todayPass,anyToday,weak,nFull:logs.filter(l=>l.kind==="full").length};
}
function stageLabel(s){
  if(!s.introduced) return {t:"待学",c:""};
  if(s.mastered) return {t:"已掌握",c:"g"};
  return {t:"第 "+(s.k+1)+" 轮",c:s.k>=3?"g":s.k>=1?"b":"o"};
}
function mastPct(s){ if(!s.introduced) return 0; const n=db.settings.intervals.length; return Math.round(100*(s.mastered?n:s.k+0.5)/n); }
function liveItems(){ return db.items.filter(i=>!i.del); }
function liveTopics(){ return db.topics.filter(t=>!t.del).sort((a,b)=>(a.order||0)-(b.order||0)||(a.id<b.id?-1:1)); }
function topicOf(it){ return db.topics.find(t=>t.id===it.topicId&&!t.del)||{name:"未分话题",color:"#8e8e93"}; }
/* 今天的四类 */
/* 一条内容今天属于哪一类：learn 待学 / redo 重练 / due 到期复习 / done 今日已过 / none 今天不用背 */
function catOf(s){
  if(!s) return "none";
  if(!s.introduced) return "learn";
  if(s.todayFirst!==null) return s.todayPass?"done":"redo";   /* 今天全文默写过：有一次过线就算过（第一次没过的，进度已经退回 1 天） */
  if(s.due&&s.due<=today()) return "due";
  return "none";
}
function todayLists(){
  const st=index().st, L={redo:[],due:[],learn:[],done:[]};
  liveItems().sort((a,b)=>(a.order||0)-(b.order||0)).forEach(it=>{ const c=catOf(st.get(it.id)); if(c!=="none") L[c].push(it); });
  /* 今天默写过但还没学会的排在待学最前；到期复习按到期日，逾期久的先 */
  L.learn.sort((a,b)=>(st.get(a.id).todayFirst===null)-(st.get(b.id).todayFirst===null));
  L.due.sort((a,b)=>(st.get(a.id).due<st.get(b.id).due?-1:st.get(a.id).due>st.get(b.id).due?1:0));
  return L;
}

function upcoming(){

function startQueue(){

function nextInQueue(first){

  if(S.qi>=S.queue.length){ const left=todayLists(); toast(left.redo.length+left.learn.length?"这一轮走完了，还有没过的在「重练」「待学」里":"今天这一轮背完了 ✓",3500); return go("today"); }

function startLearn(id,from){ stopRec(); S=Object.assign({},keepQ(from),{itemId:id,from:from||(S&&S.from)||"today"}); VIEW.tab="learn"; render(); window.scrollTo(0,0); }

function leave(){ stopRec(); const f=S&&S.from||"today"; if(inQueue()&&f==="today"){ go("today"); } else go(f); }
function startTest(id,mode,from){

function hintHtml(text){

  return splitSegs(text).map(sg=>sg.text.split(/([，、。！？；：,;!?:\n“”"「」（）()])/).map(part=>{ const tk=tokenize(part); if(!tk.length) return '<span class="pu">'+esc(part)+"</span>"; const f=tk[0].num?"＿":part.slice(tk[0].a,tk[0].b); return "<b>"+esc(f)+"</b>"+"·".repeat(Math.min(30,Math.max(0,tk.length-1))); }).join("")).join("<br>");
}
function vTest(){

  let h='<div class="mod-h">'+esc(it.title)+'</div><div class="mod-sub">'+esc(tp.name)+" · "+modeLab+(inQueue()&&S.from==="today"?" · 今天第 "+(S.qi+1)+"/"+S.queue.length+" 条":"")+"</div>";
  h+='<div class="card">';

  if(S.peek) h+='<div class="ctx" style="color:var(--orange)">看过原文了，这次只算练习：</div><div class="ctx">'+esc(isSeg?sg.text:it.text)+"</div>";
  h+='<div class="testbar"><span class="timer" id="tmr">0:00</span><span style="flex:1"></span>'+(SR?'<button class="btn sec sm" id="micBtn" onclick="toggleRec()">🎤 开始说</button>':"")+'<button class="btn sec sm" onclick="peek()">看原文</button></div>';

  h+='<div class="desc" style="margin-top:10px">'+(SR?"「🎤 开始说」用浏览器自带识别（有的网络下用不了）；":"")+"更稳的是手机键盘上的🎤语音输入。人名、数字被识别错了，交卷后点红字可以改判成「算对」。</div></div>";

  return h;
}
function peek(){ if(!S.peek&&!confirm("看原文后这次默写只算练习，不算复习成绩。确定看？")) return; S.peek=true; const v=$("ans").value; render(); $("ans").value=v; S.draft=v; }
function submitTest(){

function showLog(id){ const l=db.logs.find(x=>x.id===id); if(!l) return; const from=["today","lib","log"].includes(VIEW.tab)?VIEW.tab:(S&&S.from)||"today"; S=Object.assign({},keepQ(from),{from,itemId:l.itemId,logId:id,view:true}); VIEW.tab="result"; render(); window.scrollTo(0,0); }
function vResult(){
  const l=db.logs.find(x=>x.id===S.logId), it=l&&db.items.find(i=>i.id===l.itemId); if(!l||!it) return vToday();
  const text=l.kind==="seg"?(splitSegs(it.text)[l.segIdx]||{}).text||"":it.text;
  if(l.th&&l.th!==hashStr(it.text)) return '<div class="mod-h">'+esc(it.title)+'</div><div class="card"><div class="empty">这条默写之后原文改过，没法再按原文逐字对照。当时 '+l.score+' 分。</div><div class="seclab">当时写的</div><div class="yours">'+esc(l.input)+'</div></div><div class="btnrow"><button class="btn sec" onclick="leave()">返回</button></div>';
  const g=grade(text,l.input,l.ov), P=db.settings.pass, G=db.settings.good, s=index().st.get(it.id);
  const weak=g.segScores.map((x,i)=>x<P?i:-1).filter(i=>i>=0);
  let verdict="";
  const latest=(index().by.get(it.id)||[]).filter(x=>x.kind==="full").slice(-1)[0];
  if(l.kind==="full"&&(l.day!==today()||!latest||latest.id!==l.id)) verdict="";
  else if(l.kind==="full"){
    if(!s.introduced) verdict="还没过合格线 "+P+"，这条还算「待学」。先练错句，再全文默一遍。";
    else if(l.day===today()&&s.todayFirst!==null&&s.todayFirst<P&&!s.todayPass) verdict="没过合格线 "+P+"：复习间隔退回 1 天，今天要先把错句练过、再全文过一遍。";
    else if(l.day===today()&&s.todayFirst!==null&&s.todayFirst<P&&s.todayPass) verdict="重练过关 ✓ 明天（"+md(s.due)+"）再复习。";
    else if(s.introDay===today()) verdict="学会了 ✓ 明天（"+md(s.due)+"）开始复习。";
    else verdict=(l.score>=G?"优秀 ✓ ":"过了合格线，")+"下次复习 "+md(s.due)+(s.mastered?"（已掌握，之后每 "+db.settings.intervals[db.settings.intervals.length-1]+" 天过一次）":"")+(l.score<G&&s.introduced?"。没到 "+G+" 分，间隔不升档。":"。");
  } else if(l.kind==="hint") verdict="练习成绩，不改复习进度。"+(g.score>=P?"可以试试不看原文全文默写了。":"");
  else verdict=g.score>=P?"这句过了。":"这句还没过。";
  let h='<div class="mod-h">'+esc(it.title)+'</div><div class="mod-sub">'+md(l.day)+" "+hm(l.ts)+" · "+(l.kind==="full"?"全文默写":l.kind==="hint"?"练习默写":"单句练习")+" · 用时 "+fmtDur(l.dur)+"</div>";
  h+='<div class="countdown"><div class="score '+scCls(g.score)+'">'+g.score+'<small style="font-size:15px;color:var(--text2);margin-left:6px;font-weight:500">分</small></div><div class="meta"><div class="ttl" style="margin-bottom:4px">'+(g.score>=G?"优秀":g.score>=P?"过关":"没过")+'</div><div class="pn" style="font-size:13px">'+esc(verdict)+"</div>"+'<div class="pn">漏写/写错 '+g.missN+" 处"+(g.numMiss?"（其中数字 "+g.numMiss+" 处"+(db.settings.numStrict!==false?"，数字错的句子不算过":"")+"）":"")+(g.ov.size?" · 改判算对 "+g.ov.size+" 处":"")+"</div></div></div>";
  h+='<div class="card"><div class="legend"><span>黑字＝对</span><span style="color:var(--red)">红字＝漏写或写错（点一下改判算对）</span><span style="color:var(--gray)">灰色删除线＝多写的</span></div>';
  h+='<div id="dff">'+g.segs.map((sg,i)=>'<div class="sline'+(g.segScores[i]<P?" weak":"")+'"><div class="sn"><span class="chip '+scCls(g.segScores[i])+'">'+g.segScores[i]+'</span></div><div class="sx">'+diffHtml(text,l.input,g,sg)+"</div></div>").join("")+"</div>";
  h+='<details><summary>看我写的原样</summary><div class="yours">'+esc(l.input)+"</div></details></div>";
  h+='<div class="btnrow">';
  if(weak.length&&l.kind!=="seg") h+='<button class="btn" onclick="startDrill(\''+it.id+'\',null,'+JSON.stringify(weak)+')">只练错句（'+weak.length+" 句）</button>";
  h+='<button class="btn '+(weak.length?"sec":"")+'" onclick="startTest(\''+it.id+'\',\'full\')">再全文默一遍</button>';
  if(inQueue()&&S.from==="today") h+='<button class="btn sec" onclick="nextInQueue()">下一条 →</button>';
  h+='<button class="btn sec" onclick="leave()">返回</button></div>';
  afterFns.push(()=>{ $("dff").onclick=e=>{ const t=e.target.closest(".tk[data-i]"); if(!t) return; const i=+t.dataset.i; const ov=new Set(l.ov||[]); ov.has(i)?ov.delete(i):ov.add(i); l.ov=Array.from(ov).sort((a,b)=>a-b);
    const g2=grade(text,l.input,l.ov); l.score=g2.score; l.segs=g2.segScores; touch(l); save(); const y=window.scrollY; render(); window.scrollTo(0,y); }; });
  return h;
}
/* 错句重练：每句写到过合格线为止（没过的排到队尾再来），全部过了再全文默一遍 */
function startDrill(id,from,segList){
  stopRec(); const it=getItem(id), s=index().st.get(id);
  const list=(segList&&segList.length?segList:s.weak).slice(); if(!list.length) return startTest(id,"full",from);
  S=Object.assign({},keepQ(from),{itemId:id,from:from||(S&&S.from)||"today",drill:list,mode:"full"});
  nextSeg();
}
function nextSeg(){ if(!S.drill.length){ VIEW.tab="drill"; S.seg=null; render(); return; } S.seg=S.drill[0]; S.t0=Date.now(); S.peek=false; S.draft=""; VIEW.tab="test"; render(); window.scrollTo(0,0); }
function afterSeg(log){
  const P=db.settings.pass, it=getItem(S.itemId), sg=splitSegs(it.text)[S.seg], g=grade(sg.text,log.input,[]);
  const passed=log.score>=P&&!S.peek;
  S.drill.shift(); if(!passed) S.drill.push(S.seg);
  const h='<div class="mhead"><div><div class="d">第 '+(S.seg+1)+" 句 · "+log.score+' 分</div><div class="desc">'+(passed?"过了 ✓":"没过（"+(S.peek?"看了原文":"不到 "+P)+"），排到后面再来一次")+'</div></div><button class="x" onclick="closeModal()">×</button></div><div class="mbody"><div class="legend"><span style="color:var(--red)">红＝漏/错</span><span style="color:var(--gray)">灰色删除线＝多写</span></div><div class="srctext" style="font-size:16px">'+g.segs.map(x=>diffHtml(sg.text,log.input,g,x)).join("")+'</div><div class="btnrow" style="margin-top:14px"><button class="btn" onclick="closeModal()">'+(S.drill.length?"下一句（还剩 "+S.drill.length+"）":"错句都过了 → 全文默写")+"</button></div></div>";
  nextSeg(); openModal(h);
}
function vDrill(){
  const it=getItem(S.itemId);
  return '<div class="ph"><h3>错句都过了 ✓</h3><p>现在不看原文把「'+esc(it.title)+'」全文默一遍，过了合格线今天这条才算完。</p><div class="btnrow" style="justify-content:center;margin-top:16px"><button class="btn" onclick="startTest(\''+it.id+'\',\'full\')">全文默写</button><button class="btn sec" onclick="leave()">返回</button></div></div>';
}

/* ===== 8.5 语音识别（浏览器自带，可用才显示按钮） ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let REC=null;
function toggleRec(){ if(REC){ stopRec(); return; }
  try{ REC=new SR(); }catch(e){ toast("语音识别用不了，请用键盘上的🎤语音输入"); return; }
  REC.lang="zh-CN"; REC.continuous=true; REC.interimResults=true; REC.want=true;
  REC.onresult=e=>{ let fin="",tmp=""; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript; else tmp+=r[0].transcript; }
    const a=$("ans"); if(a&&fin){ a.value+=fin; S.draft=a.value; } const im=$("interim"); if(im) im.textContent=tmp; };
  REC.onerror=e=>{ const m={"not-allowed":"没有麦克风权限","network":"网络连不上识别服务","no-speech":"没听到声音"}[e.error]; if(e.error!=="no-speech"){ toast((m||"识别出错")+"，可以改用键盘上的🎤语音输入",4000); if(REC) REC.want=false; } };
  REC.onend=()=>{ if(REC&&REC.want){ try{ REC.start(); }catch(e){} } else { REC=null; const b=$("micBtn"); if(b) b.textContent="🎤 开始说"; } };
  try{ REC.start(); const b=$("micBtn"); if(b) b.textContent="⏹ 停"; }catch(e){ REC=null; toast("语音识别启动失败"); }
}
function stopRec(){ if(REC){ REC.want=false; try{ REC.stop(); }catch(e){} REC=null; const b=$("micBtn"); if(b) b.textContent="🎤 开始说"; const im=$("interim"); if(im) im.textContent=""; } }

/* ===== 9. 记录 ===== */
function vLog(){
  const logs=db.logs.filter(l=>!l.del&&getItem(l.itemId)).sort((a,b)=>b.ts-a.ts);
  let h='<div class="mod-h">记录</div><div class="mod-sub">每一次默写都在这里，点开能看逐字批改。只有「全文默写」改复习进度。</div>';
  if(!logs.length) return h+'<div class="ph"><h3>还没有记录</h3></div>';
  const days=[]; const m=new Map(); logs.forEach(l=>{ if(!m.has(l.day)){ m.set(l.day,[]); days.push(l.day); } m.get(l.day).push(l); });
  days.slice(0,30).forEach(d=>{ const a=m.get(d), f=a.filter(l=>l.kind==="full"); const avg=f.length?Math.round(f.reduce((s,l)=>s+l.score,0)/f.length):null;
    const tm=a.reduce((s,l)=>s+(l.dur||0),0);
    h+='<div class="card"><h4><span style="flex:1">'+md(d)+(d===today()?"（今天）":"")+'</span><span class="chip">全文默写 '+f.length+" 次"+(avg!=null?" · 平均 "+avg:"")+" · 共 "+fmtDur(tm)+"</span></h4>";
    a.forEach(l=>{ const it=getItem(l.itemId); h+='<div class="rowlog" onclick="showLog(\''+l.id+'\')"><span class="tm">'+hm(l.ts)+'</span><span class="tt">'+esc(it.title)+'<span class="desc"> · '+(l.kind==="full"?"全文":l.kind==="hint"?"练习":"第 "+(l.segIdx+1)+" 句")+'</span></span><span class="chip '+scCls(l.score)+'">'+l.score+"</span></div>"; });
    h+="</div>"; });
  return h;
}

/* ===== 10. 设置 ===== */
function goSync(){ go("set"); setTimeout(()=>{ const e=$("syCard"); if(e) e.scrollIntoView(); },60); }
function vSet(){
  const st=db.settings;
  let h='<div class="mod-h">设置</div><div class="mod-sub">复习规则、云同步、导入导出。</div>';
  h+='<div class="card"><h4>面试与评分</h4><div class="frow"><div class="field"><label>面试日期</label><input type="date" id="sEx" value="'+esc(st.examDate)+'"><div class="desc">填了就有倒计时，复习也不会排到面试前一天之后。</div></div><div class="field"><label>合格线</label><input type="number" id="sP" value="'+st.pass+'" min="50" max="100"><div class="desc">每句、全文都要到这个分才算过。</div></div><div class="field"><label>优秀线</label><input type="number" id="sG" value="'+st.good+'" min="50" max="100"><div class="desc">复习时第一次就到这个分，间隔才升一档。</div></div></div>';
  h+='<div class="field"><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="sN"'+(st.numStrict!==false?" checked":"")+'> 数字错了，这句不算过</label><div class="desc">年份、人数、金额这类数字是事实，说错比漏几个字严重。勾上时，一句里只要有数字错或漏，这句分数压到合格线以下。</div></div>';
  h+='<div class="field"><label>复习间隔（天）</label><input type="text" id="sI" value="'+st.intervals.join(",")+'"><div class="desc">用逗号隔开，默认 1,2,4,7,15,30。</div></div><button class="btn sm" onclick="saveSet()">保存</button></div>';
  h+='<div class="card" id="syCard"><h4>☁️ 云同步（GitHub 自动 · 推荐）</h4><div class="desc" id="syStatus" style="margin-bottom:8px">'+(syOn()?("已连接："+esc(SY.repo)+" · "+esc(SY.status||"打开即自动同步")):"未配置 —— 填入和 Study Hub 一样的<b>私有</b>仓库与令牌，电脑、手机开 App 自动拉、改完自动上传。")+'</div>';
  h+='<div class="frow"><div class="field"><label>数据仓库 owner/repo</label><input type="text" id="syRepo" placeholder="'+SY_DEFAULT_REPO+'" value="'+esc(SY.repo||SY_DEFAULT_REPO)+'"></div><div class="field"><label>访问令牌 Token</label><input type="password" id="syTok" autocomplete="off" placeholder="'+(SY.token?"（已保存，换令牌再粘贴）":"github_pat_… / ghp_…")+'" value=""></div></div>';
  h+='<div class="btnrow"><button class="btn sm" onclick="saveSync()">连接 / 保存</button>'+(syOn()?'<button class="btn sm sec" onclick="syncNow()">立即同步</button><button class="btn sm sec" onclick="syPeekCmp()">🔄 对比两边</button><button class="btn sm sec" onclick="syForcePull()">⬇️ 下载到本机</button><button class="btn sm sec" onclick="syForcePush()">⬆️ 上传到云端</button><button class="btn sm warn" onclick="dropSync()">断开</button>':"")+'</div><div id="syCmp"></div>';
  h+='<div class="desc" style="margin-top:10px">和 Study Hub 用<b>同一个仓库、同一个令牌</b>（在 Study Hub 的 设置 → 云同步 里就是那个），但只读写里面单独的 <b>mianshi/data.json</b>，两个 App 的数据互不影响。<br>平时不用点按钮：打开 App 自动拉，背完自动上传（几秒后），切到后台前也会传一次。两台设备各背各的，合起来按条合并，不会整份互相盖掉。<br>令牌只存在本机，不写进同步数据。iPhone「添加到主屏幕」后的 App 和 Safari 是两份存储，要在主屏幕 App 里再填一次。</div></div>';
  h+='<div class="card" id="impBox"><h4>导入 / 导出</h4><div class="desc" style="margin-bottom:10px">导入是<b>合并</b>，不会覆盖已有内容和记录。可以导入本 App 导出的 .json，也可以导入按下面格式写的文字（.txt 或直接粘贴）：<br><code># 话题名</code> 一行开新话题；<code>## 标题 | 提示</code> 一行开一条内容（提示可省）；下面的行都是这条的正文，到下一个 ## 或 # 为止。</div>';
  h+='<textarea id="impTxt" style="min-height:120px" placeholder="# 楷模案例&#10;## 毛相林（略版） | 实干为民 · 排比第一句&#10;无论是重庆巫山下庄村的老支书毛相林……"></textarea>';
  h+='<div class="btnrow"><button class="btn sm" onclick="importText($(\'impTxt\').value)">导入粘贴的文字</button><label class="btn sec sm" style="display:inline-block">选文件导入<input type="file" accept=".json,.txt,.md,text/plain,application/json" style="display:none" onchange="importFile(this)"></label><button class="btn sec sm" onclick="exportJson()">导出备份 .json</button></div></div>';
  return h;
}
function saveSet(){ const st=db.settings; const P=+$("sP").value, G=+$("sG").value; const I=$("sI").value.split(/[,，\s]+/).map(Number).filter(n=>n>0&&n<400);
  if(!(P>=50&&P<=100&&G>=P&&G<=100)) return toast("合格线 50–100，优秀线不低于合格线"); if(!I.length) return toast("间隔至少一个");
  st.examDate=$("sEx").value||""; st.numStrict=$("sN").checked; st.pass=P; st.good=G; st.intervals=I; touch(st); save(); render(); toast("已保存"); }
function saveSync(){ const rp=$("syRepo").value.trim()||SY_DEFAULT_REPO, tk=$("syTok").value.trim()||SY.token; if(!tk) return toast("请填写令牌");
  SY.repo=rp; SY.token=tk; SY.sha=""; SY.fail=0; sySave(); try{ localStorage.removeItem("ms-noadopt"); }catch(e){} render(); syncNow(); }
/* 对比两边：只读，不改任何一边 */
function syStats(d){ d=normalizeDb(d); return {items:d.items.filter(x=>!x.del).length, topics:d.topics.filter(x=>!x.del).length, full:d.logs.filter(x=>!x.del&&x.kind==="full").length, logs:d.logs.filter(x=>!x.del).length, savedAt:d.savedAt||""}; }
async function syPeekCmp(){ const box=$("syCmp"); if(!box) return; box.innerHTML='<div class="desc" style="margin-top:8px">读取云端…</div>';
  let r=null; try{ const g=await syGet(); r=g.missing?{items:0,topics:0,full:0,logs:0,savedAt:""}:syStats(g.data); }catch(e){ box.innerHTML='<div class="desc" style="margin-top:8px;color:var(--red)">读不到云端（'+esc(e.message||"网络")+'）。</div>'; return; }
  const l=syStats(db), row=(lab,a,b)=>'<tr><td style="padding:4px 8px;color:var(--text2)">'+lab+'</td><td style="padding:4px 8px'+(a<b?";color:var(--red);font-weight:600":"")+'">'+a+'</td><td style="padding:4px 8px'+(b<a?";color:var(--red);font-weight:600":"")+'">'+b+"</td></tr>";
  const ft=t=>{ try{ return t?new Date(t).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—"; }catch(e){ return "—"; } };
  box.innerHTML='<table style="border-collapse:collapse;font-size:13px;margin-top:10px"><tr><th></th><th style="padding:4px 8px;text-align:left">本机</th><th style="padding:4px 8px;text-align:left">云端</th></tr><tr><td style="padding:4px 8px;color:var(--text2)">保存时间</td><td style="padding:4px 8px">'+ft(l.savedAt)+'</td><td style="padding:4px 8px">'+ft(r.savedAt)+"</td></tr>"+row("话题",l.topics,r.topics)+row("内容条数",l.items,r.items)+row("全文默写次数",l.full,r.full)+row("全部记录",l.logs,r.logs)+'</table><div class="desc" style="margin-top:6px">标红＝这一边少。平时自动同步是按条合并的，两边会自己补齐；只有想整份放弃某一边时才用下载／上传。</div>'; }
/* ⬇️ 下载：用云端整份替换本机（本机多出来的会丢） */
async function syForcePull(){ if(!confirm("⬇️ 用云端数据整份替换本机？\n\n本机现在这份会被替换掉，本机有、云端没有的会丢。拿不准就先点「对比两边」。")) return;
  if(SY.busy) return toast("正在同步中，稍等");
  SY.busy=true; sySet("下载中…");
  try{ const g=await syGet(); if(g.missing){ toast("云端还没有数据"); sySet("云端还没有数据"); return; }
    db=normalizeDb(g.data); IDX=null; persist(); SY.sha=g.sha; sySave(); render(); sySet("已从云端下载 ✓ "+hm(Date.now())); toast("已下载云端数据 ✓"); }
  catch(e){ sySet("下载出错（"+(e.message||"网络")+"）"); }
  finally{ SY.busy=false; } }
/* ⬆️ 上传：用本机整份替换云端（云端多出来的会丢） */
async function syForcePush(){ if(!confirm("⬆️ 用本机数据整份替换云端？\n\n云端现在那份会被替换掉，云端有、本机没有的会丢。拿不准就先点「对比两边」。")) return;
  if(SY.busy) return toast("正在同步中，稍等");
  SY.busy=true; sySet("上传中…");
  try{ for(let i=0;i<3;i++){ const g=await syGet(); const body={message:"mianshi upload "+new Date().toISOString(),content:b64enc(JSON.stringify(db)),branch:SY.branch}; if(!g.missing) body.sha=g.sha;
      const r=await syReq("PUT",body); if(r.status===409||r.status===422) continue; if(!r.ok) throw new Error("上传失败 "+r.status);
      try{ SY.sha=(await r.json()).content.sha; }catch(e){} sySave(); sySet("已上传到云端 ✓ "+hm(Date.now())); toast("已上传到云端 ✓"); return; }
    throw new Error("云端一直在变，稍后再试"); }
  catch(e){ sySet("上传出错（"+(e.message||"网络")+"）"); }
  finally{ SY.busy=false; } }
function dropSync(){ if(!confirm("断开云同步？本机数据保留，只是不再自动上传/下载。")) return; SY.token=""; SY.sha=""; SY.status=""; sySave(); try{ localStorage.setItem("ms-noadopt","1"); }catch(e){} render(); }
function exportJson(){ const blob=new Blob([JSON.stringify(db,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="面试背诵-备份-"+today()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
function importFile(inp){ const f=inp.files&&inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const t=String(r.result||"").replace(/^﻿/,""); if(/^\s*\{/.test(t)){ try{ const d=normalizeDb(JSON.parse(t)); db=normalizeDb(mergeDb(db,d)); save(); render(); toast("已合并导入"); }catch(e){ toast("文件不是有效的 JSON"); } } else importText(t); inp.value=""; }; r.readAsText(f,"utf-8"); }
function importText(t){
  t=(t||"").replace(/\r/g,""); if(!t.trim()) return toast("没有内容");
  let topic=null, cur=null, n=0, skip=0; const out=[];
  const flush=()=>{ if(cur){ cur.text=cur.lines.join("\n").trim(); if(tokenize(cur.text).length) out.push(cur); cur=null; } };
  t.split("\n").forEach(line=>{
    const m2=line.match(/^##\s*(.+)$/), m1=!m2&&line.match(/^#\s*(.+)$/);
    if(m1){ flush(); topic=m1[1].trim(); return; }
    if(m2){ flush(); const p=m2[1].split(/\s*[|｜]\s*/); cur={topic:topic||"未分话题",title:p[0].trim(),cue:(p[1]||"").trim(),lines:[]}; return; }
    if(cur) cur.lines.push(line);
  });
  flush();
  if(!out.length) return toast("没认出内容：每条要以「## 标题」开头");
  out.forEach(o=>{ let tp=liveTopics().find(x=>x.name===o.topic); if(!tp) tp=newTopic(o.topic);
    if(liveItems().some(i=>i.topicId===tp.id&&i.title===o.title&&i.text===o.text)){ skip++; return; }
    db.items.push(touch({id:uid(),topicId:tp.id,title:o.title,cue:o.cue,text:o.text,day:today(),order:nextOrder(db.items)})); n++; });
  save(); render(); toast("导入 "+n+" 条"+(skip?"，"+skip+" 条已存在跳过":""),3500);
}

/* ===== 11. 初始化 ===== */
(async function init(){
  await loadDb();
  syLoad(); if(SY.adopted){ try{ if(localStorage.getItem("ms-noadopt")){ SY.token=""; sySave(); SY.adopted=false; } }catch(e){} }
  render();
  if(SY.adopted) toast("已沿用 Study Hub 的云同步令牌",3000);
  if(syOn()) syncNow();
  /* 过了零点自动换到新的一天 */
  let lastDay=today(); setInterval(()=>{ if(today()!==lastDay){ lastDay=today(); IDX=null; if(["today","lib"].includes(VIEW.tab)) render(); } },60000);
})();
