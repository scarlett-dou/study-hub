    rows+='<div class="curow" style="border-top:1px solid var(--sep)"><div class="cuname">'+nm+' · 得分 '+pct+'%（'+(Math.round(g.ok*10)/10)+'/'+g.n+'）</div>'+
      '<div class="cudetail">客观熟悉度刷新为 <b>'+(fam==null?'—':fam+'%')+'</b> · 不勾自评＝直接按本节得分排期</div>'+
      '<label style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;cursor:pointer"><input type="checkbox" data-rl="'+L+'" style="width:16px;height:16px"> 这一节我要自评</label>'+
      '<div class="rate" data-rlrate="'+L+'" style="display:none;margin-top:6px">'+db.settings.levels.map(l=>'<button class="rb rb-'+l.key+'" data-rk="'+L+'" data-key="'+l.key+'">'+esc(l.label)+'</button>').join('')+'</div></div>'; });
  const body=openModal('<div class="d">'+title+' · 结果</div>',
    '<div class="scorebar" style="margin-bottom:14px"><div class="big">'+_rp.pct+'<span style="font-size:20px">分</span></div><div class="lab">答对 '+_rp.correct+' / '+_rp.items.length+'</div></div>'+
    '<div class="msub" style="margin-bottom:8px;line-height:1.7">各节已按得分记入客观熟悉度。下面可<b>勾选哪些节要自评</b>：勾选的按权重(自评/测验)合并定排期;不勾的直接按本节得分定排期。</div>'+
    '<div>'+rows+'</div>'+
    '<div class="btnrow" style="margin-top:14px"><button class="btn" id="rpFinish">完成复习</button></div>');
  body.querySelectorAll('input[data-rl]').forEach(cb=>cb.onchange=()=>{ const L=cb.dataset.rl,rd=body.querySelector('.rate[data-rlrate="'+L+'"]'); rd.style.display=cb.checked?'flex':'none'; if(!cb.checked){ delete _rp.byLesson[+L].selfRating; rd.querySelectorAll('button').forEach(b=>b.classList.remove('sel')); } });
  body.querySelectorAll('button[data-rk]').forEach(b=>b.onclick=()=>{ const L=+b.dataset.rk; _rp.byLesson[L].selfRating=b.dataset.key; body.querySelectorAll('button[data-rk="'+L+'"]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); });
  body.querySelector('#rpFinish').onclick=()=>finishReviewPlan();
}
async function finishReviewPlan(){
  const p=db.plans.find(x=>x.id===_rp.planId); if(!p){ closeModal(); _rp=null; return; }
  const m=db.settings.mastery,sw=(+m.selfWeight||0),ew=(+m.examWeight||0),tot=(sw+ew)||1,summary=[];
  Object.keys(_rp.byLesson).map(Number).sort((a,b)=>a-b).forEach(L=>{ const g=_rp.byLesson[L],qv=g.ok/g.n,rec=db.recites.find(r=>r.id===g.reciteId); if(!rec) return;
    let blended; if(g.selfRating){ const lv=levelByKey(g.selfRating),sv=(lv.value!=null?lv.value:0.5); blended=(sw*sv+ew*qv)/tot; } else blended=qv;
    const effKey=effectiveRatingKey(blended),memCp=rec.cps[0];
    if(!memCp.done) markMemorize(rec,effKey,_rp.onDate);
    else { const pend=rec.cps.filter(c=>c.kind==="review"&&!c.done)[0]; if(pend) rateReview(rec,pend.id,effKey,_rp.onDate); }
    summary.push({lesson:L,pct:Math.round(qv*100),selfRated:!!g.selfRating,effLabel:levelByKey(effKey).label}); });
  p.done=true; p.results={pct:_rp.pct,correct:_rp.correct,total:_rp.items.length,lessons:summary,date:_rp.onDate};
  await save(); const dd=_rp.dd; closeModal(); _rp=null; refreshDay(dd); toast('复习完成,已更新各节排期');
}
/* ===== 10.7 · 卡片背诵 (Leitner 盒子 + 连胜掌握; 独立数据 flashDecks/flashState, 不改复习/排期/掌握度内核) ===== */
const FC_IVL={1:1,2:2,3:4,4:7,5:15};          // 盒子层级 → 下次复习间隔(天)
const FC_MASTER=3;                            // 连续「记住」达到此数 = 已掌握
const FC_LVL={ again:{k:"again",label:"没记住"}, hard:{k:"hard",label:"一般"}, good:{k:"good",label:"记住"} };
let fc={ nav:{level:"deck",ci:null,si:null}, session:null, screen:"home" };

function fcDecks(){ return db.flashDecks||[]; }
function fcDeck(){ const ds=fcDecks(); if(!ds.length) return null; return ds.find(d=>d.id===fc.deckId)||ds[0]; }
function fcPeek(id){ return (db.flashState&&db.flashState[id])||null; }
function fcEnsure(id){ if(!db.flashState) db.flashState={}; let s=db.flashState[id];
  if(!s){ s={box:1,good:0,hard:0,again:0,streak:0,mastered:false,seen:0,due:today(),last:null,wrong:false,wrongN:0}; db.flashState[id]=s; } return s; }
function fcIsDue(id){ const s=fcPeek(id); if(!s) return true; return (s.due||today())<=today(); }   // 未学过=待学
function fcRate(id,lvl){ const s=fcEnsure(id); s.seen++; s.last=today();
  if(lvl==="good"){ s.good++; s.box=Math.min(5,s.box+1); s.streak++; if(s.streak>=FC_MASTER) s.mastered=true; }
  else if(lvl==="hard"){ s.hard++; s.streak=0; }
  else { s.again++; s.streak=0; s.box=1; s.mastered=false; }
  const ivl = lvl==="again"?1 : lvl==="hard"?Math.max(1,Math.round(FC_IVL[s.box]/2)) : FC_IVL[s.box];
  s.due=addDays(today(),ivl); save(); }
function fcAnswerQuiz(id,correct){ const s=fcEnsure(id);
  if(correct){ s.wrong=false; fcRate(id,"good"); } else { s.wrong=true; s.wrongN=(s.wrongN||0)+1; fcRate(id,"again"); } }
function fcCardById(deck,id){ return deck.cards.find(c=>c.id===id); }

/* ---- markup 渲染: [[答案|R/B]] 挖空 · ‹文本|R/B/P/O/G› 上色 · 〔提示〕 · ⟦IMG:x⟧ 图 ---- */
function fcEscBr(s){ return esc(s).replace(/\n/g,"<br>"); }
function fcRender(md,deck){ const imgs=(deck&&deck.images)||{}; let out="",last=0,m;
  const re=/\[\[([^\]|]+)\|([RB])\]\]|‹([^|›]*)\|([RBPOG])›|〔([^〕]*)〕|⟦IMG:([^⟧]+)⟧/g;
  while((m=re.exec(md))!==null){ if(m.index>last) out+=fcEscBr(md.slice(last,m.index));
    if(m[1]!==undefined) out+='<span class="fc-bk hidden '+m[2]+'" data-ans="'+esc(m[1])+'" tabindex="0" role="button">＿＿＿</span>';
    else if(m[3]!==undefined) out+='<span class="fc-c '+m[4]+'">'+fcEscBr(m[3])+'</span>';
    else if(m[5]!==undefined) out+='<span class="fc-cue">〔'+esc(m[5])+'〕</span>';
    else if(m[6]!==undefined){ const src=imgs[m[6]]; if(src) out+='<img class="fc-timg" src="'+src+'" alt="图">'; }
    last=re.lastIndex; }
  if(last<md.length) out+=fcEscBr(md.slice(last)); return out; }
function fcTable(rows,deck){ let h='<div class="fc-tblwrap"><table class="fc-tbl">';
  rows.forEach((row,ri)=>{ h+="<tr>"; row.forEach(cell=>{ const tag=ri===0?"th":"td"; h+="<"+tag+">"+fcRender(String(cell),deck)+"</"+tag+">"; }); h+="</tr>"; });
  return h+"</table></div>"; }
function fcCardBody(card,deck){ let h="";
  (card.blocks||[]).forEach(b=>{ if(b.t==="p") h+='<p class="fc-p">'+fcRender(b.md,deck)+"</p>";
    else if(b.t==="table") h+=fcTable(b.rows,deck);
    else if(b.t==="img"){ const src=(deck.images||{})[b.src]; if(src) h+='<img class="fc-img" src="'+src+'">'; } });
  return h; }

/* ---- 统计 & 章节树 ---- */
function fcStats(cards){ let seen=0,mastered=0,due=0,neu=0,wrong=0;
  cards.forEach(c=>{ const s=fcPeek(c.id); if(!s){ neu++; due++; } else { seen++; if(s.mastered) mastered++; if((s.due||today())<=today()) due++; if(s.wrong) wrong++; } });
  return {total:cards.length,seen,mastered,due,neu,wrong}; }
function fcTree(deck){ const chaps=[],cm={};
  deck.cards.forEach(c=>{ if(cm[c.chapIdx]===undefined){ cm[c.chapIdx]=chaps.length; chaps.push({idx:c.chapIdx,title:c.chap,cards:[],secs:[],_sm:{}}); }
    const ch=chaps[cm[c.chapIdx]]; ch.cards.push(c);
    if(ch._sm[c.secIdx]===undefined){ ch._sm[c.secIdx]=ch.secs.length; ch.secs.push({idx:c.secIdx,title:c.sec,cards:[],subs:[],_um:{}}); }
    const se=ch.secs[ch._sm[c.secIdx]]; se.cards.push(c);
    const uk=c.subIdx; if(se._um[uk]===undefined){ se._um[uk]=se.subs.length; se.subs.push({idx:uk,title:c.sub||"（本节）",cards:[]}); }
    se.subs[se._um[uk]].cards.push(c); });
  return chaps; }
function fcMiniBar(st){ const pct=st.total?Math.round(st.mastered/st.total*100):0;
  return '<div class="fc-mini"><i style="width:'+pct+'%"></i></div>'; }
function fcMetaLine(st){ return '掌握 <b>'+st.mastered+'</b>/'+st.total+(st.due?' · 待复习 <b>'+st.due+'</b>':'')+(st.wrong?' · 错题 <b>'+st.wrong+'</b>':''); }

/* ---- 会话构建 ---- */
function fcStartSession(cards,label,onlyDue){ let ids=cards.map(c=>c.id);
  if(onlyDue) ids=ids.filter(id=>fcIsDue(id));
  if(!ids.length){ toast(onlyDue?"这里没有待复习的卡":"这里还没有卡"); return; }
  fc.session={ ids, i:0, label, good:0,hard:0,again:0, reveal:false, answered:null, missIds:[], done:false }; fc.editing=false;
  fc.screen="session"; render(); }
function fcTodayQueue(deck){ const daily=(db.settings&&db.settings.flashDaily)||20;
  const dueSeen=deck.cards.filter(c=>{ const s=fcPeek(c.id); return s&&(s.due||today())<=today(); });
  const neu=deck.cards.filter(c=>!fcPeek(c.id)).slice(0,daily);
  return dueSeen.concat(neu); }

/* ---- 模块入口 ---- */
function mountFlash(main){ hideSelbar&&hideSelbar(); const deck=fcDeck();
  if(!deck){ const e=document.createElement("div"); e.className="kempty"; e.innerHTML='<div class="big">还没有卡片牌组</div>导入含 <code>flashDecks</code> 的数据文件（study-data.json）即可看到「经济」卡片。'; main.appendChild(e); return; }
  if(fc.screen==="session"&&fc.session){ fcRenderSession(main,deck); return; }

      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="fc-btn" id="fcToday">今日学习（'+q.length+'）</button>'+(all.wrong?'<button class="fc-btn sec" id="fcWrong">错题本（'+all.wrong+'）</button>':'')+'</div></div>'+

  }
  if(nav.level==="sec"){
    const ch=tree.find(c=>c.idx===nav.ci); const se=ch&&ch.secs.find(s=>s.idx===nav.si);
    if(!se){ fc.nav={level:"chap",ci:nav.ci}; render(); return; }
    wrap.appendChild(fcBack("← "+esc(ch.title),()=>{ fc.nav={level:"chap",ci:ch.idx}; render(); }));

    const realSubs=se.subs.filter(u=>u.title!=="（本节）");
    if(!realSubs.length){ const tip=document.createElement("div"); tip.className="mod-sub"; tip.style.padding="4px 2px"; tip.textContent="本节没有更细的小节，直接点上方「开始背」即可。"; wrap.appendChild(tip); return; }
    se.subs.forEach(u=>{ const st=fcStats(u.cards); const row=fcRowEl("·",u.title,fcMetaLine(st),st);
      row.style.cursor="default"; const b=document.createElement("button"); b.className="fc-btn sm"; b.textContent="背 "+u.cards.length; b.onclick=(e)=>{ e.stopPropagation(); fcStartSession(u.cards,ch.title+" · "+u.title,false); };
      row.querySelector(".fc-chev").replaceWith(b); wrap.appendChild(row); });
    return;
  }
}
function fcDeckTabs(){ const box=document.createElement("div"); box.className="fc-decks"; const cur=fcDeck();
  fcDecks().forEach(d=>{ const b=document.createElement("button"); b.textContent=d.name; if(cur&&d.id===cur.id) b.className="sel";
    b.onclick=()=>{ fc.deckId=d.id; fc.nav={level:"deck"}; fc.session=null; fc.editing=false; fc.screen="home"; render(); }; box.appendChild(b); });
  return box; }function fcDailyCtl(host){ if(!host) return; const cur=(db.settings&&db.settings.flashDaily)||20;
  host.innerHTML='<span class="fc-dl-lb">每天新卡上限</span><button class="fc-step" data-d="-5">−</button><b id="fcDailyN">'+cur+'</b><button class="fc-step" data-d="5">＋</button><span class="fc-dl-hint">今日 = 到期复习卡 + 最多这么多张新卡</span>';
  host.querySelectorAll(".fc-step").forEach(b=>b.onclick=()=>{ let v=((db.settings.flashDaily)||20)+(+b.dataset.d); v=Math.max(5,Math.min(100,v)); db.settings.flashDaily=v; save(); host.querySelector("#fcDailyN").textContent=v; }); }
function fcScopeHead(deck,title,cards){ const st=fcStats(cards); const box=document.createElement("div"); box.className="fc-hero";

    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="fc-btn" id="fcGoAll">开始背（'+st.total+'）</button>'+(st.due<st.total?'<button class="fc-btn sec" id="fcGoDue">只背到期（'+st.due+'）</button>':'')+

  const bw=box.querySelector("#fcGoWeak"); if(bw) bw.onclick=()=>fcStartSession(cards.filter(c=>{ const s=fcPeek(c.id); return !(s&&s.mastered); }),title,false);
  return box; }
function fcRowEl(seal,name,meta,st){ const row=document.createElement("div"); row.className="fc-row";
  row.innerHTML='<div class="fc-seal">'+esc(String(seal))+'</div><div style="flex:1;min-width:0"><div class="fc-nm">'+esc(name)+'</div><div class="fc-meta">'+meta+'</div>'+(st?fcMiniBar(st):'')+'</div><span class="fc-chev">›</span>';
  return row; }
function fcBack(label,fn){ const b=document.createElement("button"); b.className="fc-back"; b.textContent=label; b.onclick=fn; return b; }

/* ---- 会话（逐卡） ---- */
function fcRenderSession(main,deck){ const S=fc.session; if(!S){ fc.screen="home"; render(); return; }
  const wrap=document.createElement("div"); wrap.className="fc-wrap"; main.appendChild(wrap);
  if(S.done){ return fcSummary(wrap,deck); }
  const total=S.ids.length, card=fcCardById(deck,S.ids[S.i]);
  if(!card){ S.i++; if(S.i>=total){ S.done=true; } render(); return; }
  // 顶部进度
  const top=document.createElement("div"); top.className="fc-prog";
  top.innerHTML='<button class="fc-back" style="margin:0" id="fcExit">✕ 退出</button><span style="font-size:13px;color:var(--text2);white-space:nowrap">'+esc(S.label)+'</span><div class="bar"><i style="width:'+Math.round(S.i/total*100)+'%"></i></div><span style="font-size:13px;color:var(--text2);white-space:nowrap">'+(S.i+1)+' / '+total+'</span>';
  wrap.appendChild(top); top.querySelector("#fcExit").onclick=()=>{ if(confirm("退出本轮？已评价的卡片进度已保存。")){ fc.screen="home"; fc.session=null; fc.nav={level:"deck"}; render(); } };
  if(card.kind!=="quiz"){ const _eb=document.createElement("button"); _eb.className="fc-back"; _eb.style.margin="0"; _eb.textContent=fc.editing?"✓ 完成编辑":"✎ 编辑挖空"; _eb.onclick=()=>{ fc.editing=!fc.editing; hideSelbar(); render(); }; top.appendChild(_eb); }
  const cardEl=document.createElement("div"); cardEl.className="fc-card"; wrap.appendChild(cardEl);
  // 情景标题

  let head='<div class="fc-ctx">'+esc(ctxParts.join(" › "))+(card.h4?' › '+esc(card.h4):'')+'</div>';
  if(card.pretitle) head+='<div class="fc-pre">'+esc(card.pretitle)+'</div>';
  if(card.title) head+='<div class="fc-title">'+esc(card.title)+'</div>';
  const s=fcPeek(card.id); const badge = s&&s.mastered?'<span class="fc-badge">已掌握</span>':(s?'<span class="fc-tag">记'+s.good+'/一般'+s.hard+'/没'+s.again+'</span>':'<span class="fc-tag">新卡</span>');
  if(fc.editing && card.kind!=="quiz"){ fcRenderClozeEdit(cardEl,card,deck,head,wrap); return; }
  if(card.kind==="quiz") fcRenderQuizCard(cardEl,card,deck,head,badge,wrap);
  else fcRenderClozeCard(cardEl,card,deck,head,badge,wrap);
}
function fcRenderClozeCard(cardEl,card,deck,head,badge,wrap){ const S=fc.session;
  cardEl.innerHTML=head+'<div class="fc-body">'+fcCardBody(card,deck)+'</div>';
  // 绑定挖空点击
  const reveal=el=>{ el.classList.remove("hidden"); el.classList.add("shown"); el.textContent=el.dataset.ans; };
  cardEl.querySelectorAll(".fc-bk.hidden").forEach(el=>{ if(S.reveal) reveal(el);
    el.onclick=()=>reveal(el); el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); reveal(el); } }; });
  const nBlanks=cardEl.querySelectorAll(".fc-bk").length;
  const tools=document.createElement("div"); tools.style.cssText="margin-top:14px;text-align:center";
  if(nBlanks){ const rb=document.createElement("button"); rb.className="fc-btn sec sm"; rb.textContent="显示全部答案"; rb.onclick=()=>{ S.reveal=true; cardEl.querySelectorAll(".fc-bk.hidden").forEach(reveal); }; tools.appendChild(rb); }
  else { const t=document.createElement("span"); t.className="mod-sub"; t.textContent="（本卡无挖空 · 看懂即可评价）"; tools.appendChild(t); }
  cardEl.appendChild(tools);
  const rate=document.createElement("div"); rate.className="fc-rate";
  rate.innerHTML='<button class="again">没记住</button><button class="hard">一般</button><button class="good">记住</button>';
  rate.querySelector(".again").onclick=()=>fcRateNext(card.id,"again");
  rate.querySelector(".hard").onclick=()=>fcRateNext(card.id,"hard");
  rate.querySelector(".good").onclick=()=>fcRateNext(card.id,"good");
  wrap.appendChild(rate); }
function fcRateNext(id,lvl){ const S=fc.session; fcRate(id,lvl);
  if(lvl==="good") S.good++; else if(lvl==="hard"){ S.hard++; S.missIds.push(id); } else { S.again++; S.missIds.push(id); }
  fcAdvance(); }
function fcAdvance(){ const S=fc.session; S.i++; S.reveal=false; S.answered=null; fc.editing=false; if(S.i>=S.ids.length) S.done=true; render(); }
function fcRenderQuizCard(cardEl,card,deck,head,badge,wrap){ const S=fc.session; const ans=S.answered;
  let h=head+'<div class="fc-body"><p class="fc-p"><b>'+fcRender(card.stem,deck)+'</b></p></div>';
  cardEl.innerHTML=h;

/* ---- 卡片编辑：改挖空 / 上色 / 源码（复用 #selbar 与 openModal） ---- */
function fcTok(md){ const t=[]; let last=0,m; const re=/\[\[([^\]|]+)\|([RB])\]\]|‹([^|›]*)\|([RBPOG])›|〔([^〕]*)〕|⟦IMG:([^⟧]+)⟧/g;
  while((m=re.exec(md))!==null){ if(m.index>last) t.push({type:"plain",text:md.slice(last,m.index)});
    if(m[1]!==undefined) t.push({type:"blank",ans:m[1],color:m[2]});
    else if(m[3]!==undefined) t.push({type:"color",text:m[3],color:m[4]});
    else if(m[5]!==undefined) t.push({type:"hint",text:m[5]});
    else t.push({type:"img",file:m[6]}); last=re.lastIndex; }
  if(last<md.length) t.push({type:"plain",text:md.slice(last)}); return t; }
function fcSer(toks){ return toks.map(tk=> tk.type==="plain"?tk.text : tk.type==="blank"?("[["+tk.ans+"|"+tk.color+"]]") : tk.type==="color"?("‹"+tk.text+"|"+tk.color+"›") : tk.type==="hint"?("〔"+tk.text+"〕") : tk.type==="img"?("⟦IMG:"+tk.file+"⟧"):"").join(""); }
function fcProj(toks){ const o=[]; toks.forEach((tk,ti)=>{
  if(tk.type==="plain"){ for(let i=0;i<tk.text.length;i++) o.push({ti,ci:i,kind:"plain",ch:tk.text[i]}); }
  else if(tk.type==="color"){ for(let i=0;i<tk.text.length;i++) o.push({ti,ci:i,kind:"color",ch:tk.text[i]}); }
  else if(tk.type==="hint"){ const f="〔"+tk.text+"〕"; for(let i=0;i<f.length;i++) o.push({ti,ci:i,kind:"hint",ch:f[i]}); }
  else if(tk.type==="blank"){ for(let i=0;i<tk.ans.length;i++) o.push({ti,ci:i,kind:"blank",ch:tk.ans[i]}); } }); return o; }
function fcSelInfo(proj,a,b){ if(a<0||b>proj.length||a>=b) return null; const s=proj.slice(a,b),ti=s[0].ti;
  return { allPlain:s.every(p=>p.ti===ti&&p.kind==="plain"), ti, ci0:s[0].ci, ci1:s[s.length-1].ci+1, text:s.map(p=>p.ch).join("") }; }
function fcWrapSel(toks,proj,a,b,mk){ const info=fcSelInfo(proj,a,b); if(!info||!info.allPlain) return null;
  const tk=toks[info.ti],before=tk.text.slice(0,info.ci0),mid=tk.text.slice(info.ci0,info.ci1),after=tk.text.slice(info.ci1);
  const ins=[]; if(before) ins.push({type:"plain",text:before}); ins.push(mk(mid)); if(after) ins.push({type:"plain",text:after});
  const nt=toks.slice(); nt.splice(info.ti,1,...ins); return nt; }
function fcRemoveMark(toks,ti){ const tk=toks[ti]; if(!tk||(tk.type!=="blank"&&tk.type!=="color")) return toks;
  const nt=toks.slice(); nt.splice(ti,1,{type:"plain",text:tk.type==="blank"?tk.ans:tk.text});
  const m=[]; nt.forEach(x=>{ const l=m[m.length-1]; if(l&&l.type==="plain"&&x.type==="plain") l.text+=x.text; else m.push(Object.assign({},x)); }); return m; }
function fcEditPara(card,bi,block){ const wrap=document.createElement("div"); wrap.className="fc-eblk"; wrap.dataset.bi=bi;
  const toks=fcTok(block.md); let gi=0,html="";
  toks.forEach((tk,ti)=>{
    if(tk.type==="blank"){ html+='<span class="fc-chip fc-bc '+tk.color+'" data-ti="'+ti+'" title="点击取消挖空">'; for(const ch of tk.ans) html+='<span class="ch" data-gi="'+(gi++)+'">'+esc(ch)+'</span>'; html+='</span>'; }
    else if(tk.type==="color"){ html+='<span class="fc-chip fc-cc '+tk.color+'" data-ti="'+ti+'" title="点击取消上色">'; for(const ch of tk.text) html+='<span class="ch" data-gi="'+(gi++)+'">'+esc(ch)+'</span>'; html+='</span>'; }
    else if(tk.type==="hint"){ html+='<span class="fc-cue">'; for(const ch of ("〔"+tk.text+"〕")) html+='<span class="ch" data-gi="'+(gi++)+'">'+esc(ch)+'</span>'; html+='</span>'; }
    else if(tk.type==="img"){ html+='<span class="fc-cue">〔图〕</span>'; }
    else { for(const ch of tk.text) html+='<span class="ch" data-gi="'+(gi++)+'">'+esc(ch)+'</span>'; }
  });
  wrap.innerHTML=html;
  wrap.querySelectorAll(".fc-chip").forEach(chip=>{ chip.onclick=e=>{ e.stopPropagation(); if(!confirm("取消这个标记？")) return; const ti=+chip.dataset.ti; block.md=fcSer(fcRemoveMark(fcTok(block.md),ti)); save(); render(); }; });
  wrap.addEventListener("mouseup",()=>fcOnSelectCard(wrap,card,bi));
  return wrap; }
function fcOnSelectCard(wrap,card,bi){ const cap=captureSel(wrap); if(!cap){ hideSelbar(); return; }
  fc.sel={cardId:card.id,bi,a:cap.a,b:cap.b};
  const bar=document.getElementById("selbar");
  bar.innerHTML='<span class="lbl">挖空</span>'+[["R","红·挖空"],["B","蓝·挖空"],["P","紫·补充"],["O","橙·解释"]].map(x=>'<button class="col '+x[0]+'" data-c="'+x[0]+'" title="'+x[1]+'"></button>').join("");
  bar.querySelectorAll(".col").forEach(b=>b.onclick=()=>fcApplyMark(b.dataset.c)); showSelbar(cap.rect); }
function fcApplyMark(kind){ const sel=fc.sel; if(!sel) return; const deck=fcDeck(),card=fcCardById(deck,sel.cardId); if(!card) return;
  const block=card.blocks[sel.bi]; const toks=fcTok(block.md),proj=fcProj(toks); let nt;
  if(kind==="R"||kind==="B"){ const info=fcSelInfo(proj,sel.a,sel.b); if(info&&/[\[\]\|]/.test(info.text)){ toast("这段含 [ ] | 符号，请用「源码」编辑"); return; }
    nt=fcWrapSel(toks,proj,sel.a,sel.b,mid=>({type:"blank",ans:mid,color:kind})); }
  else nt=fcWrapSel(toks,proj,sel.a,sel.b,mid=>({type:"color",text:mid,color:kind}));
  if(!nt){ toast("请只选普通文字（勿跨越已有标记）"); return; }
  block.md=fcSer(nt); hideSelbar(); window.getSelection().removeAllRanges(); save(); render(); }
function fcEditMdModal(title,getter,setter){ const body=openModal(esc(title),""); const cur=getter();

/* ===== 10.8 · 法律题库 (全量题目 + 错题本[错1次入册·连对2次出册] + 知识卡片 + 记录导出) =====
   独立数据 lawBank(题目/卡片,静态) + lawState(做题状态/日志,热),不改复习/排期/掌握度内核。
   错题规则:做错1次即入错题本;错的次数越多颜色越深;错过的题需【连续做对 2 次】才算掌握、移出错题本。 */
const LAW_MASTER=2;                                  // 连对几次 = 掌握
const LAW_LOG_CAP=6000;                              // 日志上限(超出保留最近的)
let law={ tab:"quiz", subj:"全部", sec:"全部", scope:"全部", qi:0, sel:[], shown:false,
          cpart:"k", csubj:"全部", ccl:"全部", ci:0 };

function lawB(){ return db.lawBank||(db.lawBank={version:1,questions:[],cards:[]}); }
function lawQs(){ return lawB().questions||[]; }
/* 卡片来源不止法律题库：习思想的卡放在 sjBank.cards 里，跟着自己的题库走。
   两边 id 不重名（法律 hk-/ht-/xk-/xt-/mk-/mt-，习思想 sk-），进度都存 lawState.c 按 id 索引，不会串。 */
function lawCs(){ return (lawB().cards||[]).concat(((db.sjBank&&db.sjBank.cards)||[])); }
function lawS(){ const s=db.lawState||(db.lawState={q:{},c:{},log:[]}); if(!s.q)s.q={}; if(!s.c)s.c={}; if(!s.log)s.log=[]; return s; }
function lawQSt(id){ return lawS().q[id]||null; }
function lawQEnsure(id){ const s=lawS(); let x=s.q[id];
  if(!x){ x={w:0,r:0,n:0,streak:0,mastered:false,last:null}; s.q[id]=x; }
  if(!x.fzo) x.fzo=[];            /* 被标为「不确定」的选项字母 */
  if(x.fz==null) x.fz=0;          /* 标过几次「模糊」 */
  return x; }
/* 错题本 = 错过至少 1 次且尚未掌握 */
function lawInBook(id){ const x=lawQSt(id); return !!x && x.w>0 && !x.mastered; }
/* 模糊 = 虽然做对了但自己没把握（或标了不确定的选项）；掌握后自动清除 */
function lawIsFuzzy(id){ const x=lawQSt(id); return !!x && !!x.fuzzy; }
function lawFuzzyList(){ return lawQs().filter(q=>lawIsFuzzy(q.id)); }
/* 标记/取消「模糊」 */
function lawSetFuzzy(id,on){ const x=lawQEnsure(id);
  if(on&&!x.fuzzy) x.fz=(x.fz||0)+1;
  x.fuzzy=!!on; if(!on) x.fzo=[];
  const s=lawS(); s.log.push({d:today(),q:id,ok:1,f:on?1:0,t:"fuzzy"});
  if(s.log.length>LAW_LOG_CAP) s.log=s.log.slice(-Math.floor(LAW_LOG_CAP*0.7));
  save(); }
/* 标记/取消某个「不确定的选项」——顺带把整题标成模糊 */
function lawToggleOpt(id,k){ const x=lawQEnsure(id); const i=x.fzo.indexOf(k);
  if(i>=0) x.fzo.splice(i,1); else { x.fzo.push(k); if(!x.fuzzy){ x.fuzzy=true; x.fz=(x.fz||0)+1; } }
  save(); }
function lawGrade(id,ok){ const x=lawQEnsure(id); x.n++; x.last=today();
  if(ok){ x.r++; if(x.w>0){ x.streak++; if(x.streak>=LAW_MASTER) x.mastered=true; } }
  else  { x.w++; x.streak=0; x.mastered=false; }
  const s=lawS(); s.log.push({d:today(),q:id,ok:ok?1:0});
  if(s.log.length>LAW_LOG_CAP) s.log=s.log.slice(-Math.floor(LAW_LOG_CAP*0.7));
  save(); }
/* 错题深浅:错 1 次浅、2 次中、3 次深、4 次以上最深 */
function lawHeat(w){ return w<=0?0:(w>=4?4:w); }

function lawSubjOf(q){ return q.subject; }
function lawList(){ return lawQs().filter(q=>
  (law.subj==="全部"||q.subject===law.subj) &&
  (law.sec ==="全部"||q.sec===law.sec) &&
  (law.scope==="全部" ||
   (law.scope==="未做"   && !lawQSt(q.id)) ||
   (law.scope==="错题本" && lawInBook(q.id)) ||
   (law.scope==="模糊"   && lawIsFuzzy(q.id)) ||
   (law.scope==="已掌握" && lawQSt(q.id) && lawQSt(q.id).mastered) ||
   (law.scope==="原书标记"&& q.mark)) ); }

function lawStats(qs){ let done=0,book=0,mast=0,right=0,fuzzy=0;
  qs.forEach(q=>{ const x=lawQSt(q.id); if(!x) return; done++; if(x.r>0&&x.w===0) right++;
    if(lawInBook(q.id)) book++; if(x.mastered) mast++; if(x.fuzzy) fuzzy++; });
  return {total:qs.length,done,book,mast,right,fuzzy}; }

/* ---------- 模块入口 ---------- */
function mountLaw(main){
  const wrap=document.createElement("div"); wrap.className="lw";
  const tabs=[["quiz","📝 刷题"],["book","🔴 错题本"],["card","🗂️ 卡片"],["log","📊 记录"]];

  main.appendChild(wrap);

      '<div class="lw-actions"><button class="lw-go" id="lwImp">导入法律题库</button></div>';

/* ---------- 刷题 ---------- */
function lawChips(name,key,vals){ return '<div class="lw-chips"><span class="lw-lb">'+name+'</span>'+
  vals.map(v=>'<button class="lw-chip'+(law[key]===v?" on":"")+'" data-k="'+key+'" data-v="'+esc(v)+'">'+esc(v)+'</button>').join("")+'</div>'; }
/* 科目/题型按题库里实际有的动态生成——加了新科目(如民法)不用改代码 */
function lawSubjects(){ return ["全部"].concat([...new Set(lawQs().map(q=>q.subject))]); }
function lawSections(){ const s=lawQs().filter(q=>law.subj==="全部"||q.subject===law.subj);
  return ["全部"].concat([...new Set(s.map(q=>q.sec))]); }

function lawQuiz(body){
  const qs=lawList(); const st=lawStats(qs);
  if(law.qi>=qs.length) law.qi=0;
  const q=qs[law.qi];
  body.innerHTML=
    lawChips("科目","subj",lawSubjects())+
    lawChips("题型","sec",lawSections())+
    lawChips("范围","scope",["全部","未做","错题本","模糊","已掌握","原书标记"])+
    '<div class="lw-stat">共 <b>'+st.total+'</b> 题 · 已做 <b>'+st.done+'</b> · 错题本 <b class="r">'+st.book+'</b> · 模糊 <b class="f">'+st.fuzzy+'</b> · 已掌握 <b class="g">'+st.mast+'</b></div>'+
    '<div id="lwQ"></div><div class="lw-gridwrap"><div class="lw-lb2">题目总览（点击跳转 · 颜色＝掌握情况）</div><div class="lw-grid" id="lwGrid"></div></div>';
  body.querySelectorAll(".lw-chip").forEach(b=>b.onclick=()=>{ law[b.dataset.k]=b.dataset.v; law.qi=0; law.sel=[]; law.shown=false; render(); });
  lawRenderQ(body.querySelector("#lwQ"),q,qs);
  lawRenderGrid(body.querySelector("#lwGrid"),qs);
}

const LAW_SC={"刑法":"x","宪法":"h","民法":"c"};
function lawBadge(q){ let s='<span class="lw-tag t-'+(LAW_SC[q.subject]||"x")+'">'+q.subject+"·"+q.sec+"</span>";
  s+='<span class="lw-num">第 '+q.num+' 题</span>';
  if(q.mark==="R") s+='<span class="lw-tag t-r">原书🔴反复记不住</span>';
  else if(q.mark==="Y") s+='<span class="lw-tag t-y">原书🟡做错过</span>';
  const x=lawQSt(q.id);
  if(x){ if(x.mastered) s+='<span class="lw-tag t-g">已掌握</span>';
         else if(x.w>0) s+='<span class="lw-tag t-r">错'+x.w+'次 · 连对 '+x.streak+"/"+LAW_MASTER+'</span>';
         if(x.fuzzy) s+='<span class="lw-tag t-f">🤔 模糊'+(x.fzo&&x.fzo.length?"·选项 "+x.fzo.join(""):"")+'</span>'; }
  return s; }

function lawRenderQ(host,q,qs){
  if(!q){ host.innerHTML='<div class="empty">当前筛选没有题目 🎉</div>'; return; }
  const x=lawQSt(q.id), multi=(q.sec==="多选题");
  let opts="";
  if(q.type==="tf") opts='<div class="lw-opts tf"><button class="lw-opt" data-v="√">✔ 对</button><button class="lw-opt" data-v="×">✘ 错</button></div>';
  else opts='<div class="lw-opts">'+Object.keys(q.options||{}).map(k=>
    '<button class="lw-opt" data-v="'+k+'"><i>'+k+'</i><span>'+esc(q.options[k])+'</span></button>').join("")+'</div>';
  host.innerHTML='<div class="lw-card"><div class="lw-meta">'+lawBadge(q)+'<span class="lw-pos">'+(law.qi+1)+" / "+qs.length+'</span></div>'+
    '<div class="lw-stem">'+esc(q.stem)+'</div>'+opts+
    (multi?'<button class="lw-go" id="lwOk" disabled>确认（多选）</button>':"")+
    '<div class="lw-verdict" id="lwV"></div><div class="lw-exp" id="lwE"></div>'+
    '<div class="lw-nav"><button id="lwPrev">上一题</button><button id="lwNext" class="pri">下一题</button></div></div>';
  const vd=host.querySelector("#lwV"), ex=host.querySelector("#lwE");
  const finish=(pick)=>{
    const ok=(pick===q.answer);
    if(!law.shown){ lawGrade(q.id,ok); law.shown=true; }
    host.querySelectorAll(".lw-opt").forEach(o=>{ const v=o.dataset.v;
      const inA=q.answer.indexOf(v)>=0, inP=pick.indexOf(v)>=0;
      o.classList.remove("sel"); if(inA)o.classList.add("hit"); if(inP&&!inA)o.classList.add("miss"); if(!inA&&!inP)o.classList.add("dim");
      o.disabled=true; });
    const okBtn=host.querySelector("#lwOk"); if(okBtn) okBtn.style.display="none";
    vd.className="lw-verdict "+(ok?"ok":"no");
    vd.innerHTML=ok?"✅ 回答正确":'❌ 回答错误：你选了「'+esc(pick)+'」，正确答案是「<b>'+esc(q.answer)+'</b>」';
    const nx=lawQSt(q.id);
    if(!ok) vd.innerHTML+='　<span class="lw-hint">已进错题本，需连续做对 '+LAW_MASTER+' 次才算掌握</span>';
    else if(nx&&nx.w>0&&!nx.mastered) vd.innerHTML+='　<span class="lw-hint">连对 '+nx.streak+"/"+LAW_MASTER+'，再对 '+(LAW_MASTER-nx.streak)+' 次即掌握</span>';
    else if(nx&&nx.mastered&&nx.w>0) vd.innerHTML+='　<span class="lw-hint g">🎉 已掌握，移出错题本</span>';
    ex.style.display="block";
    ex.innerHTML='<b>【答案】'+esc(q.answer)+'</b>　<span class="lw-src">原书第'+q.page+'页</span><br>'+esc(q.explain||"（无解析）").replace(/\n/g,"<br>");
    lawRenderGrid(document.getElementById("lwGrid"),qs);
    const _bk=document.querySelectorAll(".lw-tab")[1]; if(_bk) _bk.innerHTML='🔴 错题本 <b>'+lawQs().filter(z=>lawInBook(z.id)).length+'</b>';
    lawFuzzyBar(host,q);
  };
  host.querySelectorAll(".lw-opt").forEach(o=>o.onclick=()=>{
    if(law.shown) return;
    if(multi){ const v=o.dataset.v, i=law.sel.indexOf(v);
      if(i>=0){ law.sel.splice(i,1); o.classList.remove("sel"); } else { law.sel.push(v); o.classList.add("sel"); }
      host.querySelector("#lwOk").disabled=!law.sel.length;
    } else finish(o.dataset.v); });
  const okB=host.querySelector("#lwOk"); if(okB) okB.onclick=()=>finish(law.sel.slice().sort().join(""));
  host.querySelector("#lwPrev").onclick=()=>{ if(law.qi>0){ law.qi--; law.sel=[]; law.shown=false; render(); } };
  host.querySelector("#lwNext").onclick=()=>{ if(law.qi<qs.length-1){ law.qi++; law.sel=[]; law.shown=false; render(); } else toast("已是最后一题"); };
}

/* 答完题后的「把握程度」条：即使答对也能标模糊，并逐个标出没把握的选项 */
function lawFuzzyBar(host,q){
  let bar=host.querySelector("#lwFz");
  if(!bar){ bar=document.createElement("div"); bar.id="lwFz"; bar.className="lw-fz";
    const nav=host.querySelector(".lw-nav"); nav.parentNode.insertBefore(bar,nav); }
  const draw=()=>{
    const x=lawQEnsure(q.id), on=!!x.fuzzy;
    const keys=q.type==="tf"?["√","×"]:Object.keys(q.options||{});
    bar.innerHTML='<div class="lw-fzrow"><span class="lw-fzlb">把握程度</span>'+
      '<button class="lw-fzbtn'+(on?"":" on")+'" data-v="0">✅ 有把握</button>'+
      '<button class="lw-fzbtn'+(on?" on fz":"")+'" data-v="1">🤔 模糊</button>'+
      (x.fz>1?'<span class="lw-hint">（累计标过 '+x.fz+' 次）</span>':"")+'</div>'+
      '<div class="lw-fzrow"><span class="lw-fzlb">不确定的选项</span>'+
      keys.map(k=>'<button class="lw-fzo'+(x.fzo.indexOf(k)>=0?" on":"")+'" data-k="'+esc(k)+'">'+esc(k)+'</button>').join("")+
      '<span class="lw-hint">点一下标记，再点取消</span></div>';
    bar.querySelectorAll(".lw-fzbtn").forEach(b=>b.onclick=()=>{ lawSetFuzzy(q.id,b.dataset.v==="1"); draw();
      lawRenderGrid(document.getElementById("lwGrid"),lawList()); });
    bar.querySelectorAll(".lw-fzo").forEach(b=>b.onclick=()=>{ lawToggleOpt(q.id,b.dataset.k); draw();
      lawRenderGrid(document.getElementById("lwGrid"),lawList()); });
  };
  draw();
}
function lawRenderGrid(host,qs){ if(!host) return;
  host.innerHTML=qs.map((q,i)=>{ const x=lawQSt(q.id); let cls="";
    if(!x) cls=""; else if(x.w>0&&!x.mastered) cls="c-w"+lawHeat(x.w); else if(x.fuzzy) cls="c-f"; else if(x.mastered) cls="c-m"; else cls="c-r";
    const lab=q.subject[0]+q.sec[0]+q.num;
    return '<button class="lw-cell '+cls+(i===law.qi?" cur":"")+'" data-i="'+i+'" title="'+q.subject+q.sec+"第"+q.num+'题">'+lab+'</button>'; }).join("");
  host.querySelectorAll(".lw-cell").forEach(c=>c.onclick=()=>{ law.qi=+c.dataset.i; law.sel=[]; law.shown=false; render(); }); }

/* ---------- 错题本 ---------- */
function lawBook(body){
  const all=lawQs().filter(q=>lawInBook(q.id))
    .sort((a,b)=>{ const xa=lawQSt(a.id),xb=lawQSt(b.id); return (xb.w-xa.w)||((xb.last||"")<(xa.last||"")?-1:1); });
  const fz=lawFuzzyList().filter(q=>!lawInBook(q.id));   /* 做对但没把握的(错题已在上面列了) */
  if(!all.length&&!fz.length){ body.innerHTML='<div class="empty">错题本是空的 🎉<br><span class="lw-hint">做错一次的题会自动进这里；连续做对 '+LAW_MASTER+' 次后自动移出。<br>答对但没把握的题，可以在做完后点「🤔 模糊」，也会收进这里。</span></div>'; return; }
  const row=(q,extra)=>{ const x=lawQSt(q.id)||{w:0,streak:0,fzo:[]};
    return '<button class="lw-row h'+lawHeat(x.w)+'" data-id="'+q.id+'"><span class="lw-rn">'+q.num+'</span>'+
      '<span class="lw-rs">'+esc(q.stem.slice(0,40))+(q.stem.length>40?"…":"")+'</span>'+extra(x)+'</button>'; };
  const g={}; all.forEach(q=>{ const k=q.subject+"·"+q.sec; (g[k]=g[k]||[]).push(q); });
  const gf={}; fz.forEach(q=>{ const k=q.subject+"·"+q.sec; (gf[k]=gf[k]||[]).push(q); });
  body.innerHTML='<div class="lw-stat">错题 <b class="r">'+all.length+'</b> 题（颜色越深错得越多，连对 '+LAW_MASTER+' 次移出）· 答对但模糊 <b class="f">'+fz.length+'</b> 题</div>'+
    '<div class="lw-actions"><button class="lw-go" id="lwDo">练错题</button>'+
    (fz.length?'<button class="lw-go alt" id="lwDoF">练模糊题</button>':"")+'</div>'+
    (all.length?'<div class="lw-lb2">🔴 错题本</div>'+Object.keys(g).map(k=>'<div class="lw-grp"><div class="lw-lb2">'+k+'（'+g[k].length+'）</div>'+
      g[k].map(q=>row(q,x=>'<span class="lw-rw">错'+x.w+'次</span><span class="lw-rk">连对 '+x.streak+"/"+LAW_MASTER+
        (x.fuzzy?' · 🤔'+(x.fzo&&x.fzo.length?x.fzo.join(""):""):"")+'</span>')).join("")+'</div>').join(""):"")+
    (fz.length?'<div class="lw-lb2">🤔 答对了但没把握（自己标的）</div>'+Object.keys(gf).map(k=>'<div class="lw-grp"><div class="lw-lb2">'+k+'（'+gf[k].length+'）</div>'+
      gf[k].map(q=>row(q,x=>'<span class="lw-rw f">'+(x.fzo&&x.fzo.length?'不确定 '+x.fzo.join(""):'模糊')+'</span>'+
        '<span class="lw-rk">标过'+(x.fz||1)+'次</span>')).join("")+'</div>').join(""):"");
  const jump=(scope)=>{ law.tab="quiz"; law.scope=scope; law.subj="全部"; law.sec="全部"; law.qi=0; law.sel=[]; law.shown=false; render(); };
  body.querySelector("#lwDo").onclick=()=>jump("错题本");
  const bf=body.querySelector("#lwDoF"); if(bf) bf.onclick=()=>jump("模糊");
  body.querySelectorAll(".lw-row").forEach(r=>r.onclick=()=>{
    const id=r.dataset.id, sc=lawInBook(id)?"错题本":"模糊";
    law.tab="quiz"; law.scope=sc; law.subj="全部"; law.sec="全部"; law.sel=[]; law.shown=false;
    const i=lawList().findIndex(q=>q.id===id); law.qi=i<0?0:i; render(); });
}

/* ---------- 卡片 ---------- */
function lawCard(body){
  const cs=lawCs();
  if(!cs.length){ body.innerHTML='<div class="empty">还没有卡片数据。</div>'; return; }
  const pool0=cs.filter(c=>(c.part||"k")===law.cpart && (law.csubj==="全部"||c.subject===law.csubj));
  const cls=["全部"].concat([...new Set(pool0.map(c=>c.cluster).filter(Boolean))]);
  if(cls.indexOf(law.ccl)<0) law.ccl="全部";
  const pool=pool0.filter(c=>law.ccl==="全部"||c.cluster===law.ccl);
  if(law.ci>=pool.length) law.ci=0;
  const c=pool[law.ci];
  const parts=[["k","📚 知识板块"],["t","⚡ 错题陷阱"]];
  body.innerHTML='<div class="lw-chips"><span class="lw-lb">分区</span>'+parts.map(([k,t])=>{
      const n=cs.filter(z=>(z.part||"k")===k&&(law.csubj==="全部"||z.subject===law.csubj)).length;
      return '<button class="lw-chip'+(law.cpart===k?" on":"")+'" data-k="cpart" data-v="'+k+'">'+t+" "+n+'</button>'; }).join("")+'</div>'+
    lawChips("科目","csubj",["全部"].concat([...new Set(lawCs().map(c=>c.subject))]))+
    '<div class="lw-chips wrap"><span class="lw-lb">板块</span>'+cls.map(v=>
      '<button class="lw-chip sm'+(law.ccl===v?" on":"")+'" data-k="ccl" data-v="'+esc(v)+'">'+esc(v)+'</button>').join("")+'</div>'+
    '<div id="lwC"></div>';
  body.querySelectorAll(".lw-chip").forEach(b=>b.onclick=()=>{ law[b.dataset.k]=b.dataset.v; law.ci=0; render(); });
  const host=body.querySelector("#lwC");
  if(!c){ host.innerHTML='<div class="empty">该筛选下没有卡片</div>'; return; }
  const s=lawS(); const cst=s.c[c.id]||(s.c[c.id]={miss:0,seen:0});
  host.innerHTML='<div class="lw-card"><div class="lw-ctop">'+esc(c.cluster||"")+'</div>'+
    '<div class="lw-ctopic">'+esc(c.topic)+'</div>'+
    '<div class="lw-csrc">'+esc(c.src||"")+(cst.miss?'　·　历史没记住 '+cst.miss+" 次":"")+'</div>'+
    '<div class="lw-cbody">'+lawTok(c.text)+'</div>'+
    '<div class="lw-cfoot"><span>本卡 <b id="lwOpen">0</b> 开 / <b id="lwMiss">0</b> 没记住</span><span>'+(law.ci+1)+" / "+pool.length+'</span></div>'+
    '<div class="lw-nav"><button id="lwCp">上一张</button><button id="lwCa">整卡显示</button><button id="lwCn" class="pri">下一张</button></div></div>';
  let nOpen=0,nMiss=0;
  const upd=()=>{ host.querySelector("#lwOpen").textContent=nOpen; host.querySelector("#lwMiss").textContent=nMiss; };
  host.querySelectorAll(".lw-bl").forEach(b=>{ let open=false,t0=0,extra=0,counted=false;
    b.onclick=()=>{ const now=Date.now();
      if(!open){ open=true; t0=now; extra=0; b.classList.add("on"); b.textContent=b.dataset.a; nOpen++; upd(); }
      else if(now-t0<=1600 && !counted){ extra++;
        if(extra>=2){ counted=true; nMiss++; cst.miss++; b.classList.add("bad"); toast("已记「没记住」"); save(); upd(); } } }; });
  host.querySelector("#lwCp").onclick=()=>{ if(law.ci>0){ law.ci--; render(); } };
  host.querySelector("#lwCn").onclick=()=>{ if(law.ci<pool.length-1){ law.ci++; render(); } else toast("已是最后一张"); };
  host.querySelector("#lwCa").onclick=()=>host.querySelectorAll(".lw-bl").forEach(b=>{ b.classList.add("on"); b.textContent=b.dataset.a; b.onclick=null; });
  cst.seen++;
}
/* [[答案|R]] 挖空 · 〔提示〕 不挖空 · **粗体** */
function lawTok(t){
  return esc(t||"").replace(/\n/g,"<br>")
    .replace(/\[\[([^\]|]+)\|([RBGPO])\]\]/g,(m,a,c)=>'<span class="lw-bl c'+c+'" data-a="'+a+'">＿＿＿＿</span>')
    .replace(/〔([^〕]*)〕/g,(m,h)=>'<span class="lw-hi">〔'+h+'〕</span>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }

/* ---------- 记录 / 导出 ---------- */
function lawDays(n){ const a=[]; for(let i=n-1;i>=0;i--) a.push(addDays(today(),-i)); return a; }
function lawLog(body){
  const s=lawS(), days=lawDays(30), from=days[0];
  const rec=s.log.filter(e=>e.d>=from);
  const byDay={}; rec.forEach(e=>{ const d=byDay[e.d]||(byDay[e.d]={n:0,w:0}); d.n++; if(!e.ok) d.w++; });
  const wrongQ={}; rec.forEach(e=>{ if(!e.ok) wrongQ[e.q]=(wrongQ[e.q]||0)+1; });
  const qmap={}; lawQs().forEach(q=>qmap[q.id]=q);
  const list=Object.keys(wrongQ).map(id=>({q:qmap[id],n:wrongQ[id]})).filter(o=>o.q).sort((a,b)=>b.n-a.n);
  const tot=rec.filter(e=>e.t!=="fuzzy").length, wr=rec.filter(e=>!e.ok).length;
  const fzl=lawFuzzyList();
  body.innerHTML='<div class="lw-stat">近 30 天：做题 <b>'+tot+'</b> 次 · 做错 <b class="r">'+wr+'</b> 次 · 正确率 <b class="g">'+(tot?Math.round((tot-wr)/tot*100):0)+'%</b> · 当前标为模糊 <b class="f">'+fzl.length+'</b> 题</div>'+
    '<div class="lw-actions"><button class="lw-go" id="lwExp">导出近一个月错题（给 Claude 梳理用）</button>'+
    '<button class="lw-go alt" id="lwImp">更新题库</button></div>'+
    '<div class="lw-lb2">每日情况</div><div class="lw-bars">'+days.map(d=>{ const o=byDay[d]||{n:0,w:0};
      const h=o.n?Math.max(6,Math.min(46,o.n*4)):2;
      return '<span class="lw-bar" title="'+d+"：做"+o.n+" 错"+o.w+'"><i style="height:'+h+'px" class="'+(o.w?"w":"")+'"></i></span>'; }).join("")+'</div>'+
    '<div class="lw-lb2">近 30 天错过的题（'+list.length+'）</div>'+
    (list.length?list.map(o=>'<div class="lw-row h'+lawHeat(o.n)+' static"><span class="lw-rn">'+o.q.subject[0]+o.q.sec[0]+o.q.num+'</span>'+
      '<span class="lw-rs">'+esc(o.q.stem.slice(0,40))+'…</span><span class="lw-rw">本月错'+o.n+'次</span></div>').join(""):'<div class="empty">近 30 天没有错题记录</div>')+
    (fzl.length?'<div class="lw-lb2">🤔 标为模糊的题（'+fzl.length+'）</div>'+
      fzl.map(q=>{ const x=lawQSt(q.id);
        return '<div class="lw-row static"><span class="lw-rn">'+q.subject[0]+q.sec[0]+q.num+'</span>'+
        '<span class="lw-rs">'+esc(q.stem.slice(0,40))+'…</span><span class="lw-rw f">'+
        (x.fzo&&x.fzo.length?'不确定 '+x.fzo.join(""):'模糊')+'</span></div>'; }).join(""):"");
  body.querySelector("#lwExp").onclick=()=>lawExport(list,tot,wr,from,fzl);
  body.querySelector("#lwImp").onclick=lawImport;
}
/* 只覆盖 lawBank(题目+卡片),不动做题记录,更不动日历/背诵库/卡片背诵等其它数据 */
/* 把解析好的对象写进 lawBank（两条导入路径共用） */
async function lawAdopt(o){
  const qs=Array.isArray(o.questions)?o.questions:(Array.isArray(o)?o:null);
  if(!qs||!qs.length) throw new Error("文件里没有 questions");
  const bad=qs.filter(q=>!q.id||!q.subject||!q.sec||!q.answer);
  if(bad.length) throw new Error("有 "+bad.length+" 条缺 id/subject/sec/answer");
  /* points/qa 必须带上：points 是 170 个知识点(丢了「按知识点选题」就废)，
     qa 是她的提问+解答卡片。文件里没有就沿用本机已有的，别置空。 */
  const _pv=(db.lawBank&&db.lawBank.points)||[], _qv=(db.lawBank&&db.lawBank.qa)||null;
  db.lawBank={version:o.version||1,questions:qs,cards:Array.isArray(o.cards)?o.cards:[],
              points:Array.isArray(o.points)&&o.points.length?o.points:_pv};
  const _qa=(o.qa&&typeof o.qa==="object")?o.qa:_qv; if(_qa) db.lawBank.qa=_qa;
  await save(); closeModal(); law.qi=0; law.ci=0; render();
  toast("题库已更新："+qs.length+" 题 / "+db.lawBank.cards.length+" 张卡 / "+(db.lawBank.points||[]).length+" 个知识点");
}
function lawImport(){

    (online?'<div class="lw-actions" style="margin-bottom:11px"><button class="lw-go" id="lwNet">📶 从网上载入（手机推荐）</button></div>':"")+
    '<p class="lw-hint">或者自己选文件：</p>'+
    '<input type="file" id="lwFile" accept=".json,application/json">'+
    '<div id="lwMsg" class="lw-hint" style="margin-top:9px"></div>');
  const net=h.querySelector("#lwNet");
  if(net) net.onclick=async()=>{
    const msg=h.querySelector("#lwMsg"); msg.textContent="下载中…";
    try{ const rs=await fetch("./法律题库.json",{cache:"no-store"});
      if(!rs.ok) throw new Error("HTTP "+rs.status);
      await lawAdopt(await rs.json());
    }catch(err){ msg.textContent="服务器上没有题库文件（题库未公开发布，"+err.message+"）。请用下面的「选择文件」，或在已开云同步的设备上导入一次，其它设备会自动同步过来。"; }
  };
  h.querySelector("#lwFile").onchange=(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const msg=h.querySelector("#lwMsg"); msg.textContent="读取中…";
    const rd=new FileReader();
    rd.onload=async()=>{
      try{ await lawAdopt(JSON.parse(rd.result)); }
      catch(err){ msg.textContent="导入失败："+err.message; }
    };
    rd.readAsText(f);
  };
}
function lawExport(list,tot,wr,from,fzl){
  fzl=fzl||lawFuzzyList();
  const dump=(q,head)=>{ let s="### "+head+"\n"+q.stem+"\n";
    if(q.options) Object.keys(q.options).forEach(k=>{ s+=k+". "+q.options[k]+"\n"; });
    return s+"**答案：**"+q.answer+"\n**解析：**"+(q.explain||"")+"\n\n"; };
  let md="# 法律错题记录 "+from+" ~ "+today()+"\n\n";
  md+="近30天：做题 "+tot+" 次，做错 "+wr+" 次，正确率 "+(tot?Math.round((tot-wr)/tot*100):0)+"%\n";
  const book=lawQs().filter(q=>lawInBook(q.id));
  md+="当前错题本："+book.length+" 题；当前标为模糊："+fzl.length+" 题\n\n";
  md+="> 说明：「模糊」是我做对了但心里没底、自己标的；「不确定的选项」是我拿不准的那几个选项。请据此一并梳理薄弱点。\n\n";
  md+="## 一、近一个月错过的题\n\n";
  list.forEach(o=>{ const x=lawQSt(o.q.id)||{w:0,streak:0};
    md+=dump(o.q,o.q.subject+"·"+o.q.sec+" 第"+o.q.num+"题（本月错 "+o.n+" 次 / 累计错 "+x.w+" 次 / 连对 "+x.streak+"/"+LAW_MASTER+
      ((x.fuzzy)?" / 我还标了模糊"+((x.fzo&&x.fzo.length)?"，不确定选项："+x.fzo.join("、"):""):"")+"）"); });
  if(fzl.length){ md+="## 二、答对但我没把握的题（自己标的「模糊」）\n\n";
    fzl.forEach(q=>{ const x=lawQSt(q.id)||{};
      md+=dump(q,q.subject+"·"+q.sec+" 第"+q.num+"题（标过模糊 "+(x.fz||1)+" 次"+
        ((x.fzo&&x.fzo.length)?" / 不确定的选项："+x.fzo.join("、"):"")+(x.w>0?" / 累计错 "+x.w+" 次":"")+"）"); }); }
  const b=lawB(); const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const h=openModal("导出错题记录",
    '<p class="lw-hint">下面是近一个月的错题明细（含题干、答案、解析）。可直接复制发给 Claude 继续梳理薄弱知识点。</p>'+
    '<textarea id="lwTa" class="lw-ta" readonly>'+esc(md)+'</textarea>'+
    '<div class="lw-actions"><button class="lw-go" id="lwCopy">复制全部</button>'+
    '<a class="lw-go alt" id="lwDl" download="法律错题-'+today()+'.md">下载 .md 文件</a></div>');
  h.querySelector("#lwDl").href=url;
  h.querySelector("#lwCopy").onclick=()=>{ const ta=h.querySelector("#lwTa"); ta.select(); ta.setSelectionRange(0,999999);
    try{ document.execCommand("copy"); toast("已复制 ✓"); }catch(e){ toast("请手动长按选择复制"); } };
}

/* ===== 10.8 法律题库 END ===== *//* ===== 10.9 · 管理题库 (140题 + 逐选项知识点 + 不确定标记 + 知识点薄弱度 + 错题本) =====
   独立数据 mgBank(题目/知识点,静态) + mgState(做题状态/日志/批注,热),不改复习/排期/掌握度内核。
   与法律题库(10.8)的关键差别:每个选项都挂了知识点,判分后点选项才展开;
   选项可标「不确定」,答对但标了不确定 = 蒙对,照样计入薄弱统计。 */
const MG_LOG_CAP=6000;
const MG_SECS=["单选题","多选题","判断题"];
const MG_LET=["A","B","C","D"];
let mg={ tab:"quiz", sec:"全部", scope:"全部", kp:"", qi:0, wsort:"weak", wdone:false, book:"全部", rev:{}, revKey:"" };
let mgTimer=null;

function mgB(){ return db.mgBank||(db.mgBank={version:1,modules:[],points:[],questions:[]}); }
function mgQs(){ return mgB().questions||[]; }
function mgPts(){ return mgB().points||[]; }
function mgMods(){ return mgB().modules||[]; }
function mgPMap(){ const m={}; mgPts().forEach(p=>m[p.id]=p); return m; }
function mgS(){ const s=db.mgState||(db.mgState={q:{},log:[],note:{},ui:{}});
  if(!s.q)s.q={}; if(!Array.isArray(s.log))s.log=[]; if(!s.note)s.note={}; if(!s.ui)s.ui={}; return s; }
function mgQSt(id){ return mgS().q[id]||null; }
function mgQEnsure(id){ const s=mgS(); let x=s.q[id];
  if(!x){ x={pick:"",unsure:[],qUns:false,ans:false,ok:null,n:0,w:0,last:null}; s.q[id]=x; }
  if(!Array.isArray(x.unsure)) x.unsure=[]; return x; }
/* 有任何不确定标记(选项级或整题级) */
function mgIsUns(x){ return !!x && (x.qUns || (x.unsure&&x.unsure.length>0)); }
/* 错题本 = 做错过、或者「蒙对」(答对但标了不确定) */
function mgInBook(q){ const x=mgQSt(q.id); return !!x && x.ans && (!x.ok || mgIsUns(x)); }
function mgPct(a,b){ return b?Math.round(a/b*100):0; }

function mgGrade(q,x){
  x.ans=true; x.ok=(x.pick===q.answer); x.n++; if(!x.ok) x.w++; x.last=today();
  const s=mgS(); s.log.push({d:today(),q:q.id,ok:x.ok?1:0,u:mgIsUns(x)?1:0});
  if(s.log.length>MG_LOG_CAP) s.log=s.log.slice(-Math.floor(MG_LOG_CAP*0.7));
  save();
}
function mgCancel(){ if(mgTimer){ clearTimeout(mgTimer); mgTimer=null; } }
function mgGo(d,list){ mgCancel(); const n=mg.qi+d; if(n<0||n>=list.length) return; mg.qi=n; render(); }

function mgList(){ return mgQs().filter(q=>{
  if(mg.sec!=="全部" && q.sec!==mg.sec) return false;
  if(mg.kp && (q.kps||[]).indexOf(mg.kp)<0) return false;
  const x=mgQSt(q.id);
  if(mg.scope==="未做")   return !(x&&x.ans);
  if(mg.scope==="做错")   return !!(x&&x.ans&&!x.ok);
  if(mg.scope==="不确定") return mgIsUns(x);
  if(mg.scope==="做对")   return !!(x&&x.ans&&x.ok);
  return true; }); }

function mgKpStats(){
  const st={}; mgPts().forEach(p=>st[p.id]={id:p.id,total:0,done:0,right:0,wrong:0,guess:0});
  mgQs().forEach(q=>{ const x=mgQSt(q.id);
    (q.kps||[]).forEach(id=>{ const s=st[id]; if(!s) return; s.total++;
      if(x&&x.ans){ s.done++; const u=mgIsUns(x);
        if(x.ok){ s.right++; if(u) s.guess++; } else s.wrong++; } }); });
  Object.keys(st).forEach(k=>{ const s=st[k]; s.score=s.done?(s.wrong*2+s.guess)/s.done:-1; });
  return st;
}
/* 选项说明里的 **xx** 渲染成加粗(先转义再替换,不引入注入风险) */
function mgBold(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function mgKpBox(ids,prefix,text){
  const P=mgPMap();
  const tags=(ids||[]).map(id=>'<button class="mg-nm" data-mgkp="'+esc(id)+'">'+esc(P[id]?P[id].name:id)+'</button>').join("");
  const body=text?mgBold(text):(ids||[]).map(id=>P[id]?esc(P[id].hint):"").filter(Boolean).join("；");
  return '<div class="mg-okp">'+tags+(prefix?esc(prefix):"")+body+'</div>';
}

/* ---------- 模块入口 ---------- */
function mountMg(main){
  const wrap=document.createElement("div"); wrap.className="lw";
  const nBook=mgQs().filter(q=>mgInBook(q)).length;
  const tabs=[["quiz","📝 刷题"],["weak","📊 薄弱点"],["book","🗂️ 错题本"],["log","📄 记录"]];
  wrap.innerHTML='<div class="lw-tabs">'+tabs.map(([k,t])=>
    '<button class="lw-tab'+(mg.tab===k?" on":"")+'" data-t="'+k+'">'+t+

  main.appendChild(wrap);
  wrap.querySelectorAll(".lw-tab").forEach(b=>b.onclick=()=>{ mgCancel(); mg.tab=b.dataset.t; render(); });
  const body=wrap.querySelector("#mgBody");
  if(!mgQs().length){
    body.innerHTML='<div class="empty">管理题库还是空的。<br><span class="lw-hint">载入「管理题库.json」（140 题 · 单选65／多选20／判断55，含逐选项知识点）。只写入题目与知识点，不影响日历、背诵库等其它数据。</span></div>'+
      '<div class="lw-actions"><button class="lw-go" id="mgImp">导入管理题库</button></div>';
    body.querySelector("#mgImp").onclick=mgImport; return; }
  if(mg.tab==="quiz") mgQuiz(body);
  else if(mg.tab==="weak") mgWeak(body);
  else if(mg.tab==="book") mgBook(body);
  else mgLog(body);
  body.querySelectorAll("[data-mgkp]").forEach(b=>b.onclick=()=>{
    mgCancel(); mg.kp=b.dataset.mgkp; mg.sec="全部"; mg.scope="全部"; mg.qi=0; mg.tab="quiz"; render(); });
}

/* ---------- 刷题 ---------- */
function mgQuiz(body){
  const list=mgList();
  if(mg.qi>=list.length) mg.qi=Math.max(0,list.length-1);
  const P=mgPMap();
  const chip=(k,v,cur,extra)=>'<button class="lw-chip'+(cur===v?" on":"")+'" data-'+k+'="'+esc(v)+'">'+esc(v)+(extra||"")+'</button>';
  let done=0,right=0,uns=0;
  list.forEach(q=>{ const x=mgQSt(q.id); if(x&&x.ans){ done++; if(x.ok) right++; if(mgIsUns(x)) uns++; } });
  const autoOn=mgS().ui.autoNext!==false;

  let h='<div class="mg-help">🖐 <b>不确定标记</b>：选项右边的 <b>?</b> —— 拿不准就点亮；下面还有「整题拿不准」。'+
    '标了 ? 的题<b>即使做对也计入薄弱统计</b>，专门揪出「蒙对的」知识点。<br>'+
    '⚡ <b>答对且没标不确定 → 自动跳下一题</b>；答错或蒙对就停下来看解析。<br>'+
    '💡 <b>判分之后</b>点任意选项，展开这一项考的是什么（对的错的都有）；判分前点击只是选答案，不会误触。</div>';
  h+='<div class="lw-chips"><span class="lw-lb">题型</span>'+
    ["全部"].concat(MG_SECS).map(s=>chip("mgsec",s,mg.sec,
      ' <span style="opacity:.6">'+(s==="全部"?mgQs().length:mgQs().filter(q=>q.sec===s).length)+'</span>')).join("")+'</div>';
  h+='<div class="lw-chips"><span class="lw-lb">范围</span>'+
    ["全部","未做","做错","不确定","做对"].map(s=>chip("mgsc",s,mg.scope)).join("")+
    (mg.kp?'<button class="lw-chip on" id="mgKpClr">知识点：'+esc(P[mg.kp]?P[mg.kp].name:mg.kp)+' ✕</button>':"")+'</div>';
  h+='<div class="lw-stat">共 <b>'+list.length+'</b> 题 · 已做 <b>'+done+'</b> · 答对 <b class="g">'+right+'</b> · 不确定 <b>'+uns+'</b>'+
    (done?' · 正确率 <b>'+mgPct(right,done)+'%</b>':"")+
    ' <button class="lw-chip sm" id="mgAuto" style="margin-left:8px">答对自动下一题：'+(autoOn?"开":"关")+'</button>'+
    ' <button class="lw-chip sm" id="mgJump">跳到未做 ▸</button></div>';

  const q=list[mg.qi];
  if(!q){ h+='<div class="empty">这个筛选下没有题目</div>'; body.innerHTML=h; mgQuizBind(body,list,null,null); return; }
  const x=mgQEnsure(q.id);
  if(mg.revKey!==q.id){ mg.revKey=q.id; mg.rev={}; }
  const okp=q.okp||{};
  const isTF=q.sec==="判断题", isMulti=q.sec==="多选题";
  const picks=(x.pick||"").split("").filter(Boolean);

  h+='<div class="lw-card"><div class="lw-meta"><span class="lw-tag t-x">'+esc(q.sec)+'</span>'+
    '<span class="lw-num">第 '+q.num+' 题</span><span class="lw-num">· 教材 p'+esc(q.page)+'</span>'+
    (q.tip?'<span class="lw-tag t-y">选非题</span>':"")+
    (isMulti?'<span class="lw-tag t-h">可多选</span>':"")+
    (x.ans?(x.ok?(mgIsUns(x)?'<span class="lw-tag t-y">蒙对</span>':'<span class="lw-tag t-g">答对</span>'):'<span class="lw-tag t-r">答错</span>'):"")+
    '<span class="lw-pos">'+(mg.qi+1)+' / '+list.length+'</span></div>';
  h+='<div class="lw-stem">'+esc(q.stem)+'</div>';

  if(isTF){
    h+='<div class="lw-opts tf">'+["√","×"].map(v=>{
      let c="lw-opt";
      if(x.ans){ c+=" locked"; if(v===q.answer)c+=" hit"; else if(v===x.pick)c+=" miss"; }
      else if(picks.indexOf(v)>=0) c+=" sel";
      return '<button class="'+c+'" data-mgp="'+v+'">'+v+'</button>'; }).join("")+'</div>';
    if(x.ans&&mg.rev["_"]) h+=mgKpBox(q.kps,"这道判断题考的是：");
    if(x.ans) h+='<div class="mg-tap">💡 点 √／× 看这道题的考点</div>';
  }else{
    h+='<div class="lw-opts">'+MG_LET.filter(L=>q.options&&q.options[L]!=null).map(L=>{
      let c="lw-opt";
      if(x.ans){ c+=" locked"; if(q.answer.indexOf(L)>=0)c+=" hit"; else if(picks.indexOf(L)>=0)c+=" miss"; }
      else{ if(picks.indexOf(L)>=0) c+=" sel"; if(x.unsure.indexOf(L)>=0) c+=" unsure"; }
      const mk=x.unsure.indexOf(L)>=0, one=okp[L], rev=x.ans&&mg.rev[L]&&one;
      return '<div class="mg-ow"><div class="'+c+'" data-mgp="'+L+'"'+(x.ans&&one?' title="点一下看这一项考的是什么"':"")+'>'+
        '<i>'+L+'.</i><span style="flex:1">'+esc(q.options[L])+'</span>'+
        '<button class="mg-qm'+(mk?" on":"")+'" data-mgm="'+L+'" title="标记这一项拿不准">?</button></div>'+
        (rev?mgKpBox([one[0]],"",one[1]):"")+'</div>'; }).join("")+'</div>';
    if(x.ans) h+='<div class="mg-tap">💡 点任意选项，看这一项到底在考什么（对的错的都有）</div>';
  }
  h+='<button class="mg-uns'+(x.qUns?" on":"")+'" id="mgQU"><i>'+(x.qUns?"✓":"")+'</i>整题拿不准（说不清为什么选它）</button>';
  if(!x.ans) h+='<div class="lw-actions"><button class="lw-go" id="mgSub"'+(picks.length?"":" disabled")+'>提交判分</button></div>';
  else{
    h+='<div class="lw-verdict '+(x.ok?(mgIsUns(x)?"warn":"ok"):"no")+'">'+(x.ok?(mgIsUns(x)?"✅ 答对了，但你标了不确定 —— 已计入薄弱统计":"✅ 答对了"):"❌ 答错了")+
      '　你选 <b>'+esc(x.pick||"—")+'</b>　正确 <b>'+esc(q.answer)+'</b>　（做 '+x.n+' 次 / 错 '+x.w+' 次）</div>';
    h+='<div class="mg-exp"><b>【金标尺解析】</b>'+(q.tip?'　⚠️ '+esc(q.tip):"")+'<br>'+esc(q.explain)+'</div>';
    if(q.note) h+='<div class="mg-exp"><b>📌 备注</b><br>'+esc(q.note)+'</div>';
    if(q.hand) h+='<div class="mg-tap">📝 试卷上原有笔迹：<b>'+esc(q.hand)+'</b>'+(q.handNote?"　"+esc(q.handNote):"")+'</div>';
  }
  h+='<div class="lw-chips" style="margin-top:11px"><span class="lw-lb">知识点</span>'+
    (q.kps||[]).map(id=>'<button class="lw-chip sm" data-mgkp="'+esc(id)+'">'+esc(P[id]?P[id].name:id)+'</button>').join("")+'</div>';
  h+='<textarea id="mgNote" class="lw-ta" style="height:56px;margin-top:9px" placeholder="给这道题写批注：为什么错、和哪道题像、书上哪一页…">'+esc(mgS().note[q.id]||"")+'</textarea>';
  h+='<div class="lw-actions"><button class="lw-go alt" id="mgPrev"'+(mg.qi<=0?" disabled":"")+'>← 上一题</button>'+
    (x.ans?'<button class="lw-go alt" id="mgRedo">重做本题</button>':"")+
    '<button class="lw-go" id="mgNext"'+(mg.qi>=list.length-1?" disabled":"")+'>下一题 →</button></div></div>';

  h+='<div class="lw-lb2">题目总览（绿＝对，红＝错，右上橙点＝有不确定标记）</div><div class="mg-grid">'+
    MG_SECS.map(sec=>{ const arr=list.filter(qq=>qq.sec===sec); if(!arr.length) return "";
      return '<div style="width:100%;font-size:11.5px;color:var(--text3);margin:6px 0 2px">'+sec+'</div>'+
        arr.map(qq=>{ const xx=mgQSt(qq.id); let c="mg-cell";
          if(xx&&xx.ans) c+=xx.ok?" ok":" no";
          if(q&&qq.id===q.id) c+=" cur";
          return '<button class="'+c+'" data-mgg="'+esc(qq.id)+'">'+qq.num+(mgIsUns(xx)?"<s></s>":"")+'</button>'; }).join(""); }).join("")+'</div>';

  body.innerHTML=h;
  mgQuizBind(body,list,q,x);
}
function mgQuizBind(body,list,q,x){
  body.querySelectorAll("[data-mgsec]").forEach(b=>b.onclick=()=>{ mgCancel(); mg.sec=b.dataset.mgsec; mg.qi=0; render(); });
  body.querySelectorAll("[data-mgsc]").forEach(b=>b.onclick=()=>{ mgCancel(); mg.scope=b.dataset.mgsc; mg.qi=0; render(); });
  const clr=body.querySelector("#mgKpClr"); if(clr) clr.onclick=()=>{ mg.kp=""; mg.qi=0; render(); };
  const au=body.querySelector("#mgAuto");
  if(au) au.onclick=()=>{ const u=mgS().ui; u.autoNext=(u.autoNext===false); mgCancel(); save(); render(); };
  const jp=body.querySelector("#mgJump");
  if(jp) jp.onclick=()=>{ const i=list.findIndex(qq=>{ const xx=mgQSt(qq.id); return !(xx&&xx.ans); });
    if(i<0){ toast("这个范围内都做完啦"); return; } mgCancel(); mg.qi=i; render(); };
  body.querySelectorAll("[data-mgg]").forEach(b=>b.onclick=()=>{
    const i=list.findIndex(qq=>qq.id===b.dataset.mgg); if(i>=0){ mgCancel(); mg.qi=i; render(); } });
  if(!q) return;
  body.querySelectorAll("[data-mgp]").forEach(b=>b.onclick=(ev)=>{
    if(ev.target.closest("[data-mgm]")) return;
    const v=b.dataset.mgp;
    if(x.ans){ const k=(q.sec==="判断题")?"_":v; mg.rev[k]=!mg.rev[k]; render(); return; }
    if(q.sec==="多选题"){ let cur=(x.pick||"").split("").filter(Boolean);
      const i=cur.indexOf(v); if(i>=0) cur.splice(i,1); else cur.push(v);
      x.pick=cur.sort().join(""); }
    else x.pick=v;
    save(); render(); });
  body.querySelectorAll("[data-mgm]").forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation();
    const L=b.dataset.mgm, i=x.unsure.indexOf(L);
    if(i>=0) x.unsure.splice(i,1); else x.unsure.push(L);
    x.unsure.sort(); save(); render(); });
  const qu=body.querySelector("#mgQU"); if(qu) qu.onclick=()=>{ x.qUns=!x.qUns; save(); render(); };
  const nt=body.querySelector("#mgNote");
  if(nt) nt.onchange=()=>{ const v=nt.value.trim(); const s=mgS();
    if(v) s.note[q.id]=v; else delete s.note[q.id]; save(); };
  const sb=body.querySelector("#mgSub");
  if(sb) sb.onclick=()=>{
    if(!x.pick){ toast("还没选答案"); return; }
    mgGrade(q,x); render();
    if(x.ok && !mgIsUns(x) && mgS().ui.autoNext!==false && mg.qi<list.length-1){
      toast("✅ 正确，下一题"); mgCancel();
      const id=q.id;
      mgTimer=setTimeout(()=>{ mgTimer=null;
        const l2=mgList(); if(l2[mg.qi]&&l2[mg.qi].id===id) mgGo(1,l2); },700);   /* 期间自己翻走了就不抢 */
    } };
  const rd=body.querySelector("#mgRedo");

function mgWeak(body){
  const st=mgKpStats(), P=mgPts();
  let h='<div class="mg-help">薄弱指数 ＝（错题数 × 2 ＋ 蒙对题数 × 1）÷ 已做题数。「蒙对」＝答对了但标了不确定。<br>条越长越薄弱。点知识点名字可以只刷这个知识点下的题。</div>';
  h+='<div class="lw-chips">'+[["weak","按薄弱排序"],["mod","按模块分组"]].map(([k,t])=>
    '<button class="lw-chip'+(mg.wsort===k?" on":"")+'" data-mgws="'+k+'">'+t+'</button>').join("")+
    '<button class="lw-chip'+(mg.wdone?" on":"")+'" id="mgWOnly">只看已做</button></div>';
  const row=p=>{ const s=st[p.id]; if(mg.wdone&&!s.done) return "";
    const rate=s.done?mgPct(s.right,s.done):null;
    const w=s.score<0?0:Math.min(100,s.score/2*100);
    const col=s.score<0?"var(--fill2)":(s.score>=1?"var(--red)":s.score>=.5?"var(--orange)":s.score>0?"#d0a000":"var(--green)");
    return '<tr><td><button class="mg-kn" data-mgkp="'+esc(p.id)+'">'+esc(p.name)+'</button><div class="mg-kh">'+esc(p.hint)+'</div></td>'+
      '<td class="mg-n">'+s.done+'/'+s.total+'</td>'+
      '<td class="mg-n'+(s.wrong?" r":"")+'">'+(s.wrong||"")+'</td>'+
      '<td class="mg-n'+(s.guess?" o":"")+'">'+(s.guess||"")+'</td>'+
      '<td class="mg-n">'+(rate===null?"—":rate+"%")+'</td>'+
      '<td><div class="mg-pb"><i style="width:'+w+'%;background:'+col+'"></i></div></td></tr>'; };
  let rows='<tr><th style="width:42%">知识点</th><th class="mg-n">已做/总</th><th class="mg-n">错</th><th class="mg-n">蒙对</th><th class="mg-n">正确率</th><th style="width:20%">薄弱指数</th></tr>';
  if(mg.wsort==="weak"){
    rows+=P.slice().sort((a,b)=>{ const A=st[a.id],B=st[b.id];
      return (B.score!==A.score)?B.score-A.score:B.wrong-A.wrong; }).map(row).join("");
  }else{
    mgMods().forEach(m=>{ const r=P.filter(p=>p.m===m.id).map(row).join(""); if(!r) return;
      rows+='<tr class="mod"><td colspan="6">'+esc(m.name)+'　<span style="font-weight:400;color:var(--text3)">'+esc(m.desc||"")+'</span></td></tr>'+r; });
  }
  h+='<div class="lw-card" style="padding:10px 13px"><table class="mg-kb">'+rows+'</table></div>';
  body.innerHTML=h;
  body.querySelectorAll("[data-mgws]").forEach(b=>b.onclick=()=>{ mg.wsort=b.dataset.mgws; render(); });
  body.querySelector("#mgWOnly").onclick=()=>{ mg.wdone=!mg.wdone; render(); };
}

function mgLog(body){
  const s=mgS(), from=addDays(today(),-29);
  const recent=s.log.filter(o=>o.d>=from);
  const tot=recent.length, wr=recent.filter(o=>!o.ok).length;
  const byQ={}; recent.filter(o=>!o.ok).forEach(o=>byQ[o.q]=(byQ[o.q]||0)+1);
  const list=Object.keys(byQ).map(id=>({q:mgQs().find(x=>x.id===id),n:byQ[id]}))
    .filter(o=>o.q).sort((a,b)=>b.n-a.n);
  let done=0,right=0,uns=0,guess=0;
  mgQs().forEach(q=>{ const x=mgQSt(q.id); if(!x||!x.ans) return; done++;
    if(x.ok) right++; if(mgIsUns(x)){ uns++; if(x.ok) guess++; } });
  const st=mgKpStats();
  const weak=mgPts().filter(p=>st[p.id].done&&st[p.id].score>0)
    .sort((a,b)=>st[b.id].score-st[a.id].score).slice(0,8);
  let h='<div class="lw-stat">总题 <b>'+mgQs().length+'</b> · 已做 <b>'+done+'</b> · 答对 <b class="g">'+right+'</b> · 答错 <b class="r">'+(done-right)+'</b>'+
    (done?' · 正确率 <b>'+mgPct(right,done)+'%</b>':"")+'<br>标了不确定 <b>'+uns+'</b> 题，其中蒙对 <b>'+guess+'</b> 题'+
    '<br>近 30 天：做题 <b>'+tot+'</b> 次，做错 <b class="r">'+wr+'</b> 次</div>';

  h+=weak.length?('<div class="lw-card" style="padding:10px 13px"><table class="mg-kb">'+
    weak.map(p=>{ const o=st[p.id];
      return '<tr><td><button class="mg-kn" data-mgkp="'+esc(p.id)+'">'+esc(p.name)+'</button><div class="mg-kh">'+esc(p.hint)+'</div></td>'+
        '<td class="mg-n">错 '+o.wrong+' 蒙对 '+o.guess+'</td><td class="mg-n">'+mgPct(o.right,o.done)+'%</td></tr>'; }).join("")+
    '</table></div>'):'<div class="empty">还没有足够数据</div>';
  h+='<div class="lw-actions"><button class="lw-go" id="mgExp">导出近 30 天错题 .md</button>'+
    '<button class="lw-go alt" id="mgImp2">导入 / 更新题库</button></div>';
  h+='<div class="lw-lb2">近 30 天错过的题（'+list.length+'）</div>'+
    (list.length?list.map(o=>{ const x=mgQSt(o.q.id)||{w:0};
      return '<div class="lw-row h'+Math.min(4,o.n)+' static"><span class="lw-rn">'+o.q.sec[0]+o.q.num+'</span>'+
        '<span class="lw-rs">'+esc(o.q.stem.slice(0,40))+'…</span><span class="lw-rw">本月错'+o.n+'次</span></div>'; }).join("")
      :'<div class="empty">近 30 天没有错题记录</div>');
  body.innerHTML=h;
  body.querySelector("#mgExp").onclick=()=>mgExport(list,tot,wr,from,st);
  body.querySelector("#mgImp2").onclick=mgImport;

/* 只覆盖 mgBank(题目+知识点),不动做题记录,更不动日历/背诵库/卡片背诵等其它数据 */
async function mgAdopt(o){
  const qs=Array.isArray(o.questions)?o.questions:null;
  if(!qs||!qs.length) throw new Error("文件里没有 questions");
  const bad=qs.filter(q=>!q.id||!q.sec||!q.answer);
  if(bad.length) throw new Error("有 "+bad.length+" 条缺 id/sec/answer");
  db.mgBank={version:o.version||1, chapter:o.chapter||"", source:o.source||"",
    modules:Array.isArray(o.modules)?o.modules:[], points:Array.isArray(o.points)?o.points:[], questions:qs};
  await save(); closeModal(); mg.qi=0; mg.revKey=""; render();
  toast("管理题库已更新："+qs.length+" 题 / "+db.mgBank.points.length+" 个知识点");
}

/* ===== 10.10 · 刷题中心 (统一入口 + 自由组卷 + 机考界面) =====
   不新增题库：题目从 lawBank / mgBank 读，做题状态写回各自的 lawState / mgState，
   所以错题本、模糊标记、知识点薄弱度这些既有进度全部延续，不会因为换界面而丢。

const QZ_MODE={practice:"练习",exam:"模拟考试"};

/* 真题结构（2027四川急需紧缺《综合测试》）：判断20×0.5 + 单选60×0.8 + 多选10×1.2 = 客观题70分，
   另有写作1题30分（本题库没有写作题，所以卷面满分按客观题 70 分算）。 */
const QZ_REAL={"单选题":60,"多选题":10,"判断题":20};   // 各题型题数

         cur:0, showExp:false, cardOpen:false, showHist:true };

/* ---------- 习思想题库的做题状态 ----------
   法律/管理各有自己的模块存状态，习思想没有独立模块，所以状态层放在这里。
   错题规则与法律题库一致：错 1 次入册，连对 SJ_MASTER 次才移出。 */
const SJ_MASTER=2, SJ_LOG_CAP=4000;
function sjS(){ const s=db.sjState||(db.sjState={q:{},log:[]}); if(!s.q)s.q={}; if(!s.log)s.log=[]; return s; }
function sjQSt(id){ return sjS().q[id]||null; }
function sjQEnsure(id){ const s=sjS(); let x=s.q[id];
  if(!x){ x={w:0,r:0,n:0,streak:0,mastered:false,last:null}; s.q[id]=x; }
  if(!x.fzo) x.fzo=[];        /* 标为「不确定」的选项字母 */
  if(x.fz==null) x.fz=0;      /* 标过几次「模糊」 */
  return x; }
function sjInBook(id){ const x=sjQSt(id); return !!x && x.w>0 && !x.mastered; }
function sjSetFuzzy(id,on){ const x=sjQEnsure(id);
  if(on&&!x.fuzzy) x.fz=(x.fz||0)+1;
  x.fuzzy=!!on; if(!on) x.fzo=[]; save(); }
function sjToggleOpt(id,k){ const x=sjQEnsure(id); const i=x.fzo.indexOf(k);
  if(i>=0) x.fzo.splice(i,1); else { x.fzo.push(k); if(!x.fuzzy){ x.fuzzy=true; x.fz=(x.fz||0)+1; } }
  save(); }
function sjGrade(id,ok){ const x=sjQEnsure(id); x.n++; x.last=today();
  if(ok){ x.r++; if(x.w>0){ x.streak++; if(x.streak>=SJ_MASTER) x.mastered=true; } }
  else  { x.w++; x.streak=0; x.mastered=false; }
  const s=sjS(); s.log.push({d:today(),q:id,ok:ok?1:0});
  if(s.log.length>SJ_LOG_CAP) s.log=s.log.slice(-Math.floor(SJ_LOG_CAP*0.7));
  save(); }

  if(x.fz==null) x.fz=0;      /* 标过几次「模糊」 */

function mzSetFuzzy(id,on){ const x=mzQEnsure(id);

function mzToggleOpt(id,k){ const x=mzQEnsure(id); const i=x.fzo.indexOf(k);

function mzGrade(id,ok){ const x=mzQEnsure(id); x.n++; x.last=today();
  if(ok){ x.r++; if(x.w>0){ x.streak++; if(x.streak>=MZ_MASTER) x.mastered=true; } }
