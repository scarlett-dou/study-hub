/* ---------- 问答（你问/解答）与解析标注 ---------- */
/* 题库结构化问答：bank.qa = { 题id:{q?,a} }。显示时与本机 note/ans 合并；
   删除只在她自己的 state 记墓碑（qaDel），公开题库不动；重新写备注自动解除墓碑。 */
/* ---------- 国省情：状态层（与马哲同构） ---------- */
function gsS(){ const s=db.gsState||(db.gsState={q:{},log:[]}); if(!s.q)s.q={}; if(!s.log)s.log=[]; return s; }
function gsQSt(id){ return gsS().q[id]||null; }
function gsQEnsure(id){ const s=gsS(); let x=s.q[id];
  if(!x) x=s.q[id]={n:0,w:0,r:0,streak:0,mastered:false,last:null,fuzzy:false,fzo:[]};
  if(!Array.isArray(x.fzo)) x.fzo=[];
  return x; }
function gsInBook(id){ const x=gsQSt(id); return !!x && x.w>0 && !x.mastered; }
function gsSetFuzzy(id,on){ const x=gsQEnsure(id);
  x.fuzzy=!!on; if(!on) x.fzo=[]; save(); }
function gsToggleOpt(id,k){ const x=gsQEnsure(id); const i=x.fzo.indexOf(k);
  if(i<0) x.fzo.push(k); else x.fzo.splice(i,1); x.fuzzy=x.fzo.length>0||x.fuzzy; save(); }
function gsGrade(id,ok){ const x=gsQEnsure(id); x.n++; x.last=today();
  if(ok){ x.r++; x.streak=(x.streak||0)+1; if(x.streak>=2) x.mastered=true; }
  else { x.w++; x.streak=0; x.mastered=false; }
  const s=gsS(); s.log.push({d:today(),q:id,ok:ok?1:0});
  if(s.log.length>4000) s.log=s.log.slice(-4000);
  save(); }
function qzBankQa(q){ const b={law:db.lawBank,mg:db.mgBank,sj:db.sjBank,mz:db.mzBank,gs:db.gsBank}[q.src];
  return (b&&b.qa&&b.qa[q.id])||null; }
function qzQaDel(q,set){
  if(q.src==="mg"){ const s=mgS(); if(!s.qaDel) s.qaDel={};
    if(set===undefined) return !!s.qaDel[q.id];
    if(set) s.qaDel[q.id]=1; else delete s.qaDel[q.id]; save(); return set; }
  if(set===undefined){ const x=(q.src==="law"?lawQSt(q.id):q.src==="sj"?sjQSt(q.id):q.src==="gs"?gsQSt(q.id):mzQSt(q.id)); return !!(x&&x.qaDel); }
  const x=(q.src==="law"?lawQEnsure(q.id):q.src==="sj"?sjQEnsure(q.id):q.src==="gs"?gsQEnsure(q.id):mzQEnsure(q.id));
  if(set) x.qaDel=1; else delete x.qaDel; save(); return set;
}
function qzQa(q){
  if(qzQaDel(q)) return null;
  const bq=qzBankQa(q), my=qzNoteGet(q), ans=qzAnsGet(q);
  const question=my||(bq&&bq.q)||"", answer=ans||(bq&&bq.a)||"";
  if(!question&&!answer) return null;
  return {q:question,a:answer};
}
function qzQaCard(q,withDel){ const _qa=qzQa(q); if(!_qa) return "";
  return '<div class="qz-qa">'+
    (_qa.q?'<div class="qz-qa-q"><i>🙋 我的疑问</i>'+qzHlWrap(q,_qa.q)+'</div>':"")+
    (_qa.a?'<div class="qz-qa-a"><i>💡 解答'+(_qa.q?"":"（补充讲解）")+'</i>'+qzHlWrap(q,_qa.a)+'</div>':"")+
    (withDel?'<div class="qz-qa-foot"><button class="qz-qadel" id="qzQaDel">🗑 已解决，删除这条问答</button></div>':"")+
    '</div>'; }
function qzQaRemove(q){
  if(!confirm("删除这道题的提问与解答？\n（只删这条问答的显示，题目、解析和做题记录都不受影响）")) return;
  qzNoteSet(q,""); qzAnsSet(q,""); qzQaDel(q,true); toast("已删除"); render();
}
/* --- 标红：存 qzState.hls = [{t,src,id,txt,d}] --- */
function qzHls(){ const s=qzState(); if(!Array.isArray(s.hls)) s.hls=[]; return s.hls; }
function qzHlWrap(q,raw){
  let html=esc(raw||"");
  qzHls().filter(h=>h.src===q.src&&h.id===q.id).forEach(h=>{
    const t=esc(h.txt); if(!t) return;
    if(html.indexOf(t)>=0) html=html.replace(t,()=>'<span class="qz-hl" data-hl="'+esc(h.t)+'" title="点一下取消标红">'+t+'</span>');
  });
  return html.replace(/\n/g,"<br>");
}
function qzExpHtml(q){ return qzHlWrap(q,q.explain||"（无解析）"); }
function qzHlAdd(q,txt){
  txt=String(txt||"").trim(); if(!txt) return;
  const hs=qzHls();
  if(hs.some(h=>h.src===q.src&&h.id===q.id&&h.txt===txt)){ toast("这段已经标过了"); return; }
  hs.push({t:uid(),src:q.src,id:q.id,txt:txt,d:today()});
  save(); toast("已标红 ✓，汇总在首页「🖍 标注」");
  try{ window.getSelection().removeAllRanges(); }catch(e){}
  render();
}
function qzHlRemove(t){ const s=qzState(); s.hls=qzHls().filter(h=>h.t!==t); save(); render(); }
/* 全局只装一次：解析区里有选中文字时，显示「标红」按钮并缓存选中内容
   （手机上点按钮会先取消选区，所以按钮按下时用缓存的 qzHlTxt） */
let qzHlTxt="";
(function(){ document.addEventListener("selectionchange",()=>{
  const exp=document.getElementById("qzExpWrap")||document.getElementById("qzExp"), bar=document.getElementById("qzHlBar");
  if(!exp||!bar) return;
  const sel=window.getSelection();
  const t=sel&&!sel.isCollapsed?String(sel).trim():"";
  const ok=!!t&&t.length>=2&&t.length<=600&&exp.contains(sel.anchorNode)&&exp.contains(sel.focusNode);
  if(ok) qzHlTxt=t;
  bar.style.display=ok?"":"none";
}); })();
/* --- 标注汇总页 --- */
function qzHlPage(main){
  const hls=qzHls().slice().reverse();
  const map={}; qzAll().forEach(q=>map[q.src+"|"+q.id]=q);
  const NAME={law:"法律",mg:"管理",sj:"习思想",mz:"马哲"};
  let h='<div class="qz-hd"><h2>🖍 我的标注</h2><span class="qz-sub">'+hls.length+' 条 · 点摘录展开原题</span></div>';
  h+='<div class="qz-actions"><button class="qz-btn sm" id="qzBack">‹ 返回刷题</button></div>';
  if(!hls.length) h+='<div class="qz-sub" style="padding:18px 2px;line-height:2">还没有标注。做题判分后，在解析里<b>长按选中</b>想记住的句子，点「🖍 标红选中的内容」——所有标红都会汇总到这里。</div>';
  h+='<div class="qz-hls">'+hls.map(x=>{
    const q=map[x.src+"|"+x.id];
    const subj=q?q.subject:(NAME[x.src]||x.src);
    return '<div class="qz-hlrow">'+
      '<button class="qz-hlmain" data-open="'+esc(x.t)+'">'+
        '<span class="qz-hltag">'+esc(subj)+(q?' · '+esc(q.sec)+' 第'+q.num+'题':"")+(x.d?' · '+esc(x.d):"")+'</span>'+
        '<span class="qz-hltxt">'+esc(x.txt)+'</span></button>'+
      '<button class="qz-hlx" data-del="'+esc(x.t)+'" title="删除标注">✕</button>'+
      '<div class="qz-hlq" id="qzhl-'+esc(x.t)+'">'+
        (q?('<div class="qz-hlstem">'+esc(q.stem).replace(/\n/g,"<br>")+'</div>'+
            (q.options?Object.keys(q.options).map(k=>'<div class="qz-hlopt'+(q.answer.indexOf(k)>=0?" hit":"")+'">'+esc(k)+'. '+esc(q.type==="tf"?(k==="√"?"正确":"错误"):q.options[k])+'</div>').join(""):
              '<div class="qz-hlopt hit">答案：'+esc(q.answer)+'</div>')+
            '<div class="qz-exp"><b>【答案】'+esc(q.answer)+'</b><br>'+qzExpHtml(q)+'</div>'+qzQaCard(q,false))
          :'<span class="qz-sub">这道题不在当前题库里（可能题库还没载入）</span>')+
      '</div></div>'; }).join("")+'</div>';
  main.innerHTML=h;
  main.querySelector("#qzBack").onclick=()=>{ qz.view="home"; render(); };
  main.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const el=main.querySelector('[id="qzhl-'+b.dataset.open+'"]'); if(el) el.classList.toggle("open"); });
  main.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ if(confirm("删除这条标注？")) qzHlRemove(b.dataset.del); });
}

/* ---------- 题库适配层：把四个题库摊平成一套结构 ---------- */
function qzSrcs(){ return [
  { key:"law", group:"法律", qs:()=>((db.lawBank&&db.lawBank.questions)||[]), subj:q=>q.subject||"法律",
    type:q=>q.type||(q.sec==="判断题"?"tf":"mc"), pts:()=>((db.lawBank&&db.lawBank.points)||[]),
    kps:q=>q.kps||[] },
  { key:"mg",  group:"管理", qs:()=>((db.mgBank&&db.mgBank.questions)||[]),  subj:()=>"管理",
    type:q=>(q.sec==="判断题"?"tf":"mc"),
    pts:()=>(((db.mgBank&&db.mgBank.points)||[]).map(p=>({id:p.id,subject:"管理",name:p.name,hint:p.hint||""}))),
    kps:q=>q.kps||[] },
  { key:"sj",  group:"习思想", qs:()=>((db.sjBank&&db.sjBank.questions)||[]), subj:()=>"习思想",
    type:q=>q.type||(q.sec==="判断题"?"tf":"mc"),
    /* 习思想的「知识点」就是她背诵库里的章节（1—16 章，第九章拆 9.1—9.5） */
    pts:()=>(((db.sjBank&&db.sjBank.chapters)||[]).map(c=>({id:"sjc-"+c.key, subject:"习思想", name:c.name, hint:""}))),
    kps:q=>(q.ch?["sjc-"+q.ch]:[]) },
  { key:"gs",  group:"国省情", qs:()=>((db.gsBank&&db.gsBank.questions)||[]), subj:()=>"国省情",
    type:q=>q.type||(q.sec==="判断题"?"tf":"mc"),
    /* 知识点＝她自己两份笔记的一级/二级标题；grp 用一级标题，组卷时可先按章筛 */
    pts:()=>(((db.gsBank&&db.gsBank.points)||[]).map(p=>({id:p.id,subject:"国省情",name:p.subject+"·"+p.name,grp:p.chapter||"",hint:p.chapter||""}))),
    kps:q=>q.kps||[] },
  { key:"mz",  group:"马哲", qs:()=>((db.mzBank&&db.mzBank.questions)||[]), subj:()=>"马哲",
    type:q=>q.type||(q.sec==="判断题"?"tf":"mc"),
    /* 马哲的知识点＝她自己的笔记《马克思主义哲学》里的五章及其条目，共 56 个 */
    pts:()=>(((db.mzBank&&db.mzBank.points)||[]).map(p=>({id:p.id,subject:"马哲",name:p.name,grp:p.chapter||"",hint:p.chapter||""}))),
    kps:q=>q.kps||[] },
]; }
function qzAll(){ const out=[];
  qzSrcs().forEach(s=>s.qs().forEach(q=>out.push({
    src:s.key, id:q.id, group:s.group, subject:s.subj(q), sec:q.sec, num:q.num,
    type:s.type(q), stem:q.stem, options:q.options, answer:q.answer, explain:q.explain,
    /* QZORGSTAR: org＝出题机构（无非 / 金标尺），star＝该机构标的 1–5 星难度。
       老数据没有 org 字段，法律题一律当金标尺；别的题库没有这两个维度。 */
    org:q.org||(s.key==="law"?"金标尺":""), star:+q.star||0,
    mark:q.mark||"", page:q.page, kps:(s.kps?s.kps(q):(q.kps||[])), _raw:q })));
  return out; }
/* 统一的做题状态视图（各自读各自的 state） */
function qzSt(q){
  if(q.src==="law"){ const x=lawQSt(q.id);
    return x?{done:x.n>0,wrong:x.w>0,inBook:lawInBook(q.id),fuzzy:!!x.fuzzy,mastered:!!x.mastered,w:x.w||0}:null; }
  if(q.src==="sj"){ const x=sjQSt(q.id);
    return x?{done:x.n>0,wrong:x.w>0,inBook:sjInBook(q.id),fuzzy:!!x.fuzzy,mastered:!!x.mastered,w:x.w||0}:null; }
  if(q.src==="mz"){ const x=mzQSt(q.id);
    return x?{done:x.n>0,wrong:x.w>0,inBook:mzInBook(q.id),fuzzy:!!x.fuzzy,mastered:!!x.mastered,w:x.w||0}:null; }
  if(q.src==="gs"){ const x=gsQSt(q.id);
    return x?{done:x.n>0,wrong:x.w>0,inBook:gsInBook(q.id),fuzzy:!!x.fuzzy,mastered:!!x.mastered,w:x.w||0}:null; }
  const x=mgQSt(q.id);
  return x&&x.ans?{done:true,wrong:!x.ok,inBook:mgInBook(q._raw),fuzzy:mgIsUns(x),mastered:false,w:x.w||0}:null;
}
/* 备注：我对这道题的思考 / 不懂的地方。法律存 lawState.q[id].note，管理存 mgState.note[id]。 */
function qzNoteGet(q){ if(q.src==="law"){ const x=lawQSt(q.id); return (x&&x.note)||""; }
  if(q.src==="sj"){ const x=sjQSt(q.id); return (x&&x.note)||""; }
  if(q.src==="mz"){ const x=mzQSt(q.id); return (x&&x.note)||""; }
  if(q.src==="gs"){ const x=gsQSt(q.id); return (x&&x.note)||""; }
  return (mgS().note||{})[q.id]||""; }
function qzNoteSet(q,t){ t=String(t||"");
  if(q.src==="law"){ const x=lawQEnsure(q.id); if(t) x.note=t; else delete x.note; }
  else if(q.src==="sj"){ const x=sjQEnsure(q.id); if(t) x.note=t; else delete x.note; }
  else if(q.src==="mz"){ const x=mzQEnsure(q.id); if(t) x.note=t; else delete x.note; }
  else if(q.src==="gs"){ const x=gsQEnsure(q.id); if(t) x.note=t; else delete x.note; }
  else { const s2=mgS(); if(!s2.note) s2.note={}; if(t) s2.note[q.id]=t; else delete s2.note[q.id]; }
  if(t) qzQaDel(q,false);   /* 重新提问＝要重新看到问答卡片 */
  save(); }
/* Claude 对这条备注的解答。跟备注放在一起，存她自己的状态里，不写进题库（题库要公开发布）。 */
function qzAnsGet(q){ if(q.src==="law"){ const x=lawQSt(q.id); return (x&&x.ans)||""; }
  if(q.src==="sj"){ const x=sjQSt(q.id); return (x&&x.ans)||""; }
  if(q.src==="mz"){ const x=mzQSt(q.id); return (x&&x.ans)||""; }
  if(q.src==="gs"){ const x=gsQSt(q.id); return (x&&x.ans)||""; }
  return ((mgS().ans)||{})[q.id]||""; }
function qzAnsSet(q,t){ t=String(t||"");
  if(q.src==="law"){ const x=lawQEnsure(q.id); if(t) x.ans=t; else delete x.ans; }
  else if(q.src==="sj"){ const x=sjQEnsure(q.id); if(t) x.ans=t; else delete x.ans; }
  else if(q.src==="mz"){ const x=mzQEnsure(q.id); if(t) x.ans=t; else delete x.ans; }
  else if(q.src==="gs"){ const x=gsQEnsure(q.id); if(t) x.ans=t; else delete x.ans; }
  else { const s2=mgS(); if(!s2.ans) s2.ans={}; if(t) s2.ans[q.id]=t; else delete s2.ans[q.id]; }
  save(); }
/* 问过问题的题（答题卡上要标出来） */
function qzAsked(q){ return !!(qzNoteGet(q)||qzAnsGet(q)); }

/* 有备注的题（给薄弱点整理用） */
function qzNoted(){ return qzAll().filter(q=>qzNoteGet(q)); }

/* 判分并写回原模块的状态（错题本规则完全沿用各自模块的） */
function qzGrade(q,pick){
  const ok=(pick===q.answer);
  if(q.src==="law"){ lawGrade(q.id,ok); }
  else if(q.src==="sj"){ sjGrade(q.id,ok); }
  else if(q.src==="mz"){ mzGrade(q.id,ok); }
  else if(q.src==="gs"){ gsGrade(q.id,ok); }
  else { const x=mgQEnsure(q.id); x.pick=pick; mgGrade(q._raw,x); }
  return ok;
}
/* 这道题以前做过没有、对还是错——组卷时「显示历史」用 */
function qzHist(q){
  if(q.src==="law"){ const x=lawQSt(q.id); if(!x||!x.n) return null;
    return {n:x.n, w:x.w||0, r:x.r||0, mastered:!!x.mastered, fuzzy:!!x.fuzzy, book:x.book||"",
            sysN:Math.max(0,(x.n||0)-(x.book?1:0)),   /* 扣掉书上补录的那一次,剩下才是系统里做的 */
            sysW:Math.max(0,(x.w||0)-(x.book?1:0)),   /* 同上:系统里错了几次 */
            last: x.w>0&&!x.mastered ? "错" : (x.r>0?"对":"") , date:x.last||""}; }
  if(q.src==="sj"){ const x=sjQSt(q.id); if(!x||!x.n) return null;
    return {n:x.n, w:x.w||0, r:x.r||0, mastered:!!x.mastered, fuzzy:!!x.fuzzy,
            last: x.w>0&&!x.mastered ? "错" : (x.r>0?"对":""), date:x.last||""}; }
  if(q.src==="mz"){ const x=mzQSt(q.id); if(!x||!x.n) return null;
    return {n:x.n, w:x.w||0, r:x.r||0, mastered:!!x.mastered, fuzzy:!!x.fuzzy,
            last: x.w>0&&!x.mastered ? "错" : (x.r>0?"对":""), date:x.last||""}; }
  const x=mgQSt(q.id); if(!x||!x.ans) return null;
  return {n:x.n||1, w:x.w||0, r:x.ok?1:0, mastered:false, fuzzy:mgIsUns(x),
          last: x.ok?"对":"错", date:x.last||""};
}

/* 层级：科目组 → 子科目 */
function qzTree(){ const t={};
  qzAll().forEach(q=>{ const g=t[q.group]||(t[q.group]={name:q.group,subs:{},n:0});
    g.n++; const s=g.subs[q.subject]||(g.subs[q.subject]={name:q.subject,n:0,done:0,wrong:0});
    s.n++; const st=qzSt(q); if(st){ s.done++; if(st.inBook) s.wrong++; } });
  return t; }
function qzScopeOk(q){
  if(qz.scope==="书上错的"){ const x=(q.src==="law")?lawQSt(q.id):null; return !!(x&&x.book); }
  if(qz.scope==="问过问题") return qzAsked(q);
  const st=qzSt(q);
  switch(qz.scope){
    case "未做":   return !st;
    case "做错过": return !!st&&st.inBook;
    case "模糊":   return !!st&&st.fuzzy;
    case "原书标记": return !!q.mark;
    default: return true;
  } }
function qzPool(){ const sel=qz.pick, kp=qz.kps, anyKp=Object.keys(kp).length;
  const gs=qzGrpKpSet();                     /* 选了大类就只在大类里出题 */
  return qzAll().filter(q=>sel[q.subject]&&qzScopeOk(q)&&
    (!anyKp||(q.kps||[]).some(k=>kp[k]))&&
    (!gs||(q.kps||[]).some(k=>gs[k]))&&       /* 大类和知识点都不选＝该科目全部 */
    /* QZORGSTAR2 机构/难度：都不选就是不限 */
    (!Object.keys(qz.orgs||{}).length||(q.org&&qz.orgs[q.org]))&&
    (!Object.keys(qz.stars||{}).length||(q.star&&qz.stars[q.star]))); }

/* ---------- QZORGSTAR2：出题机构 / 难度星级 ---------- */
/* 无非题库每题自带 1–5 星难度，金标尺题库没有；两套题合在 lawBank 里靠 org 区分。
   下面三个统计都只看当前所选科目；没选科目就统计全部。 */
function qzOrgs(){ const sel=qz.pick, any=Object.keys(sel).length, c={};
  qzAll().forEach(q=>{ if(!q.org) return; if(any&&!sel[q.subject]) return; c[q.org]=(c[q.org]||0)+1; });
  return Object.keys(c).sort().map(k=>({name:k,n:c[k]})); }
function qzStars(){ const sel=qz.pick, any=Object.keys(sel).length, c={};
  qzAll().forEach(q=>{ if(!q.star) return; if(any&&!sel[q.subject]) return; c[q.star]=(c[q.star]||0)+1; });
  return c; }
/* 按星级看正确率：用 qzHist 的累计 n/r（作答次数/做对次数），不是只看最后一次。
   只有带星级的题会进这张表。 */
function qzStarStat(){ const rows={};
  qzAll().forEach(q=>{ if(!q.star) return;
    const r=rows[q.star]||(rows[q.star]={star:q.star,n:0,done:0,tries:0,right:0});
    r.n++; const h=qzHist(q); if(!h||!h.n) return;
    r.done++; r.tries+=h.n||0; r.right+=h.r||0; });
  return Object.keys(rows).sort().map(k=>rows[k]); }

/* ---------- 模考卷（整套固定卷，含写作题）----------
   数据放 db.mockBank = { version, papers:[{ id, name, mins, note,
     items:[ {sec:"判断题"|"单选题"|"多选题", stem, options, answer, explain, point},
             {sec:"写作题", material, stem, point, minWords, ref} ] }] }
   与科目题库不同：卷面固定、不抽题、含写作；做题记录单独存在 qzState.mock 里，
   不写进 lawState/mgState（模考是整卷成绩，不该污染分科目的错题本）。 */
function qzMocks(){ return ((db.mockBank&&db.mockBank.papers)||[]); }
function qzMockById(id){ return qzMocks().find(p=>p.id===id)||null; }
function qzMockState(){ const s=qzState(); if(!s.mock) s.mock={}; return s.mock; }

/* ---------- 组卷 ---------- */
function qzShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function qzBuild(){
  const pool=qzPool(); if(!pool.length) return null;
  let items=[];
  if(qz.take==="all"){                       /* 全部：把选中范围内的题全列出来 */
    items=QZ_SECS.reduce((a,sec)=>a.concat(qzShuffle(pool.filter(q=>q.sec===sec))),[]);
  } else {                                   /* 按题型题数抽 */
    const n=qz.nums||QZ_REAL;
    QZ_SECS.forEach(sec=>{
      const want=Math.max(0,+n[sec]||0);
      items=items.concat(qzShuffle(pool.filter(q=>q.sec===sec)).slice(0,want));
    });
  }
  items.sort((a,b)=>QZ_SECS.indexOf(a.sec)-QZ_SECS.indexOf(b.sec));   /* 卷面：单选→多选→判断 */
  if(!items.length) return null;
  return { id:uid(), mode:qz.mode, mins:qz.mins, createdAt:new Date().toISOString(),
           usedMs:0, resumeAt:Date.now(), items:items.map(q=>({src:q.src,id:q.id})),
           picks:{}, marks:{}, cur:0, submitted:false, score:null };
}
/* 卷面满分 & 得分（按真题分值） */
function qzFull(qs){ return qs.reduce((s,q)=>s+(QZ_PTS[q.sec]||1),0); }
function qzGot(qs,p){ return qs.reduce((s,q)=>s+((p.picks[q.src+"|"+q.id]===q.answer)?(QZ_PTS[q.sec]||1):0),0); }
function qzR1(n){ return Math.round(n*10)/10; }
function qzState(){ const s=db.qzState||(db.qzState={paper:null,last:null,exams:[]});
  if(!Array.isArray(s.exams)) s.exams=[]; if(!Array.isArray(s.hls)) s.hls=[]; return s; }
function qzPaper(){ return qzState().paper; }
function qzItems(){ const p=qzPaper(); if(!p) return [];
  const map={}; qzAll().forEach(q=>map[q.src+"|"+q.id]=q);
  return p.items.map(it=>map[it.src+"|"+it.id]).filter(Boolean); }


/* ---------- 知识点（法律题库按法典编章挂点，管理题库自带 points） ---------- */
/* 选中科目下的全部知识点，带题数。不选科目就返回全部。 */
function qzPoints(){
  const sel=qz.pick, any=Object.keys(sel).length;
  const cnt={}; qzAll().forEach(q=>{ if(any&&!sel[q.subject]) return;
    (q.kps||[]).forEach(k=>cnt[k]=(cnt[k]||0)+1); });
  const out=[];
  qzSrcs().forEach(s=>{ if(!s.pts) return;
    s.pts().forEach(p=>{ if(!cnt[p.id]) return;
      out.push({ id:p.id, subject:p.subject||s.group, name:p.name, grp:p.grp||"", hint:p.hint||"", n:cnt[p.id], ord:out.length }); }); });
  return out; }
/* 知识点 id → 名字。答完题要显示「这题属于哪一章 / 哪个知识点」。 */
function qzKpNames(q){
  const ids=q.kps||[]; if(!ids.length) return [];
  const map={};
  qzSrcs().forEach(s=>{ if(!s.pts) return; s.pts().forEach(p=>map[p.id]=(p.grp?qzGrpShort(p.grp)+" · ":"")+p.name); });
  return ids.map(i=>map[i]).filter(Boolean);
}
/* 一个知识点的掌握情况：做了多少、错多少、蒙对多少（答对但标了模糊）、薄弱指数 */
function qzKpStat(id){
  const qs=qzAll().filter(q=>(q.kps||[]).indexOf(id)>=0);
  let done=0,wrong=0,luck=0;
  qs.forEach(q=>{ const st=qzSt(q); if(!st||!st.done) return; done++;
    if(st.inBook) wrong++; else if(st.fuzzy) luck++; });
  const weak=done?((wrong*2+luck)/done):0;
  return { n:qs.length, done:done, wrong:wrong, luck:luck, weak:weak }; }
/* ---------- 大类：知识点之上再高一层 ----------
   马哲的大类＝她笔记《马克思主义哲学》里的五章一级标题（哲学概述/唯物论/辩证法/认识论/唯物史观）。
   题库的 points 里带 chapter 就会有大类；不带的题库（法律/管理/习思想）这一层自动不出现。 */
function qzGrpShort(g){ return String(g||"").replace(/^第[一二三四五六七八九十]+章\s*/,""); }
/* 大类列表 + 每个大类的题数/已做/错/蒙对。按「题」去重统计，不是把知识点题数相加。 */
function qzGrps(pts){ if(!qz.kpg) qz.kpg={};
  const list=pts||qzPoints();
  const g2={}, order=[], kp2g={};
  list.forEach(p=>{ if(!p.grp) return; kp2g[p.id]=p.grp;
    if(!g2[p.grp]){ g2[p.grp]={name:p.grp,n:0,done:0,wrong:0,luck:0}; order.push(p.grp); } });
  if(!order.length) return [];
  const sel=qz.pick, any=Object.keys(sel).length;
  qzAll().forEach(q=>{ if(any&&!sel[q.subject]) return;
    const seen={}; (q.kps||[]).forEach(k=>{ const g=kp2g[k]; if(g) seen[g]=1; });
    const ks=Object.keys(seen); if(!ks.length) return;
    const st=qzSt(q);
    ks.forEach(g=>{ const o=g2[g]; o.n++;
      if(st&&st.done){ o.done++; if(st.inBook) o.wrong++; else if(st.fuzzy) o.luck++; } }); });
  return order.map(g=>g2[g]); }
/* 选中的大类覆盖到哪些知识点（没选大类返回 null＝不过滤） */
function qzGrpKpSet(){ if(!qz.kpg) qz.kpg={};
  if(!Object.keys(qz.kpg).length) return null;
  const set={}; qzPoints().forEach(p=>{ if(p.grp&&qz.kpg[p.grp]) set[p.id]=1; }); return set; }
/* 首页薄弱排行用：做过 >=3 题且有错/蒙对的点，按薄弱指数排 */
function qzWeakList(min){
  min=min||3;
  const save_=qz.pick; qz.pick={};                 /* 排行看全部科目 */
  const out=qzPoints().map(p=>Object.assign({},p,qzKpStat(p.id)))
    .filter(p=>p.done>=min&&(p.wrong||p.luck))
    .sort((a,b)=>b.weak-a.weak||b.wrong-a.wrong);
  qz.pick=save_; return out; }
/* ---------- 模块入口 ---------- */
function mountQuiz(main){
  const p=qzPaper();
  if(p&&!p.submitted&&qz.view==="run") return qzRun(main);
  if(qz.view==="result") return qzResult(main);
  if(qz.view==="build")  return qzBuilder(main);
  if(qz.view==="mock")   return qzMockList(main);
  if(qz.view==="mockSubs") return qzMockSubs(main);
  if(qz.view==="mockQs")   return qzMockQs(main);
  if(qz.view==="hl")     return qzHlPage(main);
  qzHome(main);
}

/* 载入 / 更新习思想题库。**只写入 sjBank**，做题记录、错题本、以及日历/背诵库/课程都不受影响。
   数据平时经私有仓库 study-data 自动同步过来，这里是同步没到位时的兜底入口。 */
async function sjAdopt(data){
  if(!data||!Array.isArray(data.questions)||!data.questions.length) throw new Error("这个文件里没有题目");
  const bad=data.questions.filter(q=>!q.id||!q.stem||!q.sec||!q.answer).length;
  if(bad) throw new Error("有 "+bad+" 道题缺 id/题干/题型/答案，没有导入");
  db.sjBank=data; save();
  toast("习思想题库已载入 "+data.questions.length+" 题 ✓");
  closeModal(); render();
}
function sjImport(){
  const online=/^https?:/.test(location.protocol);
  const has=((db.sjBank&&db.sjBank.questions)||[]).length;
  const h=openModal("载入 / 更新习思想题库",
    '<p class="qz-sub">载入「习思想题库.json」（270 题）。<b>只写入题目</b>；你的做题记录、错题本进度、背诵库和课程都不受影响。'+
    (has?'<br>当前已有 <b>'+has+'</b> 题。':"")+'</p>'+
    (online?'<div class="qz-actions" style="margin-bottom:11px"><button class="qz-btn pri" id="qzSjNet">📶 从网上载入</button></div>':"")+
    '<p class="qz-sub">或者自己选文件：</p>'+
    '<input type="file" id="qzSjFile" accept=".json,application/json">'+
    '<div id="qzSjMsg" class="qz-sub" style="margin-top:9px"></div>');
  const net=h.querySelector("#qzSjNet");
  if(net) net.onclick=async()=>{
    const msg=h.querySelector("#qzSjMsg"); msg.textContent="下载中…";
    try{ const rs=await fetch("./习思想题库.json",{cache:"no-store"});
      if(!rs.ok) throw new Error("HTTP "+rs.status);
      await sjAdopt(await rs.json());
    }catch(err){ msg.textContent="下载失败（"+err.message+"）。检查一下网络，或者用下面的「选择文件」；也可以在已开云同步的设备上导入一次，其它设备会自动同步过来。"; }
  };
  h.querySelector("#qzSjFile").onchange=(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const msg=h.querySelector("#qzSjMsg"); msg.textContent="读取中…";
    const rd=new FileReader();
    rd.onload=async()=>{ try{ await sjAdopt(JSON.parse(rd.result)); }
      catch(err){ msg.textContent="导入失败："+err.message; } };
    rd.readAsText(f);
  };
}

/* 载入 / 更新国省情题库。**只写入 gsBank**，做题记录、错题本、以及日历/背诵库/课程都不受影响。
   ⚠️ points 必须一起带上 —— 那是按她自己两份笔记的标题划分的知识点，
      丢了「按知识点选题」和薄弱榜对国省情就全废（lawAdopt 当初就是漏了 points）。 */
async function gsAdopt(data){
  if(!data||!Array.isArray(data.questions)||!data.questions.length) throw new Error("这个文件里没有题目");
  const bad=data.questions.filter(q=>!q.id||!q.stem||!q.sec||!q.answer).length;

/* 导出错题 + 备注：给 Claude 整理薄弱点用 */
function qzExport(){
  const NL = "\n";
  const bad = qzAll().filter(q=>{ const st=qzSt(q); return st && st.inBook; });
  const noted = qzNoted();
  const seen = {}; bad.forEach(q=>seen[q.src+"|"+q.id]=1);
  const onlyNote = noted.filter(q=>!seen[q.src+"|"+q.id]);
  const dump = (q, extra)=>{
    const note = qzNoteGet(q);
    let t = "### " + q.subject + "·" + (QZ_SECNAME[q.sec]||q.sec) + " 第" + q.num + "题" + (extra||"") + NL;
    t += q.stem + NL;
    if(q.options) Object.keys(q.options).forEach(k=>{ t += k + ". " + q.options[k] + NL; });
    t += "**答案：**" + q.answer + NL + "**解析：**" + (q.explain||"") + NL;
    if(note) t += "**🙋 我的备注：**" + note + NL;
    return t + NL;
  };
  let md = "# 错题与备注导出 " + today() + NL + NL;
  md += "错题 " + bad.length + " 题；写了备注的 " + noted.length + " 题。" + NL + NL;
  md += "> 「我的备注」是我做题时写下的思考和疑问，请重点根据这些判断我哪些知识点没掌握，并把那些知识点讲清楚。" + NL + NL;
  md += "## 一、错题（做错且还没连对2次）" + NL + NL;
  bad.forEach(q=>{ const st=qzSt(q)||{};
    md += dump(q, "（累计错 " + (st.w||0) + " 次" + (st.fuzzy?" · 标过模糊":"") + "）"); });
  if(onlyNote.length){
    md += "## 二、做对了但写了备注的题" + NL + NL;
    onlyNote.forEach(q=>{ md += dump(q, ""); });
  }
  const blob = new Blob([md], {type:"text/markdown;charset=utf-8"});
  const h = openModal("导出错题与备注",
    '<p class="qz-sub">复制下面全部内容发给 Claude，让它根据你的备注和错题整理薄弱知识点。</p>'+
    '<textarea id="qzTa" class="lw-ta" readonly>' + esc(md) + '</textarea>'+
    '<div class="qz-actions"><button class="qz-btn pri" id="qzCopy">复制全部</button>'+
    '<a class="qz-btn" id="qzDl" download="错题与备注-' + today() + '.md">下载 .md</a></div>');
  h.querySelector("#qzDl").href = URL.createObjectURL(blob);
  h.querySelector("#qzCopy").onclick = ()=>{
    const ta = h.querySelector("#qzTa"); ta.select(); ta.setSelectionRange(0,999999);
    try{ document.execCommand("copy"); toast("已复制 ✓"); }catch(e){ toast("请手动长按复制"); }
  };
}

/* ---------- 模考错题库（MOCK_MODULE_V1） ---------- */
function mkSubjects(p){
  var by={},order=[];
  (p.items||[]).forEach(function(it){
    var s=it.subject||"未分类";
    if(!by[s]){ by[s]={name:s,items:[]}; order.push(s); }
    by[s].items.push(it);
  });
  return order.map(function(s){ return by[s]; }).sort(function(a,b){ return b.items.length-a.items.length; });
}
function mkTagCls(t){ return t==="选非题"?"t1":(t==="定位词"?"t2":(t==="方法"?"t3":"t4")); }
function mkAnsSet(s){ return String(s||"").split(/[,\uFF0C\s]+/).filter(Boolean); }

function qzMockList(main){

        '<span class="mk-sub">每次模考的错题，按科目归档</span></div>';

  }
  h+=ms.map(function(p){
    const n=(p.items||[]).length,st=p.stat||{},subs=mkSubjects(p);
    let meta=(p.date?esc(p.date)+" · ":"");
    if(st.pts!=null) meta+='<span class="mk-score">'+st.pts+" / "+(st.full||100)+' 分</span> · ';

      if(st.objSecs) meta+="　·　用时 "+Math.round(st.objSecs/60)+" 分钟";

/* ---------- 组卷页 ---------- */
function qzBuilder(main){
  const t=qzTree();
  if(!qz.nums) qz.nums=Object.assign({},QZ_REAL);
  const pool=qzPool();
  const avail={}; QZ_SECS.forEach(k=>avail[k]=pool.filter(q=>q.sec===k).length);
  /* 本次实际会出多少题 */
  const plan={}; QZ_SECS.forEach(k=>plan[k]= qz.take==="all" ? avail[k] : Math.min(avail[k], Math.max(0,+qz.nums[k]||0)));
  const total=QZ_SECS.reduce((a,k)=>a+plan[k],0);
  const pts=qzR1(QZ_SECS.reduce((a,k)=>a+plan[k]*QZ_PTS[k],0));
  let h='<div class="qz-hd"><button class="qz-back" id="qzBack">‹ 返回</button><h2>组卷</h2></div>';
  /* ① 科目 */
  h+='<div class="qz-sec"><div class="qz-lb">① 选科目（可多选）</div><div class="qz-subs">';
  Object.keys(t).forEach(g=>{ h+='<div class="qz-grp"><span class="qz-gname">'+esc(g)+'</span>';
    Object.keys(t[g].subs).forEach(sn=>{ const s2=t[g].subs[sn];
      h+='<button class="qz-chip'+(qz.pick[sn]?" on":"")+'" data-subj="'+esc(sn)+'">'+esc(sn)+' <b>'+s2.n+'</b></button>'; });
    h+='</div>'; });
  h+='</div></div>';
  /* QZORGSTAR: 机构 / 难度——题库里真有这两个字段时才出现，别的题库看不到这两排 */
  const _orgs=qzOrgs(), _stc=qzStars(), _stk=Object.keys(_stc).sort();
  if(_orgs.length>1){
    h+='<div class="qz-sec"><div class="qz-lb">① 出题机构 <span class="qz-sub">（不选＝两家一起刷）</span></div><div class="qz-row">'+
       _orgs.map(o=>'<button class="qz-chip'+(qz.orgs[o.name]?" on":"")+'" data-org="'+esc(o.name)+'">'+esc(o.name)+' <b>'+o.n+'</b></button>').join("")+
       '</div></div>'; }
  if(_stk.length){
    h+='<div class="qz-sec"><div class="qz-lb">① 难度 <span class="qz-sub">（无非题库自带的星级；不选＝不限）</span></div><div class="qz-row">'+
       _stk.map(k=>'<button class="qz-chip'+(qz.stars[k]?" on":"")+'" data-star="'+k+'">'+"★".repeat(+k)+'<b>'+_stc[k]+'</b></button>').join("")+
       '</div></div>'; }
  /* ②知识点（不选＝该科目全部） */
  const kps=qzPoints().map(p=>Object.assign({},p,qzKpStat(p.id)));
  const kq=(qz.kpQ||"").trim();
  if(!qz.kpg) qz.kpg={};
  const grps=qzGrps(kps), gmap={}; grps.forEach(g=>gmap[g.name]=1);
  Object.keys(qz.kpg).forEach(g=>{ if(!gmap[g]) delete qz.kpg[g]; });   /* 换科目后清掉失效的大类 */
  const anyG=Object.keys(qz.kpg).length;
  let kshow=kq?kps.filter(p=>p.name.indexOf(kq)>=0||(p.hint||"").indexOf(kq)>=0):kps.slice();
  if(anyG) kshow=kshow.filter(p=>qz.kpg[p.grp]);
  kshow.sort(qz.kpSort==="weak" ? (a,b)=>b.weak-a.weak||b.n-a.n
           : qz.kpSort==="ord"  ? (a,b)=>a.ord-b.ord            /* 习思想按 1→16 章的原顺序 */
           : (a,b)=>b.n-a.n);
  const kpOn=Object.keys(qz.kps).length;
  if(kps.length){
    h+='<div class="qz-sec"><div class="qz-lb">'+(grps.length?'② 大类 / 知识点':'② 知识点')+
       ' <span class="qz-sub">（都不选＝该科目全部；'+(grps.length?'共 '+grps.length+' 个大类 · ':'共 ')+kps.length+' 个知识点）</span></div>';
    if(grps.length){
      h+='<div class="qz-row" style="margin-bottom:9px">'+grps.map(g=>
        '<button class="qz-chip'+(qz.kpg[g.name]?" on":"")+'" data-kpg="'+esc(g.name)+'">'+
        esc(qzGrpShort(g.name))+' <b>'+g.n+'</b>'+(g.wrong?'<i>错'+g.wrong+'</i>':"")+'</button>').join("")+

    h+='<div class="qz-kbar"><input type="text" id="qzKpQ" placeholder="搜知识点…" value="'+esc(qz.kpQ||"")+'">'+

       '<button class="qz-chip sm'+(qz.kpSort==="n"?" on":"")+'" data-ksort="n">题多优先</button>'+
       '<button class="qz-chip sm'+(qz.kpSort==="ord"?" on":"")+'" data-ksort="ord">按顺序</button>'+
       (kpOn?'<button class="qz-chip sm" id="qzKpClr">清空所选（'+kpOn+'）</button>':"")+'</div>';
    h+='<div class="qz-kps">'+kshow.map(p=>{
      const lv=p.done?(p.weak>=1?3:(p.weak>=0.5?2:(p.weak>0?1:0))):0;
      return '<button class="qz-kp'+(qz.kps[p.id]?" on":"")+'" data-kp="'+esc(p.id)+'">'+
        (p.grp&&!anyG?'<span class="qz-kpg">'+esc(qzGrpShort(p.grp))+'</span>':"")+
        '<span class="qz-kpn">'+esc(p.name)+'</span>'+
        '<span class="qz-kpm"><i>'+p.n+' 题</i>'+
        (p.done?'<i>已做 '+p.done+'</i>'+(p.wrong?'<i class="r">错 '+p.wrong+'</i>':"")+(p.luck?'<i class="o">蒙对 '+p.luck+'</i>':""):'<i class="g2">没做过</i>')+
        '<b class="w'+lv+'"></b></span></button>'; }).join("")+'</div>';
    if(!kshow.length) h+='<div class="qz-sub" style="padding:8px 2px">没有匹配的知识点</div>';
    h+='</div>';
  }
  /* ③ 范围 */
  h+='<div class="qz-sec"><div class="qz-lb">③ 范围</div><div class="qz-row">'+
     ["全部","未做","做错过","书上错的","问过问题","模糊","原书标记"].map(v=>'<button class="qz-chip'+(qz.scope===v?" on":"")+'" data-scope="'+v+'">'+v+'</button>').join("")+'</div></div>';
  /* ③ 出题方式 */

  h+='<div class="qz-sec"><div class="qz-lb">④ 出多少题</div><div class="qz-row">'+
     takes.map(([k,n])=>'<button class="qz-chip'+(qz.take===k?" on":"")+'" data-take="'+k+'">'+n+'</button>').join("")+'</div>';
  if(qz.take!=="all"){
    h+='<div class="qz-row" style="margin-top:10px">'+QZ_SECS.map(k=>
      '<span class="qz-num"><i>'+(QZ_SECNAME[k]||k)+'</i><input type="number" min="0" max="300" value="'+(qz.nums[k]||0)+'" data-num="'+esc(k)+'"'+(qz.take==="real"?" disabled":"")+'><em>题</em></span>').join("")+'</div>'; }
  h+='<div class="qz-plan">'+QZ_SECS.map(k=>{
      const short=avail[k]<((qz.take==="all")?0:(+qz.nums[k]||0));
      return '<span'+(short?' class="warn"':'')+'>'+(QZ_SECNAME[k]||k)+' <b>'+plan[k]+'</b>'+(short?' <em>（库里只有 '+avail[k]+' 题）</em>':'')+'</span>'; }).join("")+
     '<span class="qz-total">合计 <b>'+total+'</b> 题 · 满分 <b>'+pts+'</b> 分</span></div></div>';
  /* ④ 模式 */
  h+='<div class="qz-sec"><div class="qz-lb">⑤ 模式</div><div class="qz-row">'+
     '<button class="qz-chip'+(qz.mode==="practice"?" on":"")+'" data-mode="practice">练习（答完就出解析）</button>'+
     '<button class="qz-chip'+(qz.mode==="exam"?" on":"")+'" data-mode="exam">模拟考试（限时·交卷才判分）</button>'+

     '</div><div class="qz-row" style="margin-top:9px">'+
     '<label class="qz-sw"><input type="checkbox" id="qzHistSw"'+(qz.showHist?" checked":"")+'> 显示以前的做题记录'+
     '<span class="qz-sub">（做过的题会标出上次对错；想当新题重做就关掉）</span></label></div></div>';
  h+='<div class="qz-actions"><button class="qz-btn pri big" id="qzStart"'+(total?"":" disabled")+'>开始（'+total+' 题）</button></div>';

  main.querySelectorAll("[data-subj]").forEach(b=>b.onclick=()=>{

  main.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.star; if(qz.stars[k]) delete qz.stars[k]; else qz.stars[k]=true; render(); });
  main.querySelectorAll("[data-kp]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.kp; if(qz.kps[k]) delete qz.kps[k]; else qz.kps[k]=true; render(); });
  main.querySelectorAll("[data-kpg]").forEach(b=>b.onclick=()=>{

    qzPoints().forEach(p=>{ if(!on||qz.kpg[p.grp]) ok[p.id]=1; });   /* 摘掉不在大类里的已选知识点 */

  const gclr=main.querySelector("#qzGClr"); if(gclr) gclr.onclick=()=>{ qz.kpg={}; render(); };
  main.querySelectorAll("[data-ksort]").forEach(b=>b.onclick=()=>{ qz.kpSort=b.dataset.ksort; render(); });
  const kc=main.querySelector("#qzKpClr"); if(kc) kc.onclick=()=>{ qz.kps={}; render(); };
  const kqi=main.querySelector("#qzKpQ");
  if(kqi){ let kt=null; kqi.oninput=()=>{ clearTimeout(kt); kt=setTimeout(()=>{ qz.kpQ=kqi.value; render();
    const el=document.getElementById("qzKpQ"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },260); }; }
  main.querySelectorAll("[data-scope]").forEach(b=>b.onclick=()=>{ qz.scope=b.dataset.scope; render(); });
  main.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{
    qz.take=b.dataset.take; if(qz.take==="real") qz.nums=Object.assign({},QZ_REAL); render(); });
  main.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ qz.mode=b.dataset.mode; render(); });
  main.querySelectorAll("[data-num]").forEach(inp=>inp.onchange=e=>{ qz.nums[inp.dataset.num]=Math.max(0,+e.target.value||0); render(); });
  const mi=main.querySelector("#qzMins"); if(mi) mi.onchange=e=>{ qz.mins=Math.max(5,+e.target.value||60); };
  const hs=main.querySelector("#qzHistSw"); if(hs) hs.onchange=e=>{ qz.showHist=e.target.checked; };
  main.querySelector("#qzStart").onclick=()=>{

    const st=qzState(); st.paper=p;
    st.last={pick:Object.assign({},qz.pick),kps:Object.assign({},qz.kps),orgs:Object.assign({},qz.orgs),stars:Object.assign({},qz.stars),scope:qz.scope,nums:Object.assign({},qz.nums),take:qz.take,mode:qz.mode,mins:qz.mins,showHist:qz.showHist};

/* ---------- 机考界面 ---------- */
function qzFmtTime(ms){ if(ms<0) ms=0; const s=Math.floor(ms/1000);
  return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function qzUsed(p){ return (p.usedMs||0)+(p.resumeAt?Date.now()-p.resumeAt:0); }
function qzPause(){ const p=qzPaper(); if(!p||p.submitted) return;
  p.usedMs=qzUsed(p); p.resumeAt=null;
  if(qzTimer){ clearInterval(qzTimer); qzTimer=null; } }
function qzResume(){ const p=qzPaper(); if(!p||p.submitted) return; if(!p.resumeAt) p.resumeAt=Date.now(); }
function qzLeft(p){ return p.mins*60000-qzUsed(p); }
function qzRun(main){
  const p=qzPaper(), qs=qzItems();
  if(!p||!qs.length){ qz.view="home"; render(); return; }
  qzResume();
  if(qz.cur>=qs.length) qz.cur=0;
  const q=qs[qz.cur], key=q.src+"|"+q.id, pick=p.picks[key]||"", marked=!!p.marks[key];
  const exam=(p.mode==="exam"), answered=!!pick;
  /* 按题型分节，卷内连续编号 */
  const groups=[]; let n=0;
  QZ_SECS.forEach(sec=>{ const list=[];
    qs.forEach((x,i)=>{ if(x.sec===sec) list.push({i:i,no:0}); });
    if(list.length) groups.push({sec:sec,list:list}); });
  groups.forEach(g=>g.list.forEach(it=>{ it.no=++n; }));
  const noOf={}; groups.forEach(g=>g.list.forEach(it=>{ noOf[it.i]=it.no; }));
  const curSec=q.sec, curNo=noOf[qz.cur];

  let h='<div class="qz-exam">';
  /* 顶栏：返回 / 考试名 / 计时 / 交卷 */
  const doneN=Object.keys(p.picks).filter(k=>k.indexOf("_tmp")!==0).length;
  h+='<div class="qz-top"><div class="qz-tl"><button class="qz-btn sm" id="qzExit">‹ 返回</button>'+
     '<b>综合测试</b><span class="qz-tag">'+QZ_MODE[p.mode]+'</span></div>'+
     '<div class="qz-tr"><span class="qz-done">已完成 '+doneN+'/'+qs.length+' 题</span>'+
     (exam?'<span class="qz-clock" id="qzClock">剩余 '+qzFmtTime(qzLeft(p))+'</span>':"")+
     '<button class="qz-btn sm only-narrow" id="qzCardBtn">答题卡</button></div></div>';
  h+='<div class="qz-body">';
  /* 左：答题卡（按题型分组） */
  h+='<div class="qz-side'+(qz.cardOpen?" open":"")+'"><div class="qz-slb">答题卡</div><div class="qz-sheet-wrap">';
  groups.forEach(g=>{
    const dn=g.list.filter(it=>p.picks[qs[it.i].src+"|"+qs[it.i].id]).length;
    h+='<div class="qz-sgrp"><div class="qz-sgh">'+esc(QZ_SECNAME[g.sec]||g.sec)+' <b>'+g.list.length+'</b> 题<span>'+dn+'/'+g.list.length+'</span></div><div class="qz-sheet">';
    g.list.forEach(it=>{ const x=qs[it.i], k2=x.src+"|"+x.id; let c="qz-cell";
      const tmp=p.picks["_tmp"+k2];
      if(p.picks[k2]) c+=" done";
      else if(tmp) c+=" part";                       /* 多选选了一半 = 部分完成 */
      else if(qz.showHist){ const h0=qzHist(x);      /* 以前做过：做错过=淡红，做对=淡绿 */
        if(h0) c+=(h0.last==="错"?" hb":" hg"); }
      if(qzAsked(x)) c+=" nt";        /* 问过问题：左下角紫点 */
      if(p.marks[k2]) c+=" mk"; if(it.i===qz.cur) c+=" cur";
      if(!exam&&p.picks[k2]) c+=(p.picks[k2]===x.answer)?" right":" wrong";
      const hi=qz.showHist?qzHist(x):null;
      h+='<button class="'+c+'" data-i="'+it.i+'" title="'+(hi?("以前做过 "+hi.n+" 次，上次"+hi.last+(hi.w?"（累计错 "+hi.w+" 次）":"")):"")+'">'+it.no+'</button>'; });
    h+='</div></div>'; });
  h+='</div><div class="qz-legend">'+
     '<span><i class="cur"></i>当前</span><span><i></i>未完成</span>'+
     '<span><i class="part"></i>部分完成</span><span><i class="done"></i>已完成</span>'+
     '<span><i class="mk"></i>标记</span><span><i class="nt"></i>问过问题</span>'+
     (qz.showHist?'<span><i class="hg"></i>以前做对</span><span><i class="hb"></i>以前做错</span>':"")+'</div>'+
     '<button class="qz-btn pri qz-submit" id="qzSubmit">交卷</button></div>';
  /* 右：题目 */
  h+='<div class="qz-main"><div class="qz-qhd">'+
     '<span class="qz-qsec">'+esc(QZ_SECNAME[curSec]||curSec)+'</span><span class="qz-qno">第 '+curNo+' 题</span>'+
     '<span class="qz-qpt">'+QZ_PTS[curSec]+' 分</span>'+
     '<span class="qz-qsrc">'+esc(q.subject)+' · 原书第'+esc(String(q.page||"-"))+'页</span>'+
     (marked?'<span class="qz-qmark">▲ 已标记</span>':"")+'</div>';
  /* 以前做过的话，把历史亮出来（组卷时可关掉） */
  if(qz.showHist&&!answered){ const hi=qzHist(q);
    if(hi) h+='<div class="qz-hist-tip'+(hi.last==="错"?" bad":" good")+'">'+
      (hi.book?'<span class="qz-src">📕 书上第一遍'+(hi.book==="R"?"·红笔":"")+'做错过</span>':"")+
      (hi.book
        ? ' · '+(hi.sysN ? '系统里又做过 '+hi.sysN+' 次'+(hi.sysW?'，还错了 '+hi.sysW+' 次':'，都做对了') : '系统里还没做过')
        : '以前做过 '+hi.n+' 次 · 上次<b>'+hi.last+'</b>')+
      ((hi.book?hi.sysW:hi.w)?' · 累计错 '+(hi.book?hi.sysW:hi.w)+' 次':"")+(hi.mastered?' · <span class="g">已掌握</span>':"")+
      (hi.fuzzy?' · <span class="o">标过模糊</span>':"")+
      (qzNoteGet(q)?' · 有备注':"")+'</div>'; }
  h+='<div class="qz-stem">'+esc(q.stem)+'</div>';
  const keys=(q.type==="tf")?["√","×"]:Object.keys(q.options||{});
  h+='<div class="qz-opts'+(q.type==="tf"?" tf":"")+'">';
  keys.forEach(k=>{ const on=pick.indexOf(k)>=0;
    let cls="qz-opt"+(on?" on":"");
    if(!exam&&answered){ const inA=q.answer.indexOf(k)>=0;
      if(inA) cls+=" hit"; else if(on) cls+=" miss"; }
    h+='<button class="'+cls+'" data-k="'+esc(k)+'"><span class="qz-ok">'+esc(k)+'</span><span class="qz-ot">'+
       (q.type==="tf"?(k==="√"?"正确":"错误"):esc(q.options[k]))+'</span></button>'; });
  h+='</div>';
  if(q.sec==="多选题"&&!(!exam&&answered)) h+='<div class="qz-hintbar">多选题：选完后点「确认作答」</div><button class="qz-btn pri" id="qzOk">确认作答</button>';
  if(!exam&&answered){
    const ok=(pick===q.answer);
    h+='<div class="qz-vd '+(ok?"ok":"no")+'">'+(ok?"✅ 回答正确":'❌ 回答错误：你选了「'+esc(pick)+'」，正确答案「<b>'+esc(q.answer)+'</b>」')+'</div>'+
       '<div id="qzExpWrap"><div class="qz-exp" id="qzExp"><b>【答案】'+esc(q.answer)+'</b><br>'+qzExpHtml(q)+'</div>'+
       '<div class="qz-hlbar" id="qzHlBar" style="display:none"><button class="qz-btn sm pri" id="qzHlDo">🖍 标红选中的内容</button><span class="qz-sub">解析和解答里的文字都能标 · 汇总在首页「🖍 标注」</span></div>'+
       qzQaCard(q,true)+'</div>';
    const kn=qzKpNames(q);
    if(kn.length) h+='<div class="qz-kpline"><span>'+(q.src==="sj"?"所属章节":"知识点")+'</span>'+
      kn.map(n=>'<b>'+esc(n)+'</b>').join("")+'</div>';
    h+='<div id="qzFz"></div>';
  }
  h+='<div class="qz-nav"><button class="qz-btn'+(marked?" on":"")+'" id="qzMark">🚩 '+(marked?"取消标记":"标记本题")+'</button>'+
     '<span class="qz-navsp"></span>'+
     '<button class="qz-btn" id="qzPrev">上一页</button>'+
     '<button class="qz-btn pri" id="qzNext">下一页</button></div>';
  h+='</div></div></div>';
  main.innerHTML=h;
  qzShownCur=qz.cur;   /* 记下这次渲染出来的题号，供 keepSheet 判断有没有换题 */

  /* 换题时答题卡别自己跳回最前：先原样恢复滚动位置，只有当前题滚出视野才最小幅度带回来。
     滚动的是 .qz-side（overflow-y:auto），不是里面的 .qz-sheet-wrap。 */
  const keepSheet=(fn)=>{
    const s0=main.querySelector(".qz-side"), top=s0?s0.scrollTop:0, was=qzShownCur;
    fn();
    const s=document.querySelector(".qz-side"); if(!s) return;
    s.scrollTop=top;
    if(qz.cur===was) return;          /* 只是答题/标记，没换题 —— 原样不动 */
    const cur=s.querySelector(".qz-cell.cur"); if(!cur) return;
    const cb=cur.getBoundingClientRect(), sb=s.getBoundingClientRect();
    if(cb.top<sb.top) s.scrollTop-=(sb.top-cb.top)+8;
    else if(cb.bottom>sb.bottom) s.scrollTop+=(cb.bottom-sb.bottom)+8;
  };
  const rerender=()=>{ keepSheet(()=>{ p.cur=qz.cur; save(); render(); }); };
  main.querySelectorAll(".qz-opt").forEach(b=>b.onclick=()=>{
    if(!exam&&answered) return;
    const k=b.dataset.k;
    if(q.sec==="多选题"){ let cur=(p.picks["_tmp"+key]||"").split("").filter(Boolean);
      const i=cur.indexOf(k); if(i>=0) cur.splice(i,1); else cur.push(k);
      p.picks["_tmp"+key]=cur.sort().join("");
      b.classList.toggle("on"); return; }
    p.picks[key]=k;
    if(!exam) qzGrade(q,k);
    rerender(); });
  const okb=main.querySelector("#qzOk");
  if(okb) okb.onclick=()=>{ const v=p.picks["_tmp"+key]||"";
    if(!v){ toast("还没选"); return; }
    p.picks[key]=v; delete p.picks["_tmp"+key];
    if(!exam) qzGrade(q,v);
    rerender(); };
  main.querySelector("#qzPrev").onclick=()=>{ if(qz.cur>0){ qz.cur--; rerender(); } };
  main.querySelector("#qzNext").onclick=()=>{ if(qz.cur<qs.length-1){ qz.cur++; rerender(); } else toast("已是最后一题"); };
  const _hd=main.querySelector("#qzHlDo");
  if(_hd) _hd.onpointerdown=(e)=>{ e.preventDefault(); if(qzHlTxt) qzHlAdd(q,qzHlTxt); };
  const _ex=main.querySelector("#qzExpWrap")||main.querySelector("#qzExp");
  if(_ex) _ex.onclick=(e)=>{ const sp=e.target.closest(".qz-hl");
    if(sp&&confirm("取消这条标红？")) qzHlRemove(sp.dataset.hl); };
  const _qd=main.querySelector("#qzQaDel"); if(_qd) _qd.onclick=()=>qzQaRemove(q);
  main.querySelector("#qzMark").onclick=()=>{ if(p.marks[key]) delete p.marks[key]; else p.marks[key]=1; rerender(); };
  const cb=main.querySelector("#qzCardBtn"); if(cb) cb.onclick=()=>{ qz.cardOpen=!qz.cardOpen; keepSheet(render); };
  main.querySelectorAll(".qz-cell").forEach(c=>c.onclick=()=>{ qz.cur=+c.dataset.i; qz.cardOpen=false; rerender(); });
  main.querySelector("#qzSubmit").onclick=()=>qzSubmit(qs);
  /* 中途返回：进度和计时都保留，首页可「继续」 */
  main.querySelector("#qzExit").onclick=()=>{ p.cur=qz.cur; qzPause(); qz.view="home"; save(); render(); };
  const fz=main.querySelector("#qzFz");
  /* 两者各占一个子容器：qzFuzzyBar 的 draw() 会重写自己的宿主，与备注框共用宿主会把备注框冲掉（2026-08-23 修） */
  if(fz){ const fzHost=document.createElement("div"), ntHost=document.createElement("div");
    fz.appendChild(fzHost); fz.appendChild(ntHost); qzFuzzyBar(fzHost,q); qzNoteBox(ntHost,q); }
  if(qzTimer){ clearInterval(qzTimer); qzTimer=null; }
  if(exam){ qzTimer=setInterval(()=>{ const el=document.getElementById("qzClock"); if(!el){ clearInterval(qzTimer); qzTimer=null; return; }
    const left=qzLeft(p); el.textContent="剩余 "+qzFmtTime(left);
    if(left<=0){ clearInterval(qzTimer); qzTimer=null; toast("时间到，自动交卷"); qzSubmit(qzItems()); } },1000); }
}

/* 答完题后的「把握程度」条：答对了也能标模糊 + 逐个标不确定的选项。
   法律题写 lawState(fuzzy/fzo)，管理题写 mgState(qUns/unsure)，两边的错题本规则各自沿用。 */
function qzFuzzyBar(host,q){
  const read=()=>{ if(q.src==="law"){ const x=lawQEnsure(q.id); return {on:!!x.fuzzy,opt:x.fzo||[],n:x.fz||0}; }
                   if(q.src==="sj"){ const x=sjQEnsure(q.id); return {on:!!x.fuzzy,opt:x.fzo||[],n:x.fz||0}; }
                   if(q.src==="mz"){ const x=mzQEnsure(q.id); return {on:!!x.fuzzy,opt:x.fzo||[],n:x.fz||0}; }
                   const x=mgQEnsure(q.id); return {on:!!x.qUns,opt:x.unsure||[],n:0}; };
  const setAll=on=>{ if(q.src==="law") lawSetFuzzy(q.id,on);
                     else if(q.src==="sj") sjSetFuzzy(q.id,on);
                     else if(q.src==="mz") mzSetFuzzy(q.id,on);
                     else { const x=mgQEnsure(q.id); x.qUns=!!on; if(!on) x.unsure=[]; save(); } };
  const setOpt=k=>{ if(q.src==="law") lawToggleOpt(q.id,k);
                    else if(q.src==="sj") sjToggleOpt(q.id,k);
                    else if(q.src==="mz") mzToggleOpt(q.id,k);
                    else { const x=mgQEnsure(q.id); const i=x.unsure.indexOf(k);
                           if(i>=0) x.unsure.splice(i,1); else { x.unsure.push(k); x.qUns=true; } save(); } };
  const draw=()=>{ const s=read(), keys=(q.type==="tf")?["√","×"]:Object.keys(q.options||{});
    host.innerHTML='<div class="qz-fz"><div class="qz-fzrow"><span class="qz-fzlb">把握程度</span>'+
      '<button class="qz-fzbtn'+(s.on?"":" on")+'" data-v="0">✅ 有把握</button>'+
      '<button class="qz-fzbtn'+(s.on?" on fz":"")+'" data-v="1">🤔 模糊</button>'+
      (s.n>1?'<span class="qz-sub">（累计标过 '+s.n+' 次）</span>':"")+'</div>'+
      '<div class="qz-fzrow"><span class="qz-fzlb">不确定的选项</span>'+
      keys.map(k=>'<button class="qz-fzo'+(s.opt.indexOf(k)>=0?" on":"")+'" data-k="'+esc(k)+'">'+esc(k)+'</button>').join("")+
      '<span class="qz-sub">点一下标记，再点取消</span></div></div>';
    host.querySelectorAll(".qz-fzbtn").forEach(b=>b.onclick=()=>{ setAll(b.dataset.v==="1"); draw(); });
    host.querySelectorAll(".qz-fzo").forEach(b=>b.onclick=()=>{ setOpt(b.dataset.k); draw(); }); };
  draw();
}

/* 备注框：写下我的思考 / 不懂的地方，后续整理薄弱点时用 */
function qzNoteBox(host,q){
  const cur=qzNoteGet(q);
  const box=document.createElement("div"); box.className="qz-note";
  box.innerHTML='<div class="qz-nlb">📝 我的备注<span class="qz-sub">（写下你的思考、卡在哪、想问的问题——整理薄弱点时我会看这些）</span></div>'+
    '<textarea class="qz-nta" rows="2" placeholder="例：不理解为什么这里算间接故意，跟过失怎么分？">'+esc(cur)+'</textarea>'+
    '<div class="qz-nfoot"><span class="qz-nsave"></span></div>';
  host.appendChild(box);
  const ta=box.querySelector(".qz-nta"), tip=box.querySelector(".qz-nsave");
  let t=null;
  ta.oninput=()=>{ clearTimeout(t); tip.textContent="输入中…";
    t=setTimeout(()=>{ qzNoteSet(q,ta.value.trim()); tip.textContent="已保存 ✓";
      setTimeout(()=>{ if(tip) tip.textContent=""; },1500); },600); };
  ta.onblur=()=>{ clearTimeout(t); qzNoteSet(q,ta.value.trim()); };
}

function qzSubmit(qs){
  const p=qzPaper(); if(!p) return;
  const un=qs.filter(x=>!p.picks[x.src+"|"+x.id]).length;
  if(un&&!confirm("还有 "+un+" 题没答，确定交卷？")) return;
  if(qzTimer){ clearInterval(qzTimer); qzTimer=null; }
  let right=0;
  qs.forEach(x=>{ const k=x.src+"|"+x.id, pick=p.picks[k];
    if(pick===undefined) return;
    if(p.mode==="exam") { if(qzGrade(x,pick)) right++; }        /* 考试模式交卷时才判分入错题本 */
    else if(pick===x.answer) right++; });
  p.submitted=true; p.endAt=Date.now(); qzPause();
  const full=qzFull(qs), got=qzGot(qs,p);
  p.score={right:right,n:qs.length,pct:qs.length?Math.round(right/qs.length*100):0,unanswered:un,
           pts:qzR1(got),full:qzR1(full),ppct:full?Math.round(got/full*100):0};
  const s=qzState();
  s.exams.push({date:today(),n:qs.length,right:right,pct:p.score.pct,pts:qzR1(got),full:qzR1(full),mode:p.mode});
  if(s.exams.length>60) s.exams=s.exams.slice(-60);
  qz.view="result"; save(); render();
}

/* ---------- 成绩单 ---------- */
function qzResult(main){
  const p=qzPaper(), qs=qzItems();
  if(!p||!p.score){ qz.view="home"; render(); return; }
  const sc=p.score, used=p.endAt&&p.startAt?Math.round((p.endAt-p.startAt)/60000):0;
  let h='<div class="qz-hd"><h2>成绩单</h2><span class="qz-sub">'+QZ_MODE[p.mode]+' · 用时 '+used+' 分钟</span></div>';
  const pp=sc.ppct!=null?sc.ppct:sc.pct;
  h+='<div class="qz-score"><div class="qz-big '+(pp>=80?"g":(pp>=60?"":"r"))+'">'+(sc.pts!=null?sc.pts:sc.right)+'<em>/'+(sc.full!=null?sc.full:sc.n)+' 分</em></div>'+
     '<div class="qz-sinfo">答对 <b>'+sc.right+'</b> / '+sc.n+' 题 · 正确率 '+sc.pct+'%'+
     (sc.unanswered?'　未作答 '+sc.unanswered+' 题':"")+
     '<br><span class="qz-sub">按真题分值计：判断 0.5 · 单选 0.8 · 多选 1.2（多选需全对得分）。真考另有写作 1 题 30 分，本卷不含。</span></div></div>';
  /* 分科目/题型统计 */
  const by={}; qs.forEach(x=>{ const k=x.subject+" · "+x.sec, o=by[k]||(by[k]={n:0,r:0});
    o.n++; if(p.picks[x.src+"|"+x.id]===x.answer) o.r++; });
  h+='<div class="qz-lb">分项</div><div class="qz-stats">'+Object.keys(by).map(k=>{
    const o=by[k], pct=Math.round(o.r/o.n*100);
    return '<div class="qz-srow"><span>'+esc(k)+'</span><div class="qz-bar"><i style="width:'+pct+'%" class="'+(pct>=80?"g":(pct>=60?"":"r"))+'"></i></div><span>'+o.r+"/"+o.n+'</span></div>'; }).join("")+'</div>';
  h+='<div class="qz-lb">逐题回顾（点开看解析）</div><div class="qz-review">';
  qs.forEach((x,i)=>{ const k=x.src+"|"+x.id, pick=p.picks[k]||"", ok=(pick===x.answer);
    h+='<div class="qz-rv'+(pick?(ok?" ok":" no"):" un")+'"><button class="qz-rvh" data-i="'+i+'">'+
       '<span class="qz-rvn">'+(i+1)+'</span><span class="qz-rvs">'+esc(x.stem.slice(0,40))+(x.stem.length>40?"…":"")+'</span>'+
       '<span class="qz-rvr">'+(pick?(ok?"✓":"✗ 你选"+esc(pick)):"未答")+'</span></button>'+
       '<div class="qz-rvb" id="qzrv'+i+'"><b>【答案】'+esc(x.answer)+'</b><br>'+qzExpHtml(x)+qzQaCard(x,false)+
       (qzKpNames(x).length?'<div class="qz-kpline"><span>'+(x.src==="sj"?"所属章节":"知识点")+'</span>'+qzKpNames(x).map(n=>'<b>'+esc(n)+'</b>').join("")+'</div>':"")+
       '</div></div>'; });
  h+='</div>';
  h+='<div class="qz-actions"><button class="qz-btn pri" id="qzAgain">再来一套</button>'+
     '<button class="qz-btn" id="qzWrong">只练这套里的错题</button><button class="qz-btn" id="qzHome">回首页</button></div>';
  main.innerHTML=h;
  main.querySelectorAll(".qz-rvh").forEach(b=>b.onclick=()=>{
    const el=main.querySelector("#qzrv"+b.dataset.i); el.classList.toggle("open"); });
  main.querySelector("#qzAgain").onclick=()=>{ qzState().paper=null; qz.view="build"; save(); render(); };
  main.querySelector("#qzHome").onclick=()=>{ qzState().paper=null; qz.view="home"; save(); render(); };
  main.querySelector("#qzWrong").onclick=()=>{
    const bad=qs.filter(x=>p.picks[x.src+"|"+x.id]!==x.answer);
    if(!bad.length){ toast("这套全对 🎉"); return; }
    const s=qzState();
    s.paper={ id:uid(), mode:"practice", mins:qz.mins, createdAt:new Date().toISOString(), startAt:Date.now(),
              items:bad.map(x=>({src:x.src,id:x.id})), picks:{}, marks:{}, cur:0, submitted:false, score:null };
    qz.cur=0; qz.view="run"; save(); render(); };
}

const WR_TABS=[["p","✍️ 练笔"],["d","📋 文种"],["f","📐 格式"],["t","🧩 模板"],["m","🗂 我的习作"]];
let wr={ view:"home", tab:"p", pid:null, stage:"w", dcat:"法定", open:{}, pairOpen:{} };
let wrTimer=null;

/* ---------- 数据 ---------- */
function wrBank(){ return db.wrBank||null; }
function wrState(){ const s=db.wrState||(db.wrState={drafts:{},done:{},ui:{}});
  if(!s.drafts) s.drafts={}; if(!s.done) s.done={}; if(!s.ui) s.ui={}; return s; }
function wrPapers(){ const b=wrBank(); return (b&&b.papers)||[]; }
function wrPaper(id){ return wrPapers().find(p=>p.id===id)||null; }
function wrDraft(id){ const s=wrState();
  if(!s.drafts[id]) s.drafts[id]={text:"",ms:0,peek:false,savedAt:null,runAt:null};
  return s.drafts[id]; }
function wrDone(id){ const s=wrState(); return s.done[id]||(s.done[id]=[]); }
function wrCount(t){ return String(t==null?"":t).replace(/\s/g,"").length; }
function wrP(t){ return esc(t).replace(/\n/g,"<br>"); }
function wrMs(ms){ if(!ms||ms<0) ms=0; const s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
/* 计时：runAt 存着「本次开始计时的时刻」，离开页面时结算进 ms */
function wrElapsed(d){ return (d.ms||0)+(d.runAt?Date.now()-d.runAt:0); }
function wrStop(){ const s=db.wrState; if(!s||!s.drafts) return;
  Object.keys(s.drafts).forEach(k=>{ const d=s.drafts[k];
    if(d.runAt){ d.ms=(d.ms||0)+(Date.now()-d.runAt); d.runAt=null; } });
  if(wrTimer){ clearInterval(wrTimer); wrTimer=null; } }

/* ---------- 模块入口 ---------- */
function mountWr(main){
  if(!wrBank()){ wrEmpty(main); return; }
  if(wr.view==="write"){ wrWrite(main); return; }
  wrStop();
  let h='<div class="wr-hd"><button class="qz-back" id="wrBack">‹ 刷题</button><h2>公文写作</h2>'+
        '<span class="qz-sub">'+wrPapers().length+' 道练笔 · '+((wrBank().docs||[]).length)+' 个文种</span></div>';
  h+='<div class="wr-tabs">'+WR_TABS.map(t=>'<button class="wr-tab'+(wr.tab===t[0]?" on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>').join("")+'</div>';
  h+='<div id="wrBody"></div>';
  main.innerHTML=h;
  main.querySelector("#wrBack").onclick=()=>go("quiz");
  main.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ wr.tab=b.dataset.t; wrState().ui.tab=b.dataset.t; save(); render(); });
  const body=main.querySelector("#wrBody");
  if(wr.tab==="p") wrList(body);
  else if(wr.tab==="d") wrDocs(body);
  else if(wr.tab==="f") wrFmt(body);
  else if(wr.tab==="t") wrTpl(body);
  else wrMine(body);
}

function wrEmpty(main){
  /* 线上版会自动拉；本地打开的桌面版没有同域文件，直接引导选文件 */
  const online=/^https?:/.test(location.protocol);
  main.innerHTML='<div class="wr-hd"><button class="qz-back" id="wrBack">‹ 刷题</button><h2>公文写作</h2></div>'+
    '<div class="empty">'+(online?'正在载入写作资料…<br><span class="qz-sub">如果一直不出来，点下面的按钮手动载入。</span>'
      :'还没载入写作资料。<br><span class="qz-sub">点下面的按钮，选「计划软件\pwa发布\公文写作.json」。<br>手机上的网页版会自动载入，不用管这一步。</span>')+'</div>'+
    '<div class="qz-actions"><button class="qz-btn pri" id="wrLoad">载入公文写作资料</button></div>';
  main.querySelector("#wrBack").onclick=()=>go("quiz");
  main.querySelector("#wrLoad").onclick=wrImport;
  wrAutoLoad();
}
/* 首次进入自动从同域拉取；失败就留着手动按钮 */
async function wrAutoLoad(){
  if(wr._tried||!/^https?:/.test(location.protocol)) return; wr._tried=true;
  try{ const rs=await fetch("./公文写作.json",{cache:"no-store"}); if(!rs.ok) return;
    const j=await rs.json(); if(!j||!j.papers) return;
    db.wrBank=j; save(); toast("写作资料已载入"); render();
  }catch(e){}
}
function wrImport(){
  const online=/^https?:/.test(location.protocol);
  const h=openModal("载入 / 更新公文写作资料",
    '<p class="lw-hint">载入「公文写作.json」。<b>只写入文种、格式、范文等资料</b>；你写过的草稿和习作不受影响。</p>'+
    (online?'<div class="lw-actions" style="margin-bottom:11px"><button class="lw-go" id="wrNet">📶 从网上载入（手机推荐）</button></div>':"")+
    '<p class="lw-hint">或者自己选文件：</p><input type="file" id="wrFile" accept=".json,application/json">'+
    '<div id="wrMsg" class="lw-hint" style="margin-top:9px"></div>');
  const adopt=(j)=>{ if(!j||!j.papers) throw new Error("不是公文写作资料文件");
    db.wrBank=j; save(); closeModal(); toast("已载入："+j.papers.length+" 道练笔 / "+(j.docs||[]).length+" 个文种"); render(); };
  const net=h.querySelector("#wrNet");
  if(net) net.onclick=async()=>{ const m=h.querySelector("#wrMsg"); m.textContent="下载中…";
    try{ const rs=await fetch("./公文写作.json",{cache:"no-store"});
      if(!rs.ok) throw new Error("HTTP "+rs.status); adopt(await rs.json());
    }catch(err){ m.textContent="服务器上没有这个文件（"+err.message+"）。请用下面的「选择文件」。"; } };
  h.querySelector("#wrFile").onchange=(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
    const m=h.querySelector("#wrMsg"); m.textContent="读取中…"; const rd=new FileReader();
    rd.onload=()=>{ try{ adopt(JSON.parse(rd.result)); }catch(err){ m.textContent="导入失败："+err.message; } };
    rd.readAsText(f); };
}

        '<div class="wr-tt">'+esc(p.name)+'</div>'+

        '<span class="'+(okLen?"g":(n>p.maxWords?"r":""))+'" id="wrCnt">'+n+' 字</span></div></div>';

  h+='<div class="wr-q"><div class="wr-mat">'+wrP(p.material)+'</div>'+
     '<div class="wr-task"><b>【作答要求】</b><br>'+wrP(p.task)+

    h+='<textarea class="wr-ta" id="wrTa" placeholder="在这里作答……（自动保存，中途离开不会丢）">'+esc(d.text)+'</textarea>';

       '<button class="qz-btn pri" id="wrFin">我写完了 · 看提纲和范文</button></div></div>';

    h+='<div class="wr-sec"><b>审题要点</b><ul>'+p.tips.map(t=>"<li>"+esc(t)+"</li>").join("")+'</ul></div>';
    if((p.outline||[]).length) h+='<div class="wr-sec"><b>结构提纲</b>'+p.outline.map(o=>'<div class="wr-ol"><div class="wr-olh">'+esc(o.h)+'</div><ul>'+
       o.pts.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ul></div>').join("")+'</div>';
    const cs=d.checks||[];
    h+='<div class="wr-sec"><b>对照评分（勾掉你做到的）</b><div class="wr-chk">'+
       p.checks.map((c,i)=>'<label class="wr-ck'+(cs[i]?" on":"")+'"><input type="checkbox" data-c="'+i+'"'+(cs[i]?" checked":"")+'>'+
       '<span><b>'+esc(c.t)+'</b><i>'+esc(c.d)+'</i></span></label>').join("")+'</div>'+

      clearTimeout(t); t=setTimeout(()=>{ d.text=v; d.savedAt=new Date().toTimeString().slice(0,5);
        save(); sv.textContent="已保存 "+d.savedAt; },800); };

    main.querySelector("#wrFin").onclick=()=>{ d.text=ta.value; wrStop(); save(); wr.stage="c"; window.scrollTo({top:0}); render(); };
    if(wrTimer) clearInterval(wrTimer);
    wrTimer=setInterval(()=>{ const el=document.getElementById("wrClk"); if(!el){ clearInterval(wrTimer); wrTimer=null; return; }

    main.querySelector("#wrOne").onclick=()=>wrExport(p.id);

        checks:(d.checks||[]).filter(Boolean).length, total:p.checks.length });
      d.text=""; d.ms=0; d.runAt=null; d.checks=[]; d.peek=false; save();
      toast("已存入「我的习作」"); wr.view="home"; wr.tab="m"; render(); };
  }
}

/* 删掉某一篇的第 i 次留档。i 是它在 done[pid] 里的下标——删完后面的自动往前顶，编号跟着重排。 */
function wrDelOne(pid,i){ const a=(wrState().done[pid]||[]);
  if(i<0||i>=a.length) return;
  a.splice(i,1); if(!a.length) delete wrState().done[pid];
  save(); toast("已删除"); render(); }

/* ---------- 我的习作 ---------- */
function wrMine(host){
  const s=wrState(), rows=[];
  Object.keys(s.done).forEach(pid=>{ const p=wrPaper(pid); if(!p) return;
    (s.done[pid]||[]).forEach((r,i)=>rows.push(Object.assign({pid:pid,idx:i,name:p.name,type:p.type},r))); });
  rows.sort((a,b)=>a.date<b.date?1:-1);
  const drafts=Object.keys(s.drafts).filter(k=>wrCount(s.drafts[k].text)>0&&wrPaper(k));
  let h="";
  if(drafts.length){ h+='<div class="wr-lb">还没写完的草稿</div><div class="wr-plist">'+
    drafts.map(k=>{ const p=wrPaper(k), d=s.drafts[k];
      return '<button class="wr-prow" data-p="'+esc(k)+'"><div class="wr-pt">'+esc(p.name)+'</div>'+
      '<div class="wr-pm"><span class="wr-type">'+esc(p.type)+'</span><span>'+wrCount(d.text)+' 字</span>'+
      '<span>用时 '+wrMs(d.ms)+'</span><span class="wr-tg go">接着写</span></div></button>'; }).join("")+'</div>'; }
  if(!rows.length){ h+='<div class="empty">还没有存过习作。<br><span class="qz-sub">写完一篇后点「存入我的习作」，这里会留档，随时能翻出来对比进步。</span></div>'; }
  else{
    /* 按题目分组，同一题的多次留档按保存顺序编号「第 N 次」 */
    const byP={}; rows.forEach(r=>(byP[r.pid]=byP[r.pid]||[]).push(r));
    const pids=Object.keys(byP).sort((a,b)=>{
      const la=byP[a][0], lb=byP[b][0]; return la.date<lb.date?1:-1; });   /* 最近写过的题排前面 */
    h+='<div class="wr-lb">已留档 '+rows.length+' 篇 · '+pids.length+' 道题</div>';
    pids.forEach(pid=>{
      const list=byP[pid].slice().sort((a,b)=>a.idx-b.idx);   /* 组内按保存顺序，第1次在前 */
      const p0=list[0];
      h+='<div class="wr-grp"><div class="wr-gh"><b>'+esc(p0.name)+'</b>'+
        '<span class="wr-type">'+esc(p0.type)+'</span>'+
        '<span class="wr-gn">'+list.length+' 次</span>'+
        '<button class="qz-btn sm" data-again="'+esc(pid)+'">再写一次</button>'+
        '<button class="qz-btn sm" data-pexp="'+esc(pid)+'">📤 导出这道题</button></div>';
      h+='<div class="wr-ml">'+list.map((r,k)=>{
        const prev=k?list[k-1]:null;
        const dw=prev?(r.words-prev.words):0, dc=prev?(r.checks-prev.checks):0;
        return '<div class="wr-mrow"><div class="wr-mh">'+
          '<span class="wr-no">第 '+(k+1)+' 次</span>'+
          '<span class="wr-mm">'+r.date+' · '+r.words+' 字 · 用时 '+wrMs(r.ms)+' · 自评 '+r.checks+'/'+r.total+'</span>'+
          (prev?'<span class="wr-delta">'+(dw>=0?'字数 +'+dw:'字数 '+dw)+'　自评 '+(dc>=0?'+'+dc:''+dc)+'</span>':"")+
          '<button class="wr-del" data-del="'+esc(pid)+'" data-i="'+r.idx+'" title="删除这一次">删除</button>'+
          '</div><div class="wr-mtx">'+wrP(r.text)+'</div></div>'; }).join("")+'</div></div>';
    });
    h+='<div class="qz-actions"><button class="qz-btn pri" id="wrAll">📤 导出全部习作发给 Claude 批改</button></div>';
  }
  host.innerHTML=h;
  host.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ wr.pid=b.dataset.p; wr.stage="w"; wr.view="write"; render(); });
  host.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const pid=b.dataset.del, i=+b.dataset.i, p=wrPaper(pid);
    const a2=(wrState().done[pid]||[]), no=a2.findIndex((x,k)=>k===i)+1;
    if(confirm("删除《"+(p?p.name:pid)+"》的这一次留档？\n\n删掉就找不回来了，后面几次的编号会往前顺延。")) wrDelOne(pid,i); });
  host.querySelectorAll("[data-again]").forEach(b=>b.onclick=()=>{
    wr.pid=b.dataset.again; wr.stage="w"; wr.view="write"; render(); });
  host.querySelectorAll("[data-pexp]").forEach(b=>b.onclick=()=>wrExport(b.dataset.pexp,true));
  const a=host.querySelector("#wrAll"); if(a) a.onclick=()=>wrExport(null);
}

/* ---------- 导出给 Claude 批改 ---------- */
function wrExport(pid,allOfPaper){
  const NL="\n", s=wrState();
  const list=[];
  if(pid&&allOfPaper){   /* 这道题的全部留档，按第 1 次、第 2 次…排 */
    const p=wrPaper(pid);
    (s.done[pid]||[]).forEach((r,k)=>list.push({p:p,text:r.text,words:r.words,ms:r.ms,checks:r.checks,date:r.date,no:k+1}));
  }
  else if(pid){ const p=wrPaper(pid), d=wrDraft(pid);
    list.push({p:p, text:d.text, words:wrCount(d.text), ms:wrElapsed(d),
      checks:(d.checks||[]).filter(Boolean).length, date:today()}); }
  else{ Object.keys(s.done).forEach(k=>{ const p=wrPaper(k); if(!p) return;
      (s.done[k]||[]).forEach(r=>list.push({p:p,text:r.text,words:r.words,ms:r.ms,checks:r.checks,date:r.date})); }); }
  let md="# 公文写作习作 "+today()+NL+NL;
  md+="> 下面是我按题目写的文章。请帮我批改："+NL;
  md+="> 1）先说文种和格式对不对（标题三要素、主送机关、结束语、落款这些）；"+NL;
  md+="> 2）再说结构和内容，哪些采分点没写到、哪些是空话；"+NL;
  md+="> 3）挑出可以直接替换的病句，给出改后的句子；"+NL;
  md+="> 4）最后按 30 分制打个分，并告诉我下一篇该重点练什么。"+NL+NL;
  list.forEach((it,i)=>{
    const p=it.p;
    md+="---"+NL+NL+"## "+(it.no?"第 "+it.no+" 次　":"第 "+(i+1)+" 篇　")+p.name+NL+NL;
    md+="- **文种**："+p.type+"（"+p.cat+"）"+NL;
    md+="- **字数要求**："+p.minWords+"—"+p.maxWords+" 字；我写了 "+it.words+" 字"+NL;
    md+="- **建议时间**："+p.mins+" 分钟；我用了 "+wrMs(it.ms)+NL;
    md+="- **自评**：对照评分表做到 "+it.checks+"/"+p.checks.length+" 条"+NL;
    md+="- **日期**："+it.date+NL+NL;
    md+="### 题目材料"+NL+NL+p.material+NL+NL;
    md+="### 作答要求"+NL+NL+p.task+NL;
    p.req.forEach((r,k)=>{ md+=(k+1)+". "+r+NL; });
    md+=NL+"### 我写的"+NL+NL+(it.text||"（空）")+NL+NL;
  });
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const h=openModal("导出习作",
    '<p class="qz-sub">复制下面全部内容发给 Claude，让它给你逐句批改、打分、指出下一篇该练什么。</p>'+
    '<textarea id="wrTa2" class="lw-ta" readonly>'+esc(md)+'</textarea>'+
    '<div class="qz-actions"><button class="qz-btn pri" id="wrCp">复制全部</button>'+
    '<a class="qz-btn" id="wrDl" download="公文写作习作-'+today()+'.md">下载 .md</a></div>');
  h.querySelector("#wrDl").href=URL.createObjectURL(blob);
  h.querySelector("#wrCp").onclick=()=>{ const ta=h.querySelector("#wrTa2"); ta.select(); ta.setSelectionRange(0,999999);
    try{ document.execCommand("copy"); toast("已复制 ✓"); }catch(e){ toast("请手动长按复制"); } };
}

/* 强制更新程序：注销 Service Worker + 清空静态缓存 + 重载。只动程序文件，不动学习数据。 */
async function forceUpdateApp(){
  if(!confirm("清掉本机缓存的程序文件并重新下载最新版？\n\n你的学习数据（做题记录、错题本、计划）都不受影响。")) return;
  try{
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
      const rs=await navigator.serviceWorker.getRegistrations();
      for(const r of rs){ try{ await r.unregister(); }catch(e){} } }
    if(window.caches){ const ks=await caches.keys(); for(const k of ks){ try{ await caches.delete(k); }catch(e){} } }
  }catch(e){}
  location.replace(location.pathname+"?u="+Date.now());
}

  h+='<div class="card"><h4>📁 本地数据文件夹</h4><div class="desc" id="fsStatus"></div><div class="btnrow"><button class="btn sm" id="setDirPick">绑定数据文件夹</button><button class="btn sm sec" id="setDirRefresh">立即从文件夹刷新</button><button class="btn sm sec" id="setDirDisc">断开</button></div><div class="desc" style="margin-top:10px">数据拆成 <b>多个小 json</b> 写进该文件夹(<code>index.json</code> + <code>state.json</code> + <code>content/</code> + <code>decks/</code>),每次只重写变化的那几个 —— 日常打卡只动 <b>约 50 KB</b>,而不是整包 1.6 MB。<br>绑<b>空文件夹</b>＝把当前数据写进去;绑<b>已有数据的文件夹</b>＝读取它并覆盖本机。需 Chrome / Edge 桌面版。<br><b>断开</b>＝只解除关联,<b>不动文件夹里的文件</b>。测试想清空本机数据时,<b>先断开再清空</b>,否则「清空全部数据」会连文件夹里的数据文件一起删掉。</div></div>';
  }
  h+='<div class="card"><h4>备份(导出 / 导入文本)</h4><div class="btnrow"><button class="btn sm sec" id="setBackup">打开导出 / 导入</button></div>'+(fsSupported()?'':'<div class="desc" style="margin-top:10px">📱 手机换数据请优先用上面的「<b>☁️ 云同步</b>」——配好后全自动,无需手动操作。<br><br>此设备无法绑定本地文件夹(iOS 系统限制,换 Chrome / Edge 也一样,内核都是 Safari)。不用云同步的话:电脑导出一份,用 <b>AirDrop</b>(Mac→iPhone)或<b>微信「文件传输助手」</b>(Windows→iPhone)传来,再「选取文件 → 导入并覆盖」。</div>')+'</div>';
  h+='<div class="card"><h4>模块扩展</h4><div id="modList"></div><button class="btn sm" id="addMod" style="margin-top:8px">＋ 新增模块</button><div class="desc">粘贴一段 JS(函数体),会收到 container 和 api。用与内置相同 id 可覆盖内置;停用/删除则恢复。<b>只粘贴你信任的代码。</b></div></div>';
  h+='<div class="card"><h4>测试 / 维护</h4><div class="frow"><div class="field"><label>手动设“今天”(测试)</label><input type="date" id="setToday" value="'+(db.today||"")+'"></div></div><div class="btnrow"><button class="btn sm sec" id="setTodayAuto">恢复自动识别今天</button><button class="btn sm sec" id="setHist">'+(s.historyUnlocked?"恢复往期锁定":"解锁往期编辑")+'</button><button class="btn sm warn" id="setClear">清空全部数据</button></div></div>';
  main.innerHTML=h; wireSettings(main);
}
function wireSettings(main){
  const s=db.settings,on=(id,ev,fn)=>{ const el=main.querySelector("#"+id); if(el) el[ev]=fn; };
  on("setExamLabel","onchange",async e=>{ s.examLabel=e.target.value; await save(); });
  on("setExamDate","onchange",async e=>{ s.examDate=e.target.value; await save(); });
  on("setExamStart","onchange",async e=>{ s.examStart=e.target.value||null; await save(); });
  main.querySelectorAll('input[name="mm"]').forEach(r=>r.onchange=async()=>{ s.mastery.model=r.value; await save(); render(); });
  on("mSelf","onchange",async e=>{ s.mastery.selfWeight=+e.target.value; await save(); });
  on("mExam","onchange",async e=>{ s.mastery.examWeight=+e.target.value; await save(); });
  on("mAgg","onchange",async e=>{ s.mastery.aggregate=e.target.value; await save(); });
  renderLevels(main);
  on("addLevel","onclick",async()=>{ s.levels.push({key:"lv"+uid().slice(0,4),label:"新档",value:0.5,easeDelta:0,relearn:false}); await save(); render(); });
  on("setStarters","onchange",async e=>{ const a=e.target.value.split(",").map(x=>parseInt(x.trim())).filter(x=>x>0); s.starters=a.length?a:[1,2,4]; await save(); });
  on("setEase0","onchange",async e=>{ s.ease0=+e.target.value||2.3; await save(); });
  on("setCap","onchange",async e=>{ s.reviewCapPerDay=Math.max(1,+e.target.value||3); await save(); });
  on("setCapNew","onchange",async e=>{ s.newCapPerDay=Math.max(1,+e.target.value||2); await save(); });
  { const tp=s.timeplan,tpOn=(id,fn)=>on(id,"onchange",async e=>{ if(e.target.value) fn(e.target.value); await save(); });
    tpOn("tpAmS",v=>tp.periods.am[0]=v); tpOn("tpAmE",v=>tp.periods.am[1]=v); tpOn("tpNoonS",v=>tp.periods.noon[0]=v); tpOn("tpNoonE",v=>tp.periods.noon[1]=v);
    tpOn("tpPmS",v=>tp.periods.pm[0]=v); tpOn("tpPmE",v=>tp.periods.pm[1]=v); tpOn("tpEveS",v=>tp.periods.eve[0]=v); tpOn("tpEveE",v=>tp.periods.eve[1]=v);
    tpOn("tpLunchS",v=>tp.meals.lunch[0]=v); tpOn("tpLunchE",v=>tp.meals.lunch[1]=v); tpOn("tpDinS",v=>tp.meals.dinner[0]=v); tpOn("tpDinE",v=>tp.meals.dinner[1]=v);
    tpOn("tpWinS",v=>tp.window[0]=v); tpOn("tpWinE",v=>tp.window[1]=v);
    on("tpMax","onchange",async e=>{ tp.maxSpanH=Math.max(1,+e.target.value||5); await save(); }); }
  on("setDirPick","onclick",pickDataDir); on("setDirRefresh","onclick",()=>refreshFromDir(false));
  on("csConnect","onclick",async()=>{ const rp=(main.querySelector("#csRepo").value||"").trim(); let tk=(main.querySelector("#csToken").value||"").trim(); if(!tk) tk=CS.token; if(!rp||!tk){ csSetStatus("请填写仓库和令牌",false); return; } await csConnect(tk,rp); const t=main.querySelector("#csToken"); if(t) t.value=""; });
  on("csSyncNow","onclick",()=>csSync({}));
  on("csPeekBtn","onclick",async()=>{ const box=main.querySelector("#csCmp"); if(!box) return;
    box.innerHTML='<div class="cs-hint">读取云端…</div>';
    const p=await csPeek();
    box.innerHTML=p?csCmpHtml(csStats(db),p.stats,db.savedAt,p.savedAt)
                   :'<div class="cs-hint">读不到云端（网络或令牌）。</div>'; });
  on("csDown","onclick",async()=>{ if(!confirm("⬇️ 用云端数据覆盖本机？\n\n本机现在这份会被整个替换掉。拿不准就先点「对比两边」。")) return; await csForcePull(); });
  on("csUp","onclick",async()=>{ if(!confirm("⬆️ 用本机数据覆盖云端？\n\n云端现在那份会被整个替换掉。拿不准就先点「对比两边」。")) return; await csForcePush(); });
  on("csDisc","onclick",()=>{ if(confirm("断开云同步?本机数据保留,只是不再自动上传/下载。")){ csDisconnect(); const t=main.querySelector("#csToken"); if(t) t.value=""; } });
  on("setBackup","onclick",openBackup);
  renderModList(main); on("addMod","onclick",()=>editModule(null));
  on("setToday","onchange",async e=>{ db.today=e.target.value||null; await save(); render(); });
  on("setTodayAuto","onclick",async()=>{ db.today=null; await save(); render(); });
  on("setHist","onclick",async()=>{ s.historyUnlocked=!s.historyUnlocked; await save(); render(); });
  on("setDirDisc","onclick",disconnectDir);
  on("setClear","onclick",async()=>{
    /* 绑着文件夹时清空会连带删掉文件夹里的数据文件 —— 说清楚,并指路"先断开" */
    if(dataDir&&!confirm("⚠️ 当前已绑定数据文件夹「"+(dataDir.name||"")+"」。\n\n清空会把该文件夹里的数据文件一并删除!\n\n若只想清空本机做测试,请先点上方「断开」,再回来清空 —— 那样文件夹分毫不动。\n\n仍要继续吗?")) return;
    if(confirm("确定清空全部数据?不可撤销,建议先导出备份。")){ db=blankDb(); await save(); state.view="home"; state.selDate=null; render(); } });
  updateFs();
}
function renderLevels(main){
  const body=main.querySelector("#lvBody"); if(!body) return; const s=db.settings;
  body.innerHTML=s.levels.map((l,i)=>'<tr><td><input type="text" data-lf="label" data-i="'+i+'" value="'+esc(l.label)+'"></td><td><input type="number" class="n" step="0.05" data-lf="value" data-i="'+i+'" value="'+l.value+'"></td><td><input type="number" class="n" step="0.05" data-lf="easeDelta" data-i="'+i+'" value="'+l.easeDelta+'"></td><td style="text-align:center"><input type="checkbox" data-lf="relearn" data-i="'+i+'" '+(l.relearn?"checked":"")+'></td><td>'+(s.levels.length>2?'<button class="gx" data-ld="'+i+'" style="border:none;background:none;color:var(--text3);font-size:14px">🗑</button>':'')+'</td></tr>').join("");
  body.querySelectorAll("[data-lf]").forEach(el=>{ el.onchange=async()=>{ const i=+el.dataset.i,f=el.dataset.lf,v=el.type==="checkbox"?el.checked:(f==="label"?el.value:+el.value); s.levels[i][f]=v; await save(); }; });
  body.querySelectorAll("button[data-ld]").forEach(b=>b.onclick=async()=>{ s.levels.splice(+b.dataset.ld,1); await save(); render(); });
}
function renderModList(main){
  const host=main.querySelector("#modList"); if(!host) return;
  if(!db.userModules.length){ host.innerHTML='<div class="empty">还没有扩展模块。</div>'; return; }
  host.innerHTML=db.userModules.map(um=>'<div class="crow"><div class="ct"><div style="font-weight:600">'+esc(um.name)+'</div><div class="cs">id: '+esc(um.id)+(BUILTIN_MODULES.some(b=>b.id===um.id)?" · 覆盖内置":"")+'</div></div><div class="gacts"><button data-mt="'+um.id+'">'+(um.enabled?"⏸":"▶")+'</button><button data-me="'+um.id+'">✎</button><button data-md="'+um.id+'">🗑</button></div></div>').join("");
  host.querySelectorAll("button[data-mt]").forEach(b=>b.onclick=async()=>{ const um=db.userModules.find(x=>x.id===b.dataset.mt); um.enabled=!um.enabled; await save(); render(); });
  host.querySelectorAll("button[data-me]").forEach(b=>b.onclick=()=>editModule(b.dataset.me));
  host.querySelectorAll("button[data-md]").forEach(b=>b.onclick=async()=>{ if(!confirm("删除该模块?")) return; db.userModules=db.userModules.filter(x=>x.id!==b.dataset.md); await save(); render(); });
}
function editModule(id){
  const tip="// container: 要写入的元素\\n// api: api.db / api.save() / api.render() / api.engine.* / api.content.* / api.courses.* / api.esc / api.fmtLong / api.addDays / api.today() ...\\ncontainer.innerHTML = '<h2 class=\\\\'mod-h\\\\'>我的模块</h2><p>Hello</p>';";
  const um=id?db.userModules.find(x=>x.id===id):{ id:"",name:"",code:tip,enabled:true };
  const body=openModal('<div class="d">'+(id?"编辑模块":"新增模块")+'</div>',
    '<div class="frow"><div class="field"><label>名称(标签页)</label><input type="text" id="emName" value="'+esc(um.name)+'"></div><div class="field"><label>id(同内置 id 可覆盖)</label><input type="text" id="emId" value="'+esc(um.id)+'" placeholder="如 stats / 或 home"></div></div><div class="field"><label>代码(JS 函数体)</label><textarea class="code" id="emCode">'+esc(um.code)+'</textarea></div><button class="btn" id="emSave">保存并启用</button>');
  body.querySelector("#emSave").onclick=async()=>{ const name=body.querySelector("#emName").value.trim(),mid=body.querySelector("#emId").value.trim()||("m"+uid().slice(0,5)),code=body.querySelector("#emCode").value;
    if(!name){ toast("请填名称"); return; } try{ new Function("container","api",code); }catch(err){ toast("代码有语法错误："+err.message); return; }
    if(id){ const u=db.userModules.find(x=>x.id===id); u.name=name; u.id=mid; u.code=code; } else db.userModules.push({ id:mid,name,code,enabled:true });
    await save(); closeModal(); render(); toast("已保存模块 ✓"); };
}

/* ===== 12. 导出 / 导入 + 初始化 ===== */
function openBackup(){
  const data=JSON.stringify(db,null,2);
  const fmtTs=t=>t?new Date(t).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"未记录";
  const body=openModal('<div class="d">导出 / 导入数据</div>',
    '<div class="seclab">导出</div><div class="desc" style="margin-bottom:8px">本机数据最后修改：'+fmtTs(db.savedAt)+'</div><textarea readonly id="expArea" style="min-height:120px;font-family:ui-monospace,monospace;font-size:11px">'+esc(data)+'</textarea><div class="btnrow"><button class="btn sm" id="bkShare">分享 / 存到文件…</button><button class="btn sm" id="bkCopy">复制</button><button class="btn sm sec" id="bkDown">下载备份文件</button></div><div class="seclab">导入(覆盖全部)</div><textarea id="impArea" placeholder="粘贴之前导出的 JSON…" style="min-height:90px;font-family:ui-monospace,monospace;font-size:11px"></textarea><input type="file" id="impFile" accept="application/json,.json" style="margin-top:8px;font-size:12px"><div class="btnrow"><button class="btn sm warn" id="bkImport">导入并覆盖</button></div><div class="desc" id="bkStat"></div>');
  (function(){ const sb=body.querySelector("#bkShare"); let ok=false; /* iOS/安卓:直接调系统分享面板存进 OneDrive/文件 */
    try{ ok=!!(navigator.canShare&&navigator.canShare({files:[new File(["{}"],"t.json",{type:"application/json"})]})); }catch(e){}
    if(!ok){ sb.style.display="none"; return; }
    sb.onclick=async()=>{ const n=new Date(),fn="study-data-"+ymd(n).replace(/-/g,"")+"-"+pad(n.getHours())+pad(n.getMinutes())+".json";
      try{ await navigator.share({files:[new File([data],fn,{type:"application/json"})],title:"Study Hub 数据备份"}); markBackedUp(); toast("已分享 ✓"); }
      catch(e){ if(!e||e.name!=="AbortError") toast("分享失败,请用「下载备份文件」"); } }; })();
  body.querySelector("#bkCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(data); markBackedUp(); toast("已复制 ✓"); }catch(e){ const ta=body.querySelector("#expArea"); ta.select(); document.execCommand("copy"); markBackedUp(); toast("已复制 ✓"); } };
  body.querySelector("#bkDown").onclick=()=>{ const blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url; a.download="study-data-backup.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); markBackedUp(); toast("已下载"); };
  body.querySelector("#impFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ body.querySelector("#impArea").value=rd.result; }; rd.readAsText(f); };
  body.querySelector("#bkImport").onclick=async()=>{ const raw=body.querySelector("#impArea").value.trim(),st=body.querySelector("#bkStat"); let o; try{ o=JSON.parse(raw); }catch(e){ st.textContent="解析失败：不是有效 JSON。"; return; }
    if(o.savedAt&&db.savedAt&&o.savedAt<db.savedAt&&!confirm("⚠ 要导入的数据("+fmtTs(o.savedAt)+")比本机("+fmtTs(db.savedAt)+")更旧!\n继续会用旧数据覆盖掉新进度。仍要导入吗?")) return;
    if(!confirm("导入会覆盖当前全部数据,确定?")) return; db=normalizeDb(o); await save(); closeModal(); state.view="home"; state.selDate=null; render(); toast("导入成功 ✓"); };
}
function markBackedUp(){ try{ localStorage.setItem("sh-last-backup",String(Date.now())); }catch(e){} }
function downloadBackup(){ const data=JSON.stringify(db,null,2); const blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url; a.download="study-data-backup.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); markBackedUp(); }
async function saveNow(){ const btn=document.getElementById("btnSaveNow"); if(btn){ btn.disabled=true; btn.textContent="保存中…"; }
  await save();
  if(dataDir && !needReconnect){ toast("✅ 已保存到文件夹："+(dataDir.name||"study-data")+"/"); }
  else if(dataDir && needReconnect){ toast("⚠ 数据文件夹需重新授权，请在弹窗中允许…"); await reconnectDir(); if(dataDir && !needReconnect){ await save(); toast("✅ 已恢复授权并保存到文件夹"); } else { downloadBackup(); toast("仍未授权，已为你下载一份备份文件"); } }
  else { downloadBackup(); toast("未绑定数据文件夹，已下载备份（建议到 设置→本地数据文件夹 绑定一次，之后自动写盘）"); }
  if(btn){ btn.disabled=false; btn.textContent="💾 立即保存"; } }
document.getElementById("mClose").onclick=closeModal;
document.getElementById("scrim").onclick=e=>{ if(e.target.id==="scrim") closeModal(); };
document.getElementById("reconnectBtn").onclick=reconnectDir;
const _bsn=document.getElementById("btnSaveNow"); if(_bsn) _bsn.onclick=saveNow;
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); hideSelbar(); } });
document.addEventListener("mousedown",e=>{ if(!e.target.closest("#selbar")&&!e.target.closest(".selwrap")) hideSelbar(); });
window.addEventListener("scroll",hideSelbar,true);
window.addEventListener("focus",maybeAutoRefresh);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) maybeAutoRefresh(); });
setInterval(()=>{ if(state.view==="home" && !document.getElementById("scrim").classList.contains("on")) render(); },60000);
(async function init(){ csLoadCfg(); await load(); ensureStamp(); render(); updateFs(); await autoImportOnBoot(); csSync({}); })();

/* ===== 13. PWA:离线缓存 + 备份提醒 ===== */
if("serviceWorker" in navigator && (location.protocol==="https:"||["localhost","127.0.0.1"].includes(location.hostname))){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
(function backupReminder(){ /* 没有任何自动同步的环境(如 iPhone 且未配云同步):提醒定期导出备份 */
  if(fsSupported()||csConfigured()||!hasLS()) return;
  try{ const last=+localStorage.getItem("sh-last-backup")||0;
    if(!last){ localStorage.setItem("sh-last-backup",String(Date.now())); return; }
    const days=Math.floor((Date.now()-last)/86400000);
    if(days>=7) setTimeout(()=>toast("📤 已 "+days+" 天未备份,建议到 设置 → 导出/导入 分享一份到 OneDrive",6000),1600);
  }catch(e){}
})();
</script>
