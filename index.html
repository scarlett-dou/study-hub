<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Hub</title>
<!-- PWA:清单 + iOS 主屏幕支持 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Hub">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
  :root{
    --bg:#f2f2f7; --bg2:#ffffff; --card:#ffffff;
    --text:#1c1c1e; --text2:rgba(60,60,67,.6); --text3:rgba(60,60,67,.3);
    --sep:rgba(60,60,67,.16); --sep2:rgba(60,60,67,.29);
    --tint:#007aff; --tint-soft:#e9f0ff;
    --red:#ff3b30; --green:#34c759; --orange:#ff9500; --gray:#8e8e93;
    --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
    --r:12px; --r-sm:9px; --r-lg:16px;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.03);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000000; --bg2:#1c1c1e; --card:#1c1c1e; --text:#ffffff; --text2:rgba(235,235,245,.6); --text3:rgba(235,235,245,.3);
      --sep:rgba(84,84,88,.5); --sep2:rgba(84,84,88,.65); --tint:#0a84ff; --tint-soft:#0a2647;
      --red:#ff453a; --green:#30d158; --orange:#ff9f0a; --gray:#98989d; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
      --shadow:0 1px 3px rgba(0,0,0,.4); }
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--text);background:var(--bg);padding:22px 16px 60px;min-height:100vh;font-size:15px;line-height:1.45}
  .wrap{max-width:1040px;margin:0 auto}
  button{font-family:inherit;cursor:pointer}
  h1,h2,h3,h4{font-weight:600;margin:0}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .nav{display:flex;gap:6px;background:var(--fill);padding:3px;border-radius:11px}
  .nav button{border:none;background:transparent;border-radius:8px;padding:7px 15px;font-size:14px;font-weight:500;color:var(--text);transition:.18s}
  .nav button.sel{background:var(--bg2);box-shadow:var(--shadow);font-weight:600}

  .countdown{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .countdown .big{font-size:clamp(40px,8vw,60px);font-weight:700;letter-spacing:-.03em;line-height:.95;color:var(--tint);font-variant-numeric:tabular-nums}
  .countdown .big small{font-size:15px;font-weight:500;color:var(--text2);margin-left:7px}
  .countdown .meta{flex:1;min-width:200px}
  .countdown .meta .lab{font-size:13px;color:var(--text2)}
  .countdown .meta .ttl{font-size:18px;font-weight:600;margin:1px 0 9px}
  .pbar{height:8px;border-radius:5px;background:var(--fill2);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--tint);border-radius:5px}
  .countdown .meta .pn{font-size:12px;color:var(--text2);margin-top:5px}
  .countdown.nodate .big{display:none}

  .cal{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
  .calleft{display:flex;flex-direction:column;gap:16px;min-width:0}
  @media(max-width:780px){.cal{grid-template-columns:1fr}}
  .panel{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head .mo{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .cal-head .navb{display:flex;gap:4px}
  .cal-head button{border:none;background:var(--fill);color:var(--tint);width:30px;height:30px;border-radius:8px;font-size:16px;display:flex;align-items:center;justify-content:center}
  .cal-head button:hover{background:var(--fill2)}
  .cal-head .today-btn{width:auto;padding:0 12px;font-size:13px;font-weight:600}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-wd{text-align:center;font-size:11px;font-weight:600;color:var(--text2);padding:2px 0 6px}
  .cal-wd.we{color:var(--text3)}
  .cell{position:relative;min-height:52px;border-radius:9px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.12s;border:1px solid transparent}
  .cell.fill{cursor:pointer}
  .cell.fill:hover{background:var(--fill)}
  .cell.sel{background:var(--tint-soft)}
  .cell .dn{font-size:15px;font-weight:500;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;line-height:1}
  .cell.today .dn{background:var(--red);color:#fff;font-weight:600}
  .cell.sel:not(.today) .dn{color:var(--tint);font-weight:700}
  .cell.past .dn{color:var(--text3)}
  .cell.today.past .dn{color:#fff}
  .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:100%}
  .dots i{width:6px;height:6px;border-radius:50%;display:block}
  .dots i.ring{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}
  .dots .mk{width:6px;height:6px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .dots .mk svg{width:6px;height:6px;display:block}
  .dots .nmore{font-size:9px;color:var(--text2);line-height:6px}
  .dots .mk.rv{opacity:.45;border-radius:2px}
  .cell .alldone{position:absolute;top:2px;right:3px;color:var(--green);font-size:10px;font-weight:800;line-height:1}
  .cell.today .alldone{color:#fff}
  .dp-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .dp-head .d{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .dp-head .wd{font-size:13px;color:var(--text2)}
  .lock{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:12.5px;color:var(--text2)}
  .lock button{border:none;background:var(--bg2);color:var(--tint);border-radius:7px;padding:5px 11px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
  .seclab{font-size:12px;font-weight:600;color:var(--text2);text-transform:none;margin:16px 0 7px}
  .glist{background:var(--card);border:1px solid var(--sep);border-radius:11px;overflow:hidden}
  .gi{display:flex;align-items:center;gap:11px;padding:11px 13px;border-top:1px solid var(--sep)}
  .gi:first-child{border-top:none}
  .gdot{width:11px;height:11px;border-radius:50%;flex:none}
  .gi .gt{flex:1;font-size:14.5px;min-width:0}
  .gi .gt .gs{font-size:11.5px;color:var(--text2);margin-top:2px}
  .gi.done .gt .gtitle{color:var(--text2);text-decoration:line-through}
  .gck{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--fill2);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;background:transparent}
  .gck.on{background:var(--green);border-color:var(--green)}
  .gacts{display:flex;gap:3px;flex:none}
  .gacts button{border:none;background:none;color:var(--text3);font-size:15px;padding:2px 4px}
  .gacts button:hover{color:var(--tint)}
  .rate{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .rb{border:1px solid var(--sep2);background:transparent;border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--text)}
  .rb:active{transform:scale(.97)}
  .rb-again{color:var(--red)} .rb-again:hover{background:var(--red);color:#fff;border-color:var(--red)}
  .rb-hard{color:var(--orange)} .rb-hard:hover{background:var(--orange);color:#fff;border-color:var(--orange)}
  .rb-good{color:var(--tint)} .rb-good:hover{background:var(--tint);color:#fff;border-color:var(--tint)}
  .rb-easy{color:var(--green)} .rb-easy:hover{background:var(--green);color:#fff;border-color:var(--green)}
  .rb-skip{color:var(--text2);margin-left:auto}
  .rb.sel{background:var(--tint);color:#fff;border-color:var(--tint)}
  .mbar{height:5px;border-radius:3px;background:var(--fill2);overflow:hidden;margin-top:7px;max-width:200px}
  .mbar i{display:block;height:100%;border-radius:3px}
  .empty{font-size:13px;color:var(--text2);padding:8px 2px}
  .addrow{display:flex;gap:8px;margin-top:9px}
  .addrow input{flex:1}

  .mod-h{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
  .mod-sub{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .card h4{font-size:15px;margin:0 0 12px}
  .crow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep)}
  .crow:first-of-type{border-top:none}
  .crow .ct{flex:1;min-width:0}
  .crow .ct .cs{font-size:12px;color:var(--text2);margin-top:3px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .field label{font-size:13px;font-weight:600}
  .field .desc,.desc{font-size:12px;color:var(--text2);line-height:1.55;font-weight:400}
  input[type=text],input[type=date],input[type=number],select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--sep2);border-radius:9px;padding:9px 11px;background:var(--bg2);color:var(--text);width:100%;-webkit-appearance:none}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tint);box-shadow:0 0 0 3px var(--tint-soft)}
  textarea{resize:vertical;min-height:54px}
  textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:120px}
  .frow{display:flex;gap:10px;flex-wrap:wrap}.frow>.field{flex:1;min-width:120px}
  .btn{border:none;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;background:var(--tint);color:#fff}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--fill);color:var(--tint)}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
  .btn.warn{background:var(--fill);color:var(--red)}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
  .seg{display:flex;gap:0;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:13px}
  .seg button{flex:1;border:none;background:transparent;border-radius:7px;padding:8px 4px;font-size:13.5px;font-weight:500;color:var(--text)}
  .seg button.sel{background:var(--bg2);box-shadow:var(--shadow);font-weight:600}
  .radios{display:flex;flex-direction:column;gap:8px}
  .radios label{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:500;padding:11px 13px;border:1px solid var(--sep2);border-radius:10px}
  .radios label.sel{border-color:var(--tint);background:var(--tint-soft)}
  .radios input{margin-top:2px}
  .radios .rd{font-size:11.5px;color:var(--text2);font-weight:400;margin-top:2px}
  .swatches{display:flex;gap:9px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative}
  .sw.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--bg2) inset}
  table.lv{width:100%;border-collapse:collapse;font-size:13px}
  table.lv th{text-align:left;font-size:11px;color:var(--text2);font-weight:600;padding:4px 6px}
  table.lv td{padding:4px 6px;border-top:1px solid var(--sep)}
  table.lv input{padding:6px 8px;font-size:12.5px}table.lv input.n{width:62px}
  .ph{text-align:center;padding:44px 20px;color:var(--text2)}
  .ph h3{font-size:20px;color:var(--text);margin:10px 0 6px}.ph p{font-size:13px;max-width:420px;margin:0 auto;line-height:1.6}
  .recon{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff3f2;border:1px solid var(--red);border-radius:11px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--red)}
  .recon button{background:var(--red);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600}
  footer.foot{margin-top:26px;font-size:11.5px;color:var(--text2);text-align:center}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .scrim.on{display:flex}
  .modal{background:var(--bg2);width:100%;max-width:480px;border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
  .mhead{padding:16px 18px 12px;border-bottom:1px solid var(--sep);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:0;background:var(--bg2)}
  .mhead .d{font-size:18px;font-weight:700}
  .x{background:none;border:none;font-size:21px;color:var(--text2);line-height:1;padding:2px 6px;flex:none}
  .mbody{padding:16px 18px 20px}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(40,40,42,.96);color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:80}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ===== 背诵库 + 考试(并入) ===== */
  :root{ --R:#c0392b; --B:#2f5fa6; --G:#3f8a5b; --P:#7d57b0; --R-bg:#f7e4e0; --B-bg:#e3eaf6; --G-bg:#e2f0e6; --P-bg:#eee5f7; --serif:"Songti SC","STSong","SimSun",Georgia,"Times New Roman",serif; }
  @media (prefers-color-scheme: dark){ :root{ --R:#ff6f61; --B:#7aa7e6; --G:#5fc587; --P:#b89be0; --R-bg:#3a2320; --B-bg:#1f2a3d; --G-bg:#1e3127; --P-bg:#2c2440; } }
  .msub{ font-size:12px; color:var(--text2); margin-top:3px }
  .kempty{ background:var(--card); border:1.5px dashed var(--sep2); border-radius:var(--r-lg); padding:34px 20px; text-align:center; color:var(--text2); box-shadow:var(--shadow) }
  .kempty .big{ font-size:17px; font-weight:600; color:var(--text); margin-bottom:6px }
  .kempty code{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; background:var(--fill); padding:1px 5px; border-radius:5px }
  .stat{ font-size:12.5px; margin-top:8px; line-height:1.6; color:var(--text2) } .stat.ok{ color:var(--green) } .stat.bad{ color:var(--red) }

  .chrow{ display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--card); border:1px solid var(--sep); border-radius:var(--r); margin-bottom:10px; box-shadow:var(--shadow); transition:.14s }
  .chrow:hover{ border-color:var(--tint) }
  .chrow .seal{ width:40px; height:40px; flex:none; border-radius:10px; background:var(--tint); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px }
  .chrow .body{ flex:1; min-width:0; cursor:pointer } .chrow .nm{ font-weight:600; font-size:16px; line-height:1.3 }
  .chrow .meta{ font-size:11.5px; color:var(--text2); margin-top:3px } .chrow .meta b{ color:var(--tint) }
  .chrow .acts{ display:flex; gap:6px; flex:none; align-items:center } .ico{ background:none; border:1px solid var(--sep2); border-radius:8px; width:32px; height:32px; cursor:pointer; color:var(--text2); font-size:14px }
  .ico:hover{ border-color:var(--text); color:var(--text) }
  .chrow.click:hover{ border-color:var(--tint) } .chrow .chev{ font-size:22px; color:var(--text3); font-weight:300; padding:0 4px }
  .libsearch{ display:flex; gap:8px; margin:0 0 14px; flex-wrap:wrap } .libsearch input{ flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--sep2); border-radius:10px; background:var(--card); color:var(--text); font-size:14px }
  .srcard{ background:var(--card); border:1px solid var(--sep); border-radius:12px; padding:12px 14px; margin-bottom:10px; cursor:pointer; box-shadow:var(--shadow); transition:.14s } .srcard:hover{ border-color:var(--tint) }
  .srcard .srtext{ font-family:var(--serif); font-size:15px; line-height:1.75; color:var(--text) } .srcard .srfrom{ font-size:12px; color:var(--text2); margin-top:7px }
  mark.hl{ background:var(--B-bg); color:var(--B); border-radius:3px; padding:0 2px; font-weight:600 }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text2); margin:0 0 14px } .legend .lg{ display:flex; align-items:center; gap:6px }
  .cdot{ width:11px; height:11px; border-radius:50%; flex:none } .cdot.R{ background:var(--R) } .cdot.B{ background:var(--B) } .cdot.G{ background:var(--G) } .cdot.P{ background:var(--P) }
  .backlink{ font-size:13px; color:var(--tint); background:none; border:none; cursor:pointer; font-weight:600; margin-bottom:10px; padding:0 } .backlink:hover{ text-decoration:underline }
  .subtabs{ display:inline-flex; background:var(--fill); border-radius:10px; padding:3px; gap:3px; margin-bottom:14px }
  .subtabs button{ font-size:13px; font-weight:600; color:var(--text2); background:none; border:none; border-radius:7px; padding:7px 16px; cursor:pointer }
  .subtabs button.sel{ background:var(--bg2); color:var(--text); box-shadow:var(--shadow) }
  .vtoolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px }
  .layertabs{ display:flex; gap:6px; flex-wrap:wrap } .layertabs button{ font-size:13px; font-weight:600; color:var(--text2); background:var(--card); border:1px solid var(--sep2); border-radius:9px; padding:7px 12px; cursor:pointer }
  .layertabs button.sel{ background:var(--text); color:var(--bg2); border-color:var(--text) }
  .toggle{ margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text2) }
  .switch{ position:relative; width:46px; height:26px; background:var(--fill2); border-radius:99px; cursor:pointer; border:none; transition:.16s; flex:none }
  .switch.on{ background:var(--tint) } .switch::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.16s } .switch.on::after{ left:23px }
  .layerdesc{ font-size:12.5px; color:var(--text2); background:var(--fill); border-left:3px solid var(--tint); border-radius:0 8px 8px 0; padding:10px 14px; margin:0 0 14px; line-height:1.7 }
  .recitebar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--card); border:1px solid var(--sep); border-radius:var(--r); padding:11px 14px; margin:0 0 16px; box-shadow:var(--shadow); font-size:13px }
  .recitebar .rb-on{ color:var(--green); font-weight:600 } .recitebar .rb-off{ color:var(--text2) } .recitebar .rb-meta{ color:var(--text2) } .recitebar .rb-meta b{ color:var(--text) } .recitebar .btn{ margin-left:auto }
  .lessonscroll{ max-height:248px; overflow:auto; background:var(--card); border:1px solid var(--sep); border-radius:9px; margin-top:2px }
  .lessonscroll table.lv{ margin:0 } .lessonscroll thead th{ position:sticky; top:0; background:var(--card); z-index:1; box-shadow:0 1px 0 var(--sep) } .lessonscroll td:first-child,.lessonscroll th:first-child{ padding-left:10px }
  .tl{ border:1px solid var(--sep); border-radius:10px; overflow:hidden; margin:2px 0 10px; background:var(--card) }
  .tl-row{ display:flex; align-items:center; gap:8px; padding:7px 11px; font-size:13px; border-top:1px solid var(--sep) } .tl-row:first-child{ border-top:none }
  .tl-row.meal{ background:var(--fill); color:var(--text2) } .tl-row.ov{ background:var(--R-bg) }
  .tl-time{ font-variant-numeric:tabular-nums; font-weight:600; color:var(--text); width:96px; flex:none } .tl-dot{ width:9px; height:9px; border-radius:50%; flex:none }
  .tl-lab{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .tl-dur{ font-size:11.5px; color:var(--text2); flex:none }
  .tl-empty,.tl-un{ font-size:12px; color:var(--text2); padding:8px 2px } .tl-un{ color:var(--red) }
  .tp-list{ display:flex; flex-direction:column; gap:8px }
  .tp-row{ border:1px solid var(--sep); border-radius:10px; padding:9px 11px; background:var(--card) }

    .scrim{padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}

  }

/* ===== 2.2 多文件拆分内核 (本地文件夹后端 与 云同步后端 共用) =====
   一份 db 拆成 18 个文件:index.json(清单) + state.json(热) + content/<id>.json×12 + decks/<id>{,-images}.json×4
   日常只有 state.json 变化,上传量 1.6MB → 49KB。index.json 记录每个文件的指纹,
   拉取时只读它就知道谁变了,不必下载全部。 */
const SPLIT_VER=3;

/* db → { 路径:json字符串 }。文件名用 id(稳定、纯 ASCII),中文名放进 index.meta 供仓库网页查阅。 */
function splitDb(){

  files["state.json"]=JSON.stringify(state);
  (db.contents||[]).forEach(c=>{ const p=spCPath(c); files[p]=JSON.stringify(c); meta[p]={name:c.name||""}; });
  (db.flashDecks||[]).forEach(d=>{ const p=spDPath(d), body={};
    Object.keys(d).forEach(k=>{ if(k!=="images") body[k]=d[k]; });
    files[p]=JSON.stringify(body); files[spDImg(d)]=JSON.stringify(d.images||{}); meta[p]={name:d.name||""}; });
  /* 法律题库:题目+卡片体积大且极少变,单独成文件,不随日常打卡重写。
     2026-08-26 并入无非 1095 题后整包 2.22MB,越过了 GitHub Contents API 的 1MB 门槛
     (>1MB 只返元数据,读要走 raw 媒体类型、写的 base64 负载也翻倍;而那条 raw 分支
     从没被实战验证过)。故按「出题机构+科目」再拆,让每个文件都留在 1MB 以下:
       law/bank.json      金标尺 519 题 + 卡片 + 知识点
       law/wf-<科目>.json 无非的题,按科目分(科目码取自题 id 的第二段,纯 ASCII)
     **拆的只是文件;内存里 db.lawBank 仍是完整一份,App 其余代码完全无感。**
     spWriteOrder 按 "law/" 前缀成组,新文件自动进组,不用另加。 */
  if(db.lawBank&&(((db.lawBank.questions||[]).length)||((db.lawBank.cards||[]).length))){

    files["law/bank.json"]=JSON.stringify(o);

  }

  if(db.mgBank&&((db.mgBank.questions||[]).length)) files["mg/bank.json"]=JSON.stringify(db.mgBank);
  /* 公文写作:范文/文种/格式资料体积大且极少变,同样单独成文件 */
  if(db.wrBank&&((db.wrBank.papers||[]).length)) files["wr/bank.json"]=JSON.stringify(db.wrBank);
  /* 习思想题库:270 题体积大且极少变,同样单独成文件,不随日常打卡重写 */
  if(db.sjBank&&((db.sjBank.questions||[]).length)) files["sj/bank.json"]=JSON.stringify(db.sjBank);
  if(db.mzBank&&((db.mzBank.questions||[]).length)) files["mz/bank.json"]=JSON.stringify(db.mzBank);
  /* 国省情题库：120 题 + 43 个知识点（知识点是按她自己两份笔记的标题划分的） */
  if(db.gsBank&&((db.gsBank.questions||[]).length)) files["gs/bank.json"]=JSON.stringify(db.gsBank);

/* 写入顺序:图片 → 卡片 → 章节 → state.json → index.json 最后。
   index.json 是别的设备唯一入口,它落地就意味着它引用的文件都已先落地;
   中途失败时它仍指向上一组一致的文件,别的设备永远读不到半份数据。**顺序不可调**。 */
function spWriteOrder(files){
  const all=Object.keys(files);
  const img=all.filter(p=>/^decks\/.*-images\.json$/.test(p));
  const deck=all.filter(p=>p.indexOf("decks/")===0 && !/-images\.json$/.test(p));
  const cont=all.filter(p=>p.indexOf("content/")===0);
  const law=all.filter(p=>p.indexOf("law/")===0);
  const mgb=all.filter(p=>p.indexOf("mg/")===0);
  const wrf=all.filter(p=>p.indexOf("wr/")===0);
  const sjb=all.filter(p=>p.indexOf("sj/")===0);
  const mzb=all.filter(p=>p.indexOf("mz/")===0);
  const gsb=all.filter(p=>p.indexOf("gs/")===0);
  /* 2026-08-24 修：splitDb 会产出 mz/bank.json，但这里漏了 mz 组，
     结果该文件从不上传、index.json 却引用它——别的设备 mergeFiles 返回 null，同步整体停摆。
     **凡是往 splitDb 里加新文件，必须同时在这里加一组**，否则就是这个下场。 */
  return img.concat(deck,cont,law,mgb,wrf,sjb,mzb,gsb,["state.json","index.json"]);
}
/* { 路径:json字符串 } → db(未 normalize)。任一被 index 引用的文件缺失/解析失败 → 返回 null。
   **调用方拿到 null 必须整体放弃采用**,绝不能拿残缺数据覆盖本机。这是最关键的安全边界。 */
function mergeFiles(files){
  let idx; try{ idx=JSON.parse(files["index.json"]); }catch(e){ return null; }
  if(!idx||idx._split!==SPLIT_VER||!idx.files||typeof idx.files!=="object") return null;
  const need=Object.keys(idx.files);
  for(let i=0;i<need.length;i++){ if(typeof files[need[i]]!=="string") return null; }
  if(typeof files["state.json"]!=="string") return null;
  try{
    const out=Object.assign({},JSON.parse(files["state.json"]));
    out.contents=[]; out.flashDecks=[];
    need.forEach(p=>{ if(p.indexOf("content/")===0) out.contents.push(JSON.parse(files[p])); });
    need.forEach(p=>{ if(p.indexOf("decks/")!==0 || /-images\.json$/.test(p)) return;
      const d=JSON.parse(files[p]), ip=spDImg(d);
      d.images=(typeof files[ip]==="string")?JSON.parse(files[ip]):{};
      out.flashDecks.push(d); });
    if(typeof files["law/bank.json"]==="string"){
      out.lawBank=JSON.parse(files["law/bank.json"]);
      /* 无非的题按科目分在 law/wf-*.json,在这里合回同一个 lawBank。
         走 need(=index 引用的文件清单),所以少任何一片上面的 need 循环已经先返回 null 了。 */
      if(!Array.isArray(out.lawBank.questions)) out.lawBank.questions=[];
      need.forEach(p=>{ if(p.indexOf("law/wf-")===0)
        out.lawBank.questions=out.lawBank.questions.concat(JSON.parse(files[p])); });
    }
    if(typeof files["mg/bank.json"]==="string") out.mgBank=JSON.parse(files["mg/bank.json"]);
    if(typeof files["wr/bank.json"]==="string") out.wrBank=JSON.parse(files["wr/bank.json"]);
    if(typeof files["sj/bank.json"]==="string") out.sjBank=JSON.parse(files["sj/bank.json"]);
    if(typeof files["mz/bank.json"]==="string") out.mzBank=JSON.parse(files["mz/bank.json"]);
    if(typeof files["gs/bank.json"]==="string") out.gsBank=JSON.parse(files["gs/bank.json"]);
    return out;
  }catch(e){ return null; }
}

async function dirFile(dir,path,create){ const a=path.split("/"); let d=dir;
  for(let i=0;i<a.length-1;i++) d=await d.getDirectoryHandle(a[i],{create:!!create});
  return await d.getFileHandle(a[a.length-1],{create:!!create}); }
async function dirRead(path){ try{ const h=await dirFile(dataDir,path,false); return await (await h.getFile()).text(); }catch(e){ return null; } }
async function dirWrite(path,text){ const h=await dirFile(dataDir,path,true); const w=await h.createWritable(); await w.write(text); await w.close(); }

/* 读整个文件夹 → db。任一被 index 引用的文件读不到,mergeFiles 返回 null,整体放弃、保留本机数据。 */
async function readDir(){ if(!dataDir) return false;
  try{ const it=await dirRead("index.json"); if(it===null) return false;
    const idx=JSON.parse(it), files={"index.json":it}, need=Object.keys(idx.files||{});
    for(let i=0;i<need.length;i++){ const t=await dirRead(need[i]); if(t===null) return false; files[need[i]]=t; }

/* 写整个文件夹:只写指纹变了的文件,index.json 最后;并清掉已删章节/牌组的残留文件。 */
async function writeDir(){ if(!dataDir) return false;
  try{ const files=splitDb(); let old={};
    const it=await dirRead("index.json"); if(it){ try{ old=JSON.parse(it).files||{}; }catch(e){} }
    const now=JSON.parse(files["index.json"]).files, order=spWriteOrder(files);
    for(let i=0;i<order.length;i++){ const p=order[i];

async function save(opts){ opts=opts||{}; setSave("保存中…"); db.version=7; if(!opts.keepSavedAt) db.savedAt=new Date().toISOString(); const p=JSON.stringify(db); let ok=false; if(hasLS()){ try{ localStorage.setItem(STORE_KEY,p); ok=true; }catch(e){} } if(dataDir&&!needReconnect){ if(await writeDir()) ok=true; } setSave(ok?"已保存 ✓":"保存失败(请用导出备份)"); if(!opts.noSync) csSchedulePush(); }

/* ===== 2.5 云同步 (GitHub Contents API;私有仓库存【多文件】,全平台含 iPhone 都能用) =====
   仓库里是一组小文件,与「本地数据文件夹」用的是同一套 splitDb/mergeFiles 内核:
     index.json(清单) + state.json(热) + content/<id>.json×N + decks/<id>{,-images}.json
   ·拉取:先只取 index.json(约 4KB),按指纹决定下载哪几个;本机已有相同内容的文件根本不下载。
   ·推送:只 PUT 指纹变了的文件,**index.json 永远最后** —— 它落地才代表它引用的文件都已先落地;
     中途失败时它仍指向上一组一致的文件,别的设备永远读不到半份数据。顺序不可调。
   ·冲突:按 index.json 的 savedAt「后保存者胜」,不做逐条合并(与单文件时期语义一致)。
   ·mergeFiles 返回 null(任一被引用文件缺失/损坏)时**必须放弃采用**,宁可不同步也不覆盖本机。
   ·令牌只存本机 localStorage,绝不写入同步数据。 */
/* 换设备时省得手打:仓库框直接预填这个值,不想用改掉即可。仓库是私有的,写在这里不等于能访问(还需令牌)。 */
const CS_DEFAULT_REPO="scarlett-dou/study-data";
const CS={ token:"", repo:"", branch:"main", shas:{}, hashes:{}, remoteSavedAt:"", status:"", busy:false, pending:false, applying:false, timer:null, lastPushedSavedAt:null, lastPushAt:0, warn:null, warned:false };
const CS_MIN_PUSH_MS=60000; /* 自动上传最小间隔:每个文件是一条 commit,别一动就传 */
let csLastPull=0;
function csLoadCfg(){ if(!hasLS()) return; try{ CS.token=localStorage.getItem("cs-token")||""; CS.repo=localStorage.getItem("cs-repo")||""; CS.branch=localStorage.getItem("cs-branch")||"main";
  CS.shas=JSON.parse(localStorage.getItem("cs-shas")||"{}")||{}; CS.hashes=JSON.parse(localStorage.getItem("cs-hashes")||"{}")||{};
  CS.remoteSavedAt=localStorage.getItem("cs-rsa")||""; }catch(e){ CS.shas={}; CS.hashes={}; } }
function csSaveCfg(){ if(!hasLS()) return; try{ localStorage.setItem("cs-token",CS.token); localStorage.setItem("cs-repo",CS.repo); localStorage.setItem("cs-branch",CS.branch);
  localStorage.setItem("cs-shas",JSON.stringify(CS.shas)); localStorage.setItem("cs-hashes",JSON.stringify(CS.hashes));
  CS.remoteSavedAt?localStorage.setItem("cs-rsa",CS.remoteSavedAt):localStorage.removeItem("cs-rsa"); }catch(e){} }
function csConfigured(){ return !!(CS.token&&CS.repo); }
/* 旧版桌面 study-hub 写出的 json 没有 savedAt,会被误判成"无数据可上传"。
   本机若有真实数据却没时间戳,补盖一个"现在",使它能正常参与新旧比较并上传。 */
function ensureStamp(){ if(!db||db.savedAt) return; const has=(db.contents&&db.contents.length)||(db.courses&&db.courses.length)||(db.recites&&db.recites.length); if(has) db.savedAt=new Date().toISOString(); }
function csFmt(t){ try{ return t?new Date(t).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):""; }catch(e){ return ""; } }
function csSetStatus(t,ok){ CS.status=t; const el=document.getElementById("csStatus"); if(el){ el.textContent=t; el.style.color=ok?"#2ca02c":""; } }
function b64enc(str){ const b=new TextEncoder().encode(str); let s="",CH=0x8000; for(let i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null,b.subarray(i,i+CH)); return btoa(s); }
function b64dec(b64){ const bin=atob((b64||"").replace(/\s/g,"")); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return new TextDecoder().decode(b); }
function csApi(method,path,body,accept){ const base="https://api.github.com/repos/"+CS.repo+"/contents/"+path.split("/").map(encodeURIComponent).join("/");
  const url=base+(method==="GET"?("?ref="+encodeURIComponent(CS.branch)+"&t="+Date.now()):"");
  return fetch(url,{ method, cache:"no-store", headers:{ "Authorization":"Bearer "+CS.token, "Accept":accept||"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" }, body: body?JSON.stringify(body):undefined }); }
/* 读一个文件 → {text,sha} / {missing:true} / null(出错)。
   GitHub Contents API 对 >1MB 的文件只返回元数据、content 为空,必须改用 raw 媒体类型(上限 100MB)。
   拆分后单文件最大约 400KB 用不到这条,但内容涨大后仍会用到,别删。 */
async function csGet(path){
  let r; try{ r=await csApi("GET",path); }catch(e){ return null; }
  if(r.status===404) return {missing:true};
  if(r.status===401||r.status===403){ csSetStatus("令牌无效或无权限,请检查 Token/仓库",false); return null; }
  if(!r.ok) return null;
  let m; try{ m=await r.json(); }catch(e){ return null; }
  if(m.content&&m.content.length){ try{ return {text:b64dec(m.content),sha:m.sha}; }catch(e){ return null; } }
  try{ const r2=await csApi("GET",path,null,"application/vnd.github.raw"); if(!r2.ok) return null; return {text:await r2.text(),sha:m.sha}; }catch(e){ return null; }
}
async function csPutFile(path,text,msg){
  const body={ message:msg, content:b64enc(text), branch:CS.branch }; if(CS.shas[path]) body.sha=CS.shas[path];
  let r=await csApi("PUT",path,body);
  if(r.status===409||r.status===422){ /* sha 过期或本以为不存在:重新取一次再试 */
    const g=await csGet(path);
    if(g&&g.missing) delete body.sha; else if(g&&g.sha) body.sha=g.sha; else return false;
    r=await csApi("PUT",path,body); }
  if(r.status===401||r.status===403){ csSetStatus("令牌无效或无权限,请检查 Token/仓库",false); return false; }
  if(!r.ok){ csSetStatus("上传失败("+r.status+" · "+path+")",false); return false; }
  try{ const j=await r.json(); if(j&&j.content&&j.content.sha) CS.shas[path]=j.content.sha; }catch(e){}
  return true;
}
/* 删远端多余文件(比如删掉一章)。尽力而为,失败不影响同步 —— index.json 不引用它,残留也读不到。 */
async function csDelFile(path){ try{ let sha=CS.shas[path];
  if(!sha){ const g=await csGet(path); if(!g||g.missing) return; sha=g.sha; }
  await csApi("DELETE",path,{message:"remove "+path,sha:sha,branch:CS.branch}); delete CS.shas[path]; }catch(e){} }
/* 按远端 index 组装完整 db。本机已有相同指纹的文件直接复用,不下载。
   返回 null = 有文件没取到,调用方必须放弃采用。 */
async function csPullFiles(idxText,ridx){
  const local=splitDb(), files={"index.json":idxText}, need=Object.keys(ridx.files||{});
  let dl=0, total=need.filter(p=>!(local[p]!==undefined&&spHash(local[p])===ridx.files[p])).length;
  for(let i=0;i<need.length;i++){ const p=need[i];
    if(local[p]!==undefined&&spHash(local[p])===ridx.files[p]){ files[p]=local[p]; continue; }  /* 本机已是这份内容 */
    csSetStatus("下载中… "+(++dl)+"/"+total,false);
    const g=await csGet(p); if(!g||g.missing||typeof g.text!=="string") return null;
    files[p]=g.text; CS.shas[p]=g.sha; }
  return mergeFiles(files);
}
async function csAdopt(remote,rt,ridx){ CS.applying=true; db=normalizeDb(remote); await save({noSync:true,keepSavedAt:true}); CS.applying=false;
  CS.lastPushedSavedAt=rt||db.savedAt; CS.remoteSavedAt=rt||"";
  /* 记远端指纹而非本机重算的:normalizeDb 可能补了字段,这样下次推送会把差异修正回云端 */
  CS.hashes=Object.assign({},(ridx&&ridx.files)||{}); csSaveCfg(); }
/* 推送:只传指纹变了的文件,index.json 最后。 */
async function csPush(){
  const files=splitDb(), now=JSON.parse(files["index.json"]).files, order=spWriteOrder(files);
  const todo=order.filter(p=>p!=="index.json"&&CS.hashes[p]!==now[p]);
  for(let i=0;i<todo.length;i++){ const p=todo[i];
    csSetStatus("上传中… "+(i+1)+"/"+todo.length+" ("+Math.round(files[p].length/1024)+" KB)",false);
    if(!(await csPutFile(p,files[p],"sync "+p))) return false;
    CS.hashes[p]=now[p]; csSaveCfg(); }
  const gone=Object.keys(CS.hashes).filter(p=>p!=="index.json"&&!(p in now));
  for(let i=0;i<gone.length;i++){ await csDelFile(gone[i]); delete CS.hashes[gone[i]]; }
  if(!(await csPutFile("index.json",files["index.json"],"sync "+(db.savedAt||"")))) return false;
  CS.lastPushedSavedAt=db.savedAt; CS.remoteSavedAt=db.savedAt||""; CS.lastPushAt=Date.now(); csSaveCfg();
  csSetStatus("已上传到云端 ✓ "+(todo.length?("("+(todo.length+1)+" 个文件) "):"")+csFmt(db.savedAt),true); return true;
}
/* 旧版单文件快照迁移:整份读进来后,按新布局全量重推。 */
async function csAdoptLegacy(old,ot){ CS.applying=true; db=normalizeDb(old); await save({noSync:true,keepSavedAt:true}); CS.applying=false;
  CS.hashes={}; CS.shas={}; CS.remoteSavedAt=ot||""; csSaveCfg(); render();
  csSetStatus("已读取旧版单文件,正在转成多文件…",false); await csPush(); }
/* ---- 手动「下载 / 上传」与防覆盖护栏 ----
   云同步本来是整包「后保存者胜」。2026-08-23 出过一次事故：一台还停在旧数据的设备
   改了点东西、时间戳变新，把另一台设备当天做的 38 道题整包盖掉了。
   所以：①index.json 里带上各类记录条数；②自动同步前比一次，发现「要覆盖的那边反而更多」
   就停下来不动，让人自己选方向；③设置里给出明确的「下载 / 上传」两个动作。 */
function csStats(o){ o=o||{}; const n=x=>Object.keys(x||{}).length;
  return { law:n((o.lawState||{}).q), mg:n((o.mgState||{}).q), sj:n((o.sjState||{}).q), mz:n((o.mzState||{}).q), gs:n((o.gsState||{}).q),
           wr:n((o.wrState||{}).done), contents:(o.contents||[]).length, decks:(o.flashDecks||[]).length,
           plans:(o.plans||[]).length, courses:(o.courses||[]).length, recites:(o.recites||[]).length }; }
/* 只拿「正常只会增加」的项当护栏；计划/课程/复习会被正常删除，不参与判断，免得天天误报 */
const CS_GUARD=[["law","法律做题"],["mg","管理做题"],["sj","习思想做题"],["mz","马哲做题"],["wr","写作习作"],["contents","背诵章节"],["decks","卡片本"]];
const CS_ROWS=[["law","刷题·法律"],["mg","刷题·管理"],["sj","刷题·习思想"],["mz","刷题·马哲"],["wr","写作习作"],
  ["contents","背诵章节"],["decks","卡片本"],["plans","计划"],["courses","课程"],["recites","复习"]];
/* a 比 b 少的项（= 拿 a 去覆盖 b 会丢东西） */
function csShrink(a,b){ if(!a||!b) return [];
  return CS_GUARD.filter(k=>(Number(b[k[0]])||0)>(Number(a[k[0]])||0))
                 .map(k=>k[1]+" "+(Number(a[k[0]])||0)+"→"+(Number(b[k[0]])||0)); }
function csCmpHtml(local,remote,lt,rt){
  let rows='<tr><th>保存时间</th><td>'+esc(csFmt(lt)||"—")+'</td><td>'+esc(csFmt(rt)||"—")+'</td></tr>';
  CS_ROWS.forEach(k=>{ const a=Number((local&&local[k[0]])||0), b=remote?Number(remote[k[0]]||0):null;
    const lo=(b!==null&&a<b), hi=(b!==null&&b<a);
    rows+='<tr><th>'+esc(k[1])+'</th><td class="'+(lo?"lo":"")+'">'+a+'</td><td class="'+(hi?"lo":"")+'">'+(b===null?"—":b)+'</td></tr>'; });
  return '<table class="cs-cmp"><thead><tr><th></th><th>本机</th><th>云端</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="cs-hint">标红 = 这一边少。别拿少的那边去覆盖多的那边。</div>'; }
/* 只取云端摘要（index.json 约 4KB；旧版 index 没有 stats 时再取一次 state.json） */
async function csPeek(){ if(!csConfigured()) return null;
  const g=await csGet("index.json"); if(!g||g.missing) return null;
  let ridx=null; try{ ridx=JSON.parse(g.text); }catch(e){}
  if(!ridx||!ridx.files) return null;
  let st=ridx.stats;
  if(!st){ const s=await csGet("state.json");
    if(s&&!s.missing&&s.text){ try{ st=csStats(JSON.parse(s.text)); }catch(e){} } }
  return { savedAt:ridx.savedAt||"", stats:st||null, idx:ridx, text:g.text, sha:g.sha }; }
/* ⬇️ 下载：无条件用云端覆盖本机（mergeFiles 返回 null 时照旧整体放弃，绝不拿残缺数据覆盖） */
async function csForcePull(){ if(!csConfigured()){ toast("还没连接云同步"); return false; }
  if(CS.busy){ toast("正在同步中，稍等"); return false; } CS.busy=true;
  try{ csSetStatus("读取云端…",false);
    const p=await csPeek();
    if(!p){ csSetStatus("读不到云端(网络或令牌?)",false); toast("读不到云端数据"); return false; }
    if(p.idx._split!==SPLIT_VER){ csSetStatus("云端清单格式不认识,已保留本机数据",false); return false; }
    const merged=await csPullFiles(p.text,p.idx);
    if(!merged){ csSetStatus("云端文件不完整,已保留本机数据",false); toast("云端文件不完整，没有动本机数据"); return false; }
    CS.shas["index.json"]=p.sha;
    await csAdopt(merged,p.savedAt,p.idx); CS.warn=null; CS.warned=false; render();
    csSetStatus("已从云端下载 ✓ "+csFmt(p.savedAt),true); toast("已下载云端数据 ✓"); return true;
  }catch(e){ csSetStatus("下载出错(网络离线?)",false); return false; }
  finally{ CS.busy=false; csSaveCfg(); } }
/* ⬆️ 上传：无条件用本机覆盖云端。以远端指纹为基准，只传真正不同的文件 */
async function csForcePush(){ if(!csConfigured()){ toast("还没连接云同步"); return false; }
  if(CS.busy){ toast("正在同步中，稍等"); return false; } CS.busy=true;
  try{ csSetStatus("读取云端…",false);
    const p=await csPeek();
    if(p){ CS.hashes=Object.assign({},p.idx.files||{}); CS.shas["index.json"]=p.sha; }
    await save({noSync:true});
    /* 万一本机时钟慢于云端，戳要压过云端，否则别的设备不会来拉 */
    if(p&&p.savedAt&&p.savedAt>=(db.savedAt||"")){
      db.savedAt=new Date(Date.parse(p.savedAt)+1000).toISOString(); await save({noSync:true,keepSavedAt:true}); }
    const ok=await csPush();
    if(ok){ CS.warn=null; CS.warned=false; toast("已上传到云端 ✓"); render(); }
    return ok;
  }catch(e){ csSetStatus("上传出错(网络离线?)",false); return false; }
  finally{ CS.busy=false; csSaveCfg(); } }
/* 拦下一次危险的自动同步，把选择权交回给人 */
function csBlock(why,dims,rt,lt,rstats){
  const first=!CS.warn;
  CS.warn={ why:why, dims:dims, rt:rt, lt:lt, remote:rstats||null, local:csStats(db) };
  csSetStatus("⚠️ 已暂停自动同步："+why+"（"+dims.join("、")+"）→ 到设置里手动选下载还是上传",false);
  if(first){ toast("⚠️ 两边数据对不上，已暂停自动同步"); if(!CS.warned){ CS.warned=true; csWarnModal(); } } }
function csWarnModal(){
  const w=CS.warn; if(!w) return;
  const h=openModal("⚠️ 两边数据对不上，先别自动同步",
    '<p class="lw-hint"><b>'+esc(w.why)+'：'+esc(w.dims.join("、"))+'。</b><br>'+
    '再自动同步下去会把多的那边覆盖掉，所以先停下来。看清楚下面的对比，自己选方向：'+
    '<br>· 想保住<b>云端</b>那份 → 点「⬇️ 下载到本机」<br>· 想保住<b>本机</b>这份 → 点「⬆️ 上传到云端」</p>'+
    csCmpHtml(w.local,w.remote,w.lt,w.rt)+
    '<div class="btnrow" style="margin-top:12px"><button class="btn sm" id="cwDown">⬇️ 下载到本机</button>'+
    '<button class="btn sm" id="cwUp">⬆️ 上传到云端</button>'+
    '<button class="btn sm sec" id="cwLater">先不管</button></div>');
  h.querySelector("#cwDown").onclick=async()=>{ if(!confirm("用云端数据覆盖本机？本机现在这份会被替换掉。")) return; closeModal(); await csForcePull(); };
  h.querySelector("#cwUp").onclick=async()=>{ if(!confirm("用本机数据覆盖云端？云端现在那份会被替换掉。")) return; closeModal(); await csForcePush(); };
  h.querySelector("#cwLater").onclick=()=>closeModal(); }
async function csSync(opts){ opts=opts||{}; if(!csConfigured()) return; if(CS.busy){ CS.pending=true; return; } CS.busy=true; try{
    ensureStamp(); const lt=db.savedAt||"";
    const g=await csGet("index.json");
    if(g===null){ if(CS.status.indexOf("令牌")<0) csSetStatus("拉取失败(网络离线?)",false); return; }
    if(g.missing){
      /* 云端还没有多文件布局:看看有没有旧版单文件可迁移,否则把本机推上去 */
      const lg=await csGet("study-data.json");
      if(lg&&!lg.missing&&lg.text){ let old=null; try{ old=JSON.parse(lg.text); }catch(e){}
        const ot=(old&&old.savedAt)||"";
        if(old&&(old.contents!==undefined||old.flashDecks!==undefined)&&ot>lt){ await csAdoptLegacy(old,ot); return; } }
      if(lt){ await csPush(); return; }
      csSetStatus("云端暂无数据",false); return; }
    let ridx=null; try{ ridx=JSON.parse(g.text); }catch(e){}
    if(!ridx||ridx._split!==SPLIT_VER||!ridx.files){ csSetStatus("云端清单格式不认识,已保留本机数据",false); return; }
    CS.shas["index.json"]=g.sha;
    const rt=ridx.savedAt||"";
    if(rt>lt){
      const lose=csShrink(ridx.stats,csStats(db));   /* 云端比本机少的项 */
      if(lose.length&&!opts.force){ csBlock("云端比本机少数据",lose,rt,lt,ridx.stats); return; }
      CS.warn=null; const merged=await csPullFiles(g.text,ridx);
      if(!merged){ csSetStatus("云端文件不完整,已保留本机数据",false); return; }
      await csAdopt(merged,rt,ridx); render();
      csSetStatus("已拉取云端最新 ✓ "+csFmt(rt),true); if(!opts.silent) toast("已从云端同步最新 ✓"); return; }
    if(lt&&lt>rt){
      let rst=ridx.stats;   /* 老版本推上去的 index 没有 stats,上传是危险方向,值得多取一次 state.json 来比 */
      if(!rst){ const s=await csGet("state.json");
        if(s&&!s.missing&&s.text){ try{ rst=csStats(JSON.parse(s.text)); }catch(e){} } }
      const lose=csShrink(csStats(db),rst);   /* 本机比云端少的项 */
      if(lose.length&&!opts.force){ csBlock("本机比云端少数据",lose,rt,lt,ridx.stats); return; }
      CS.warn=null; await csPush(); return; }
    /* 时间戳相同但本机从没推过(例如刚导入了一份同戳数据):比一次指纹,不一致才推 */
    if(lt&&!Object.keys(CS.hashes).length){
      const now=JSON.parse(splitDb()["index.json"]).files;
      const diff=Object.keys(now).some(p=>now[p]!==ridx.files[p])||Object.keys(ridx.files).some(p=>!(p in now));
      if(diff){ await csPush(); return; }
      CS.hashes=Object.assign({},ridx.files); }
    CS.remoteSavedAt=rt; csSaveCfg();
    csSetStatus("已是最新 ✓ "+csFmt(rt||lt),true);
  }catch(e){ csSetStatus("同步出错(网络离线?)",false); }
  finally{ CS.busy=false; csSaveCfg(); if(CS.pending){ CS.pending=false; setTimeout(()=>csSync({silent:true}),400); } } }
function csSchedulePush(){ if(!csConfigured()) return; if(CS.timer) clearTimeout(CS.timer);

  CS.timer=setTimeout(()=>{ CS.timer=null; csSync({silent:true}); },wait); }

async function importLibFromDir(verbose){ if(!libDir) return;

/* ===== 3. 复习内核 (自适应 ease,失误不清零) ===== */

  else { let ivl=nextIvlAfterDone(r); if(elapsed>planned&&(ratingKey==="good"||ratingKey==="easy")) ivl=Math.max(ivl,elapsed); r.cps.push({id:uid(),stage:reviewCps(r).length+1,kind:"review",due:addDays(onDate,ivl),done:false,doneDate:null,rating:null,ivl,relearn:false}); }

/* ===== 4. 掌握度 & 熟悉度 ===== */
function strengthScore(r){ const s=db.settings,pending=reviewCps(r).find(c=>!c.done),last=r.cps.filter(c=>c.kind==="review"&&c.done).slice(-1)[0],ivl=pending?pending.ivl:(last?last.ivl:0); return clamp(ivl/(s.mastery.sCap||45),0,1); }

function partFamiliarity(r){ const sigs=[].concat(r.signals||[]); (r.examScores||[]).forEach(e=>sigs.push({part:e.part||e.layerId||"whole",value:(e.pct!=null?e.pct/100:e.value),date:e.date}));

  const out={}; Object.keys(byPart).forEach(p=>{ const arr=byPart[p].slice().sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0)); let num=0,den=0,w=1; for(let i=arr.length-1;i>=0;i--){ num+=arr[i].value*w; den+=w; w*=0.6; } out[p]=den?num/den:0; }); return out; }

function recordFamiliarity(reciteId,sig){ const r=db.recites.find(x=>x.id===reciteId); if(!r) return; sig=sig||{}; r.signals=r.signals||[]; r.signals.push({part:sig.part||"whole",value:clamp(sig.value,0,1),source:sig.source||"exam",date:sig.date||today()}); r.fam=famScore(r); }

/* ===== 5. 课程(=课程/规划/背诵 统一):按节奏自动排期,漏了整门顺延 ===== */
function lessonAmount(c){ const m={}; for(let i=1;i<=(c.doneThrough||0);i++) m[i]=1; (c.log||[]).forEach(e=>{ if(e.lesson!=null) m[e.lesson]=(m[e.lesson]||0)+(e.amount||1); }); return m; }
function courseProgress(c){ const m=lessonAmount(c); let s=0; for(const k in m) s+=Math.min(m[k],1); return s; }
function courseEvents(c){ const ev=[]; (c.log||[]).forEach(e=>ev.push({date:e.date,type:"done",amount:e.amount||1,sec:e.sec,lesson:e.lesson,half:e.half})); (c.misses||[]).forEach(m=>ev.push({date:m.date,type:"missed",lesson:m.lesson})); return ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }

function courseNextItem(c){ const m=lessonAmount(c),t=c.totalLessons||0; for(let n=1;n<=t;n++){ const a=m[n]||0; if(a<0.999) return {lesson:n,half:(a>=0.5)}; } return null; }

  let due=!lastEv?(c.startDate||today()):(lastEv.type==="missed"?addDays(lastEv.date,1):addDays(lastEv.date,c.cadenceDays||1)); let d=due<today()?today():due;
  items.forEach((it,i)=>{ if(d>h&&i>0) return; out.push({date:d,lesson:it.lesson,half:it.half,done:false,missed:false,overdue:i===0&&due<today(),upcoming:true}); d=addDays(d,c.cadenceDays||1); }); return out; }

  const items=futureItems(c); if(!items.length) return out; const ws=(c.rangeStart&&c.rangeStart>today())?c.rangeStart:today(); const we=c.rangeEnd||addDays(ws,items.length);

  items.forEach((it,i)=>{ const j=Math.min(D-1,Math.floor(i*D/K)); const dy=days[j]; load[dy]=(load[dy]||0)+1; out.push({date:dy,lesson:it.lesson,half:it.half,done:false,missed:false,overdue:false,upcoming:true}); }); return out; }
let GSCHED={};
/* 每天复习上限：把超过 cap 的复习按“最紧急/最脆弱优先保留”顺延到之后有空位的日子（只会往后、不会提前；逾期的先拉到今天）。 */
function capDailyReviews(){
  const cap=Math.max(1,db.settings.reviewCapPerDay||3), tdy=today(), hz=addDays(tdy,400);
  const list=[]; db.recites.forEach(r=>{ if(r.paused) return; reviewCps(r).forEach(cp=>{ if(!cp.done&&cp.due<=hz) list.push(cp); }); });
  list.sort((a,b)=> a.due<b.due?-1 : a.due>b.due?1 : ((a.ivl||1)-(b.ivl||1)) );
  const cnt={}; let changed=false;
  list.forEach(cp=>{ let d=cp.due<tdy?tdy:cp.due; while((cnt[d]||0)>=cap) d=addDays(d,1); if(d!==cp.due){ cp.due=d; changed=true; } cnt[d]=(cnt[d]||0)+1; });
  return changed; }
/* 每天新学上限：无课程归属的未完成首背，逾期先拉到今天，每天最多 newCapPerDay 章（当天已背完的也占名额），超出的按原顺序顺延到之后有空位的日子。 */
function capDailyMemos(){
  const cap=Math.max(1,db.settings.newCapPerDay||2), tdy=today(), hz=addDays(tdy,400);
  const cnt={}, list=[];
  db.recites.forEach(r=>{ const cp0=r.cps&&r.cps[0]; if(!cp0||cp0.kind!=="memorize"||r.courseId||r.paused) return;
    if(cp0.done){ if(cp0.doneDate) cnt[cp0.doneDate]=(cnt[cp0.doneDate]||0)+1; }
    else if(cp0.due<=hz) list.push({r,cp:cp0}); });
  list.sort((a,b)=> a.cp.due<b.cp.due?-1 : a.cp.due>b.cp.due?1 : 0 );
  let changed=false;
  list.forEach(o=>{ let d=o.cp.due<tdy?tdy:o.cp.due; while((cnt[d]||0)>=cap) d=addDays(d,1); if(d!==o.cp.due){ o.cp.due=d; o.r.date=d; changed=true; } cnt[d]=(cnt[d]||0)+1; });
  return changed; }
function reschedule(){ const chR=capDailyReviews(),chM=capDailyMemos(); if(chR||chM){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(db)); }catch(e){} } const h=addDays(today(),400),sched={},load={};

/* ===== 9.5 时间分配(当天/明天):指定起止 或 预计时长自动排;午/晚饭各留1.5h ===== */
function toMin(s){ if(!s) return 0; const m=String(s).split(":"); return (+m[0])*60+(+(m[1]||0)); }
function toHM(v){ v=Math.max(0,Math.round(v)); return pad(Math.floor(v/60)%24)+":"+pad(v%60); }
function fmtMins(m){ const h=Math.floor(m/60),mm=m%60; return ((h?h+"小时":"")+(mm?mm+"分":""))||"0分"; }

function subtractIntervals(win,blocks){ let free=[{s:win[0],e:win[1]}];
  blocks.slice().sort((a,b)=>a.s-b.s).forEach(b=>{ const next=[];
    free.forEach(f=>{ if(b.e<=f.s||b.s>=f.e){ next.push(f); return; } if(b.s>f.s) next.push({s:f.s,e:b.s}); if(b.e<f.e) next.push({s:b.e,e:f.e}); });

  it.plans.forEach(p=>{ if(p.done||p.missed) return; out.push({key:"P:"+p.id,label:(p.kind==="review"?"复习规划":p.content),color:p.color||"#8e8e93"}); });
  return out; }
function tpGet(dd){ db.timeplan=db.timeplan||{}; return db.timeplan[dd]||(db.timeplan[dd]={}); }

/* 计时控件:本项正在计时→暂停/继续/结束;无人计时→开始;别项计时→空。仅今天 */
function timerCtlHtml(key,dd){ if(dd!==today()) return '';
  if(taskTimer&&taskTimer.key===key) return '<span class="tk-run">⏱ <b id="taskDisp">'+fmtDur(taskElapsed())+'</b>'+(taskTimer.paused?'<button class="rb rb-good" data-tkresume="1">继续</button>':'<button class="rb" data-tkpause="1">暂停</button>')+'<button class="rb rb-skip" data-tkend="1">结束</button></span>';
  if(taskTimer) return '';

function autoDistribute(dd){ const tp=tpGet(dd),win=db.settings.timeplan.window,W=[toMin(win[0]),toMin(win[1])],plist=dayPlannables(dd);
  const fixed=[]; plist.forEach(p=>{ const e=tp[p.key]; if(e&&e.mode==="fixed"&&e.start&&e.end) fixed.push({s:toMin(e.start),e:toMin(e.end)}); });
  const meals=tpMeals().map(m=>({s:toMin(m.start),e:toMin(m.end)}));
  let free=subtractIntervals(W,fixed.concat(meals));
  const periods=tpPeriods(),prange=k=>{ const f=periods.find(x=>x[0]===k); return f?[toMin(f[2][0]),toMin(f[2][1])]:null; };
  const carve=(s,e)=>{ const nx=[]; free.forEach(f=>{ if(e<=f.s||s>=f.e){ nx.push(f); return; } if(f.s<s)nx.push({s:f.s,e:s}); if(e<f.e)nx.push({s:e,e:f.e}); }); free=nx; };

  autos.forEach(p=>{ const e=tp[p.key]; if(e.autoPeriod){ const r=prange(e.autoPeriod); if(r&&tryPlace(e,r)) done[p.key]=true; } });   // 先把指定了时段的排进各自时段
  autos.forEach(p=>{ if(done[p.key]) return; const e=tp[p.key]; if(tryPlace(e,null)) done[p.key]=true; else { e.start=null; e.end=null; e._un=true; } }); }
function renderTimeline(dd){ const tp=tpGet(dd),blocks=[];

function tpFixedControls(dd,p,e){ const periods=tpPeriods(),win=db.settings.timeplan.window;

/* 选做 2 章(2026-08-23 用户定):已复习过、今天没排也没碰的章里,最需要再看的 2 章(得分低+隔得久),有余力就点 */
function chScoreOf(cid){ const lg=(db.settings&&db.settings.selfLog)||[]; let sl=null;

  if(sl&&sl.score!=null) return {v:Math.round(sl.score),d:sl.d};
  let ex=null; db.recites.forEach(r=>{ if(r.contentId!==cid) return; (r.examScores||[]).forEach(e=>{ if(e.pct==null) return; if(!ex||String(e.date)>=String(ex.date)) ex=e; }); });
  const a=(sl&&sl.tot)?Math.round(100*(1-(sl.miss||0)/sl.tot)):null, b=ex?Math.round(ex.pct):null;
  if(a==null&&b==null) return null;

  ((db.settings&&db.settings.selfLog)||[]).forEach(e=>{ if(e.cid===cid&&String(e.d)>t) t=String(e.d); }); return t; }

let timerState=null;
function stopTimerInterval(){ if(timerState&&timerState.intervalId) clearInterval(timerState.intervalId); }
function startTimer(courseId,dd){ stopTimerInterval(); timerState={courseId,start:Date.now(),intervalId:null}; timerState.intervalId=setInterval(()=>{ const el=document.getElementById("timerDisp"); if(el) el.textContent=fmtDur((Date.now()-timerState.start)/1000); else stopTimerInterval(); },1000); renderDayPanel(dd); }
async function finishTimer(dd){ if(!timerState) return; const c=db.courses.find(x=>x.id===timerState.courseId),sec=Math.round((Date.now()-timerState.start)/1000); stopTimerInterval(); timerState=null;
  if(!c){ await save(); refreshDay(dd); return; }
  const isRec=c.kind==="recite";
  const rateHtml=isRec?('<div class="desc" style="margin:10px 0 3px">背得怎样（决定下次复习时间）：</div><div class="rate" id="ftRate">'+db.settings.levels.map(l=>'<button class="rb rb-'+l.key+'" data-r="'+l.key+'">'+esc(l.label)+'</button>').join('')+'</div>'):'';
  const body=openModal('<div class="d">这次完成了多少？</div>','<div class="msub">「'+esc(c.name)+'」· 本次用时 <b>'+fmtDur(sec)+'</b></div>'+
    '<div class="btnrow" style="margin-top:12px"><button class="btn" id="ftFull">完成 1 节</button><button class="btn sec" id="ftHalf">完成半节</button><button class="btn sec" id="ftCx">取消</button></div>'+rateHtml);
  let rating=null; if(isRec){ body.querySelectorAll('#ftRate button').forEach(b=>b.onclick=()=>{ rating=b.dataset.r; body.querySelectorAll('#ftRate button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }); }
  const fin=async(half)=>{ const o={sec}; if(half) o.half=true; if(isRec) o.rating=rating||"good"; completeCourseLesson(c,today(),o); await save(); closeModal(); refreshDay(dd); toast(half?"已完成半节，用时已记录":"已完成 1 节，用时已记录"); };

/* ----- 任务计时:开始/暂停/继续/结束 → 记录实际起止+用时;结束时问是否完成,完成则自动在左侧标完成 ----- */
let taskTimer=null;
function nowHM(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function parseKey(key){ const p=key.split(":"); if(p[0]==="L") return {kind:"lesson",courseId:p[1],lesson:+p[2]}; if(p[0]==="R") return {kind:"review",reciteId:p[1],cpId:p[2]}; return {kind:"plan",planId:p[1]}; }
function keyLabel(key){ const k=parseKey(key);
  if(k.kind==="lesson"){ const c=db.courses.find(x=>x.id===k.courseId); if(!c) return "(已删)"; const nm=(lessonMeta(c,k.lesson).name||"").trim(); return (nm||c.name)+" 第"+k.lesson+"节"; }
  if(k.kind==="review"){ const r=db.recites.find(x=>x.id===k.reciteId); return r?("复习 "+r.title):"(已删)"; }
  const p=db.plans.find(x=>x.id===k.planId); return p?(p.kind==="review"?"复习规划":p.content):"(已删)"; }
function keyColor(key){ const k=parseKey(key);
  if(k.kind==="lesson"){ const c=db.courses.find(x=>x.id===k.courseId); return c?courseColor(c):"#8e8e93"; }
  if(k.kind==="review"){ const r=db.recites.find(x=>x.id===k.reciteId); return r?reciteColor(r):"#8e8e93"; }
  const p=db.plans.find(x=>x.id===k.planId); return (p&&p.color)||"#8e8e93"; }
function stopTaskInterval(){ if(taskTimer&&taskTimer.intervalId) clearInterval(taskTimer.intervalId); }
function taskElapsed(){ if(!taskTimer) return 0; return taskTimer.accumSec+(taskTimer.paused?0:(Date.now()-taskTimer.startTs)/1000); }
function taskTick(){ taskTimer.intervalId=setInterval(()=>{ const el=document.getElementById("taskDisp"); if(el) el.textContent=fmtDur(taskElapsed()); else stopTaskInterval(); },1000); }
function tkRender(){ if(document.getElementById("dayPanel")) renderDayPanel(state.selDate); renderHomeSched(); }
function startTaskTimer(dd,key){ stopTimerInterval(); timerState=null; stopTaskInterval();
  const info=parseKey(key); let mem=false; if(info.kind==="review"){ const r=db.recites.find(x=>x.id===info.reciteId),cp=r&&r.cps.find(x=>x.id===info.cpId); mem=!!(cp&&cp.kind==="memorize"); }
  taskTimer={dd,key,startTs:Date.now(),accumSec:0,paused:false,startClock:nowHM(),mem,intervalId:null}; taskTick(); tkRender(); }
function pauseTaskTimer(dd){ if(!taskTimer||taskTimer.paused) return; taskTimer.accumSec=taskElapsed(); taskTimer.paused=true; stopTaskInterval(); tkRender(); }
function resumeTaskTimer(dd){ if(!taskTimer||!taskTimer.paused) return; taskTimer.startTs=Date.now(); taskTimer.paused=false; taskTick(); tkRender(); }
function endTaskTimer(dd){ if(!taskTimer) return; const total=Math.round(taskElapsed()); taskTimer.accumSec=total; taskTimer.paused=true; stopTaskInterval();
  const key=taskTimer.key,info=parseKey(key),label=keyLabel(key),startClock=taskTimer.startClock,endClock=nowHM();
  const isRec=info.kind==="lesson"&&((db.courses.find(c=>c.id===info.courseId)||{}).kind==="recite"),rate=isRec||info.kind==="review";
  let opts; if(rate) opts='<div class="desc" style="margin:10px 0 4px">完成并评「背得怎样」(点一下＝完成这节)：</div><div class="rate">'+db.settings.levels.map(l=>'<button class="rb rb-'+l.key+'" data-tkrate="'+l.key+'">'+esc(l.label)+'</button>').join('')+'</div><div class="btnrow" style="margin-top:10px"><button class="btn sec" id="tkInc">未完成（仅记录用时）</button><button class="btn sec" id="tkCx">取消</button></div>';
  else opts='<div class="btnrow" style="margin-top:12px"><button class="btn" id="tkDone">完成</button><button class="btn sec" id="tkInc">未完成（仅记录用时）</button><button class="btn sec" id="tkCx">取消</button></div>';
  const body=openModal('<div class="d">结束计时</div>','<div class="msub">'+esc(label)+'<br>开始 <b>'+startClock+'</b> · 结束 <b>'+endClock+'</b> · 用时 <b>'+fmtDur(total)+'</b></div>'+opts);
  const fin=(complete,rating)=>applyTaskTimer(dd,complete,rating,{start:startClock,end:endClock,sec:total});
  if(rate){ body.querySelectorAll('button[data-tkrate]').forEach(b=>b.onclick=()=>fin(true,b.dataset.tkrate)); } else { body.querySelector('#tkDone').onclick=()=>fin(true,null); }
  body.querySelector('#tkInc').onclick=()=>fin(false,null);
  body.querySelector('#tkCx').onclick=()=>{ closeModal(); tkRender(); }; }
async function applyTaskTimer(dd,complete,rating,actual){ if(!taskTimer) return; const key=taskTimer.key,info=parseKey(key),date=dd<=today()?dd:today();
  tpEntry(dd,key).actual={start:actual.start,end:actual.end,sec:actual.sec};
  if(complete){
    if(info.kind==="lesson"){ const c=db.courses.find(x=>x.id===info.courseId); if(c){ const o={lesson:info.lesson,sec:actual.sec}; if(c.kind==="recite") o.rating=rating||"good"; completeCourseLesson(c,date,o); } }
    else if(info.kind==="review"){ const r=db.recites.find(x=>x.id===info.reciteId); if(r){ if(taskTimer.mem) markMemorize(r,rating||"good",date); else rateReview(r,info.cpId,rating||"good",date); } }
    else { const p=db.plans.find(x=>x.id===info.planId); if(p){ p.done=true; p.missed=false; } }
  }
  stopTaskInterval(); taskTimer=null; await save(); closeModal(); refreshDay(dd); toast(complete?"已完成,实际用时已记录":"已记录实际用时"); }

/* ===== 10. 课程(统一:课程 / 规划 / 背诵) ===== */
function mountCourses(main){
  let h='<h2 class="mod-h">课程</h2><div class="mod-sub">课程 / 背诵 / 习题课都在这里建,这里管总体规划;每天的细节(完成、半节、没完成、补记、计时)在「日历」当天面板里调。两种排期:按节奏(每隔几天一节,漏了整体顺延)或按日期段(把剩余节数均匀铺到一段日期里,并参考各天负载尽量摊平)。背诵课每节完成后进入记忆曲线复习;习题课在主页可计时并记录每次用时。每门课自定颜色。</div>';
  h+='<div class="card"><h4>我的课程</h4><div id="courseList"></div><button class="btn sm" id="addCourse" style="margin-top:10px">＋ 新建课程</button></div>';
  main.innerHTML=h; renderCourseList();
  document.getElementById("addCourse").onclick=()=>editCourse(null);
}
let _courseOpen=null;
function renderCourseList(){
  const host=document.getElementById("courseList"); if(!host) return;
  if(!db.courses.length){ host.innerHTML='<div class="empty">还没有课程。点下面新建。</div>'; return; }
  host.innerHTML=db.courses.map(c=>{ const at=courseProgress(c),pct=c.totalLessons?Math.round(at/c.totalLessons*100):0,nx=courseNext(c),kindTxt=c.kind==="recite"?"背诵":c.kind==="exercise"?"习题":"课程";
    const sched=c.mode==="range"?('区间 '+(c.rangeStart||"?")+' → '+(c.rangeEnd||"?")):('每 '+c.cadenceDays+' 天一节');
    const atTxt=Number.isInteger(at)?String(at):(Math.floor(at)+'.5');
    let summary='';
    if(c.kind==="recite"){ const linkCnt=(c.lessons||[]).filter(l=>l&&l.contentId).length; summary='<div class="cs" style="margin-top:3px">逐节命名 / 链接：<b>'+linkCnt+'</b> / '+(c.totalLessons||0)+' 节已链接背诵库</div>'; }
    else if(c.kind==="exercise"){ const ts=exerciseTimes(c),totSec=ts.reduce((a,t)=>a+(t.sec||0),0); summary='<div class="cs" style="margin-top:3px">已计时 <b>'+ts.length+'</b> / '+(c.totalLessons||0)+' 节'+(ts.length?' · 总用时 <b>'+fmtDur(totSec)+'</b>':'')+'</div>'; }
    const canExpand=(c.kind==="recite"||c.kind==="exercise");
    const lessonsBtn=canExpand?'<button data-lc="'+c.id+'" title="'+(c.kind==="recite"?"各节命名 / 链接背诵库":"各节命名 / 用时")+'" style="'+(_courseOpen===c.id?'color:var(--tint)':'')+'">'+(c.kind==="recite"?"📖":"⏱")+'</button>':'';
    let row='<div class="crow"><span class="gdot" style="background:'+courseColor(c)+';width:14px;height:14px"></span><div class="ct"><div style="font-weight:600">'+esc(c.name)+' <span style="font-size:11px;color:var(--text2);font-weight:400">'+kindTxt+'</span></div><div class="cs">共 '+(c.totalLessons||"?")+' 节 · '+sched+' · 已完成 '+atTxt+' 节'+(nx?' · 下节 '+fmtLong(nx.due)+(nx.half?'(下半)':''):' · 已全部完成')+'</div><div class="mbar"><i style="width:'+clamp(pct,0,100)+'%;background:'+courseColor(c)+'"></i></div>'+summary+'</div><div class="gacts">'+lessonsBtn+'<button data-ec="'+c.id+'">✎</button><button data-dc="'+c.id+'">🗑</button></div></div>';
    if(_courseOpen===c.id&&canExpand) row+=lessonEditorHtml(c);
    return row;
  }).join("");
  host.querySelectorAll("button[data-lc]").forEach(b=>b.onclick=()=>{ _courseOpen=(_courseOpen===b.dataset.lc?null:b.dataset.lc); renderCourseList(); });
  host.querySelectorAll("button[data-ec]").forEach(b=>b.onclick=()=>editCourse(b.dataset.ec));
  host.querySelectorAll("button[data-dc]").forEach(b=>b.onclick=async()=>{ const c=db.courses.find(x=>x.id===b.dataset.dc); if(!confirm("删除「"+(c?c.name:"")+"」?它已生成的背诵复习也会一并删除。")) return; db.recites=db.recites.filter(r=>r.courseId!==b.dataset.dc); db.courses=db.courses.filter(x=>x.id!==b.dataset.dc); await save(); render(); });
  wireLessonEditor(host);
}
function ensureLessonSlot(c,i){ c.lessons=c.lessons||[]; while(c.lessons.length<i) c.lessons.push({name:"",contentId:null}); if(!c.lessons[i-1]) c.lessons[i-1]={name:"",contentId:null}; }
function syncLessonRecite(c,i){ const rec=db.recites.find(r=>r.courseId===c.id&&r.lesson===i); if(rec){ rec.title=lessonTitle(c,i); const m=lessonMeta(c,i); rec.contentId=m.contentId||null; rec.fam=famScore(rec); } }
function reciteStatBar(c){
  const recs=db.recites.filter(r=>r.courseId===c.id);
  const linkCnt=(c.lessons||[]).filter(l=>l&&l.contentId).length;
  if(!recs.length) return '<div class="recitebar" style="margin:0 0 12px;gap:16px"><span class="rb-off">还没有已背诵的节(完成某节后进入记忆曲线,这里显示平均掌握度)</span><span class="rb-meta">已链接背诵库 <b>'+linkCnt+'</b> / '+(c.totalLessons||0)+' 节</span></div>';
  const ms=recs.map(r=>mastery(r)),avg=ms.reduce((a,b)=>a+b,0)/ms.length;
  return '<div class="recitebar" style="margin:0 0 12px;gap:16px"><span class="rb-meta">已背诵 <b>'+recs.length+'</b> 节</span><span class="rb-meta">平均掌握度 <b>'+Math.round(avg*100)+'%</b></span><span class="rb-meta">已链接背诵库 <b>'+linkCnt+'</b> / '+(c.totalLessons||0)+' 节</span></div>';
}
function exerciseStatBar(c){
  const ts=exerciseTimes(c).filter(t=>t.sec!=null);
  if(!ts.length) return '<div class="recitebar" style="margin:0 0 12px"><span class="rb-off">还没有计时记录(在日历「▶ 开始计时」完成某节后显示)</span></div>';
  const secs=ts.map(t=>t.sec),avgAll=secs.reduce((a,b)=>a+b,0)/secs.length,last=secs[secs.length-1],last3=secs.slice(-3),avg3=last3.reduce((a,b)=>a+b,0)/last3.length;
  return '<div class="recitebar" style="margin:0 0 12px;gap:16px"><span class="rb-meta">已计时 <b>'+ts.length+'</b> 节</span><span class="rb-meta">平均用时 <b>'+fmtDur(avgAll)+'</b></span><span class="rb-meta">最近一次 <b>'+fmtDur(last)+'</b></span><span class="rb-meta">近'+last3.length+'次 <b>'+fmtDur(avg3)+'</b>（'+last3.map(fmtDur).join(' / ')+'）</span></div>';
}
function exerciseEditorHtml(c,n){
  let h='<div class="card" style="margin:2px 0 14px;background:var(--fill)"><h4 style="margin-bottom:6px">「'+esc(c.name)+'」每节命名 / 用时</h4>'+
    '<div class="desc" style="margin-bottom:10px">给每节起名(留空＝默认"'+esc(c.name)+' 第N节")。计时、完成、补记仍在「日历」当天面板里做;这里汇总查看。近几次用时只统计「有计时」的节,没计时的跳过、不计入也不计算。</div>';
  h+=exerciseStatBar(c);
  const doneMap={},missMap={},upMap={};
  (c.log||[]).forEach(e=>{ if(e.lesson==null) return; const d=(doneMap[e.lesson]=doneMap[e.lesson]||{sec:0,hasSec:false,amount:0,date:e.date,entries:[]}); if(e.sec!=null){ d.sec+=e.sec; d.hasSec=true; } d.amount+=(e.amount||1); d.date=e.date; d.entries.push(e); });
  (c.misses||[]).forEach(m=>{ if(m.lesson!=null&&missMap[m.lesson]==null) missMap[m.lesson]=m.date; });
  courseItems(c).forEach(x=>{ if(x.upcoming&&x.lesson!=null&&upMap[x.lesson]==null) upMap[x.lesson]=x.date; });
  h+='<div class="lessonscroll"><table class="lv"><thead><tr><th style="width:52px">节</th><th>名称</th><th style="width:46%">状态 / 用时</th></tr></thead><tbody>';
  for(let i=1;i<=n;i++){ const m=(c.lessons&&c.lessons[i-1])||{}; let stat;
    if(doneMap[i]){ const d=doneMap[i]; const mins=d.hasSec?Math.round(d.sec/60):'';
      let breakdown=''; const halfEntries=(d.entries||[]).filter(e=>(e.amount||1)<1);
      if(halfEntries.length){ const fh=(d.entries||[]).find(e=>(e.amount||1)<1&&!e.half), sh=(d.entries||[]).find(e=>e.half); const segs=['总 '+fmtDur(d.sec)]; if(fh&&fh.sec!=null) segs.push('前半 '+fmtDur(fh.sec)); if(sh&&sh.sec!=null) segs.push('后半 '+fmtDur(sh.sec)); breakdown=' <span class="rb-meta" style="font-size:11px;color:var(--text2)">（'+segs.join(' · ')+'）</span>'; }
      stat='<span style="color:var(--green)">✓ 完成</span>'+(d.amount<1?'（仅半节）':'')+' · 用时 <input type="number" min="0" step="1" data-extime="'+i+'" value="'+mins+'" placeholder="未计时" style="width:66px"> 分钟'+breakdown; }
    else if(missMap[i]!=null) stat='<span style="color:var(--red)">✗ 没完成</span>';
    else if(upMap[i]!=null) stat='<span class="rb-meta">待做 · '+fmtLong(upMap[i])+'</span>';
    else stat='<span style="color:var(--text2)">—</span>';
    h+='<tr><td>第'+i+'节</td><td><input type="text" data-ln="'+i+'" value="'+esc(m.name||"")+'" placeholder="'+esc(c.name+" 第"+i+"节")+'"></td><td>'+stat+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}
function lessonEditorHtml(c){
  const n=c.totalLessons||0;
  if(c.kind==="exercise") return exerciseEditorHtml(c,n);
  let h='<div class="card" style="margin:2px 0 14px;background:var(--fill)"><h4 style="margin-bottom:6px">「'+esc(c.name)+'」每节命名 / 链接背诵库</h4>'+
    '<div class="desc" style="margin-bottom:10px">给每节起名(留空＝默认"'+esc(c.name)+' 第N节")。链接到背诵库某一整章后,日历里复习这节可「先测验」,测验成绩会按设置里的权重并入掌握度、影响排期。</div>';
  if(!db.contents.length) h+='<div class="desc" style="margin-bottom:10px;color:var(--orange)">⚠ 背诵库还没有章节,先到「背诵库」上传章节,才能在这里链接。仍可先填名称。</div>';
  h+=reciteStatBar(c);
  const tdy=today();
  h+='<div class="lessonscroll"><table class="lv"><thead><tr><th style="width:44px">节</th><th>名称</th><th style="width:26%">链接背诵库(整章)</th><th style="width:42px;text-align:center">复习</th><th style="width:54px;text-align:center">掌握度</th><th style="width:74px;text-align:center">下次复习</th></tr></thead><tbody>';
  for(let i=1;i<=n;i++){ const m=(c.lessons&&c.lessons[i-1])||{};
    const rec=db.recites.find(r=>r.courseId===c.id&&r.lesson===i);
    const revTxt=rec?String(reviewCps(rec).filter(cp=>cp.done).length):'—';
    const masTxt=rec?(Math.round(mastery(rec)*100)+'%'):'—';
    const pend=rec?reviewCps(rec).find(cp=>!cp.done):null,overdue=pend&&pend.due<tdy&&!(rec&&rec.paused);
    const nextTxt=(rec&&rec.paused)?'⏸ 暂停':pend?(overdue?'逾期·'+fmtShort(pend.due):pend.due===tdy?'今天':fmtShort(pend.due)):'—';
    h+='<tr><td>第'+i+'节</td><td><input type="text" data-ln="'+i+'" value="'+esc(m.name||"")+'" placeholder="'+esc(c.name+" 第"+i+"节")+'"></td>'+
      '<td><select data-lk="'+i+'"><option value="">（不链接）</option>'+db.contents.map(ct=>'<option value="'+ct.id+'"'+(m.contentId===ct.id?' selected':'')+'>'+esc(ct.name)+'</option>').join('')+'</select></td>'+
      '<td style="text-align:center;color:var(--text2)">'+revTxt+'</td><td style="text-align:center;font-weight:600'+(rec?';color:var(--tint)':';color:var(--text2)')+'">'+masTxt+'</td>'+
      '<td style="text-align:center;font-size:12px'+(overdue?';color:var(--red);font-weight:700':pend&&pend.due===tdy?';color:var(--orange);font-weight:700':';color:var(--text2)')+'">'+nextTxt+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  return h;
}
function setExerciseTime(c,lesson,sec){ const entries=(c.log||[]).filter(e=>e.lesson===lesson); if(!entries.length) return; entries.forEach((e,i)=>{ e.sec=(sec==null)?null:(i===0?sec:0); }); }
function wireLessonEditor(host){
  host.querySelectorAll("input[data-ln]").forEach(inp=>inp.onchange=async()=>{ const c=db.courses.find(x=>x.id===_courseOpen); if(!c) return; const i=+inp.dataset.ln; ensureLessonSlot(c,i); c.lessons[i-1].name=inp.value; syncLessonRecite(c,i); await save(); });
  host.querySelectorAll("select[data-lk]").forEach(sel=>sel.onchange=async()=>{ const c=db.courses.find(x=>x.id===_courseOpen); if(!c) return; const i=+sel.dataset.lk; ensureLessonSlot(c,i); c.lessons[i-1].contentId=sel.value||null; syncLessonRecite(c,i); await save(); renderCourseList(); });
  host.querySelectorAll("input[data-extime]").forEach(inp=>inp.onchange=async()=>{ const c=db.courses.find(x=>x.id===_courseOpen); if(!c) return; const i=+inp.dataset.extime,v=inp.value.trim(),sec=(v===""?null:Math.max(0,Math.round(parseFloat(v)*60))); setExerciseTime(c,i,sec); await save(); renderCourseList(); });
}
function editCourse(id){
  const c=id?db.courses.find(x=>x.id===id):{ id:null,name:"",kind:"course",mode:"cadence",totalLessons:10,cadenceDays:2,startDate:today(),rangeStart:today(),rangeEnd:addDays(today(),30),doneThrough:0,color:APPLE_COLORS[db.courses.length%APPLE_COLORS.length] };
  let chosenColor=c.color, chosenKind=c.kind, chosenMode=c.mode||"cadence";
  const body=openModal('<div class="d">'+(id?"编辑课程":"新建课程")+'</div>',
    '<div class="field"><label>名称</label><input type="text" id="ecName" value="'+esc(c.name)+'" placeholder="如：马原 / 政治背诵 / 数学习题"></div>'+
    '<div class="field"><label>类型</label><div class="seg" id="ecKind"><button data-k="course" class="'+(chosenKind==="course"?"sel":"")+'">普通课程</button><button data-k="recite" class="'+(chosenKind==="recite"?"sel":"")+'">背诵</button><button data-k="exercise" class="'+(chosenKind==="exercise"?"sel":"")+'">习题课</button></div><div class="desc">背诵课每节完成后进入记忆曲线复习;习题课在主页可计时,记录每次用时。</div></div>'+
    '<div class="frow"><div class="field"><label>共几节</label><input type="number" id="ecTotal" min="1" value="'+(c.totalLessons||10)+'"></div>'+
    '<div class="field"><label>已学到第几节</label><input type="number" id="ecDone" min="0" value="'+(c.doneThrough||0)+'"><div class="desc">从下一节起排</div></div></div>'+
    '<div class="field"><label>排期方式</label><div class="seg" id="ecMode"><button data-m="cadence" class="'+(chosenMode==="cadence"?"sel":"")+'">按节奏</button><button data-m="range" class="'+(chosenMode==="range"?"sel":"")+'">按日期段</button></div></div>'+
    '<div id="ecCadBox" style="'+(chosenMode==="range"?"display:none":"")+'"><div class="field"><label>每隔几天一节</label><input type="number" id="ecCad" min="1" value="'+(c.cadenceDays||2)+'"></div><div class="field"><label>起始日</label><input type="date" id="ecStart" value="'+(c.startDate||today())+'"><div class="desc">从起始日起每隔这么多天排一节,漏了整体顺延。</div></div></div>'+
    '<div id="ecRngBox" style="'+(chosenMode==="range"?"":"display:none")+'"><div class="frow"><div class="field"><label>开始日期</label><input type="date" id="ecRS" value="'+(c.rangeStart||today())+'"></div><div class="field"><label>结束日期</label><input type="date" id="ecRE" value="'+(c.rangeEnd||addDays(today(),30))+'"></div></div><div class="desc">把剩余节数尽量均匀铺到这段日期:节数少于天数→隔天排,多于天数→某些天排两节;并参考各天已有负载尽量摊平。</div></div>'+
    '<div class="field"><label>颜色</label><div class="swatches" id="ecColors">'+APPLE_COLORS.map(col=>'<div class="sw'+(col===chosenColor?" sel":"")+'" data-col="'+col+'" style="background:'+col+'"></div>').join('')+'</div></div>'+
    '<button class="btn" id="ecSave" style="margin-top:6px">保存</button>');
  body.querySelectorAll("#ecKind button").forEach(b=>b.onclick=()=>{ chosenKind=b.dataset.k; body.querySelectorAll("#ecKind button").forEach(x=>x.classList.toggle("sel",x===b)); });
  body.querySelectorAll("#ecMode button").forEach(b=>b.onclick=()=>{ chosenMode=b.dataset.m; body.querySelectorAll("#ecMode button").forEach(x=>x.classList.toggle("sel",x===b)); const rng=chosenMode==="range"; body.querySelector("#ecCadBox").style.display=rng?"none":""; body.querySelector("#ecRngBox").style.display=rng?"":"none"; });
  body.querySelectorAll("#ecColors .sw").forEach(s=>s.onclick=()=>{ chosenColor=s.dataset.col; body.querySelectorAll("#ecColors .sw").forEach(x=>x.classList.toggle("sel",x===s)); });
  body.querySelector("#ecSave").onclick=async()=>{ const name=body.querySelector("#ecName").value.trim(); if(!name){ toast("请填名称"); return; }
    const total=Math.max(1,+body.querySelector("#ecTotal").value||1),done=Math.max(0,+body.querySelector("#ecDone").value||0),cad=Math.max(1,+body.querySelector("#ecCad").value||1),start=body.querySelector("#ecStart").value||today(),rs=body.querySelector("#ecRS").value||today(),re=body.querySelector("#ecRE").value||addDays(rs,total);
    const fields={name,kind:chosenKind,mode:chosenMode,totalLessons:total,doneThrough:done,cadenceDays:cad,startDate:start,rangeStart:rs,rangeEnd:re,color:chosenColor};
    if(id){ Object.assign(db.courses.find(x=>x.id===id),fields); } else db.courses.push(Object.assign({id:uid(),log:[],misses:[]},fields));

}

/* ===== 10.5 · 背诵库 + 考试 模块(由独立原型并入:编辑挖空 / 两栏出题 / 测验 / 成绩按层回写 recordExam) ===== */

/* ---------------- 背诵库 ---------------- */
let _libCourse=null,_libQuery="";
function mountLibrary(main,api){ hideSelbar(); if(_open){ renderChapter(main); return; } if(_libCourse){ renderCourseLibrary(main); return; } renderLibraryGroups(main); }
function reciteForLayer(cid,layerId){ return db.recites.find(r=>r.contentId===cid&&r.layerId===layerId)||null; }
function contentMasteryLine(c){ const recs=db.recites.filter(r=>r.contentId===c.id); if(!recs.length) return '';
  const ms=recs.map(r=>mastery(r)),avg=ms.reduce((a,b)=>a+b,0)/ms.length;
  return '<div class="meta">背诵条目 <b>'+recs.length+'</b> · 平均掌握 <b>'+Math.round(avg*100)+'%</b></div>'; }
function contentCourse(cid){ for(const c of db.courses){ if((c.lessons||[]).some(l=>l&&l.contentId===cid)) return c; } return null; }
function libGroups(){ const byId={},uncat=[];
  db.contents.forEach(ct=>{ const c=contentCourse(ct.id); if(c){ (byId[c.id]=byId[c.id]||{course:c,contents:[]}).contents.push(ct); } else uncat.push(ct); });
  const groups=[]; db.courses.forEach(c=>{ if(byId[c.id]) groups.push(byId[c.id]); });
  return {groups,uncat}; }
function libHeaderHtml(sub){ return '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 class="mod-h">背诵库</h2><p class="mod-sub">'+sub+'</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span id="libStatus" class="mod-sub"></span><button class="btn sec" id="btnLibDir" title="绑定 习思想 文件夹：以后每次打开自动把各章 HTML 的 var CHAPTER 同步进背诵库(覆盖内容、保留题库与掌握度)">📂 自动导入</button><button class="btn sec" id="btnLibResume" style="display:none">恢复自动导入</button><button class="btn sec" id="btnExam">📝 出题 / 测验</button><button class="btn" id="btnUpload">上传章节</button></div></div>'; }
function wireLibHead(head){ head.querySelector("#btnUpload").onclick=()=>openUpload(); const bex=head.querySelector("#btnExam"); if(bex) bex.onclick=()=>{ if(!db.contents.length){ toast("先上传章节,才能出题/测验"); return; } go("exam"); }; const bld=head.querySelector("#btnLibDir"); if(bld) bld.onclick=()=>pickLibDir(); const blr=head.querySelector("#btnLibResume"); if(blr) blr.onclick=()=>resumeLibDir(); setLibStatus(); }
function renderLibraryGroups(main){
  const head=document.createElement("div"); head.innerHTML=libHeaderHtml('按课程归类。点开某门课看它下面所有背诵章节,并可在课内「查询」含某词的句子并标出处。'); main.appendChild(head); wireLibHead(head);
  if(!db.contents.length){ const e=document.createElement("div"); e.className="kempty"; e.innerHTML='<div class="big">还没有章节</div>上传一份"挖空编辑器"导出的 HTML(含 <code>var CHAPTER</code> 与 <code>[[答案|R]]</code>)并命名,它就会出现在这里。'; main.appendChild(e); return; }
  const {groups,uncat}=libGroups();
